about:
  hero:
    tag: "ABOUT US"
    heading: "The first platform built to predict mental health crises — before they happen"
    p1: "Entrelacs is an AI-powered preventive mental health platform that screens, matches, and monitors individuals with clinical precision — detecting deterioration weeks before crisis, so the right support arrives before it's urgently needed."
    p2: "Built on three years of R&D, 80,000+ research articles, and clinical validation across 8 countries and 37 global markets, Entrelacs brings together dynamic psychometric modeling, conversational AI, and continuous monitoring into a single platform — designed for employers, clinicians, and health systems."
    p3: "We exist because mental health is the only area of medicine without a reliable early warning system. We're here to change that."
  vision_mission:
    heading: "Vision & mission"
    description: "A world where mental health crises are predicted, prevented, and no longer inevitable."
    cards:
      - title: "Vision"
        desc: "A future where mental health care works like every other area of medicine — with routine screening, early detection, and proactive intervention as the standard, not the exception."
      - title: "Mission"
        desc: "To make preventive mental health care universally accessible through advanced psychometrics and clinical-grade AI — giving individuals, clinicians, employers, and health systems the tools to act before crisis strikes."
  pillars:
    heading: "Our three pillars"
    t1: "Precision"          
    t2: "Personalization"
    t3: "Prevention"
    d1: "Screen with clinical accuracy, not guesswork. A 15-minute conversational assessment replaces fragmented questionnaires with objective, multi-dimensional risk stratification."
    d2: "Match to the right care pathway, first time. AI connects each individual to the most effective intervention from day one — reducing failed treatments and accelerating improvement by 2–3x."
    d3: "Detect deterioration before it becomes crisis. Continuous monitoring tracks passive signals between sessions, alerting care teams weeks before a crisis — turning reactive care into proactive care."
  story:
    heading: "Our story"
    subheading: "Born from an uncomfortable truth. Built to fix it."
    intro: "Entrelacs began with a question that sounds simple but turns out to be radical:"
    question: "What if the average<br>patient doesn't exist?"
    main_text: "For decades, mental health science has operated on a shared assumption: find the pattern that fits most people, build around that center, and apply it broadly. It's a reasonable approach. But for a significant share of the people those tools are meant to help, it produces the wrong answer. Depression doesn't look the same in every person. Neither does anxiety, loneliness, or burnout. A scale score that means one thing in one individual may mean something entirely different in another — not because the instrument is broken, but because human beings genuinely differ in how they experience psychological states. Recommending care based on that score, without understanding those differences, causes real harm. And because every misdiagnosis compounds — wrong pathway, wrong treatment, months or years lost — the cost of getting it wrong is preventable deterioration."
    hidden_text_1: "This isn't a fringe hypothesis. It's what the research increasingly shows. And it's what many clinicians — and many patients — already know from experience: finding the right mental health care, matched to who you actually are, is genuinely hard. When your assessment doesn't actually capture who you are, the care pathway it points to may be the wrong one entirely. And finding the right care — matched to who you actually are — is already genuinely hard, even for people with clinical training and system knowledge. The technology to do better now exists. What was missing was the will — and the team — to build it properly."
    hidden_text_2: "Entrelacs was founded to close that gap. Built on a foundation of open science — informed by 80,000+ research articles, and developed through years of interviews with individuals in 8 countries — Entrelacs brings together AI, dynamic psychometric modeling, and continuous monitoring to do what no mental health tool has done before: assess, match, and track the individual, not the average. And because the platform understands who each person is — not just what their score is — it can do something no reactive system can: identify deterioration before it becomes crisis, and connect people to the right support before it’s urgently needed."
    hidden_text_3: "Today, Entrelacs is moving toward CE Mark certification in 2027, with strategic partnerships spanning Stanford, UC Davis, Oxford, and the Psychological Science Accelerator — and a clear commercial pathway into the employers, health systems, and clinical networks that need it most."
    more: 'Read more'
    less: 'Collapse'
  founder:
    heading: "Founder story"
    subheading: "The scientist who stopped believing in the average person."
    name: "Dr. Hans Rocha IJzerman"
    role: "CEO & Co-Founder"
    intro: "It took two decades inside the mainstream to understand exactly why it was asking the wrong question."
    pullquote: "\"Entrelacs isn't built for the average patient — because that patient doesn't exist. It's built for the actual, specific, irreducibly individual human being who needs care.\""
    body: "A scientist who had spent years working within the mainstream — and slowly, reluctantly, became convinced it was asking the wrong question. A clinician who saw daily what happened when tools ignored those differences. A family that had felt the cost firsthand. That combination is what became Entrelacs."
    extended_story:
      - "Dr. Hans Rocha IJzerman left the Netherlands at 18 to play basketball in America. He ended up in rural Pennsylvania, at a small Benedictine college in the hills — Saint Vincent, where Fred Rogers, the beloved American television host known as Mister Rogers, had studied theology and first developed the convictions that would define his life’s work. The Benedictine monks who shaped the college had followed the same Rule for fifteen centuries: welcome every stranger, attend to every individual, treat no person as interchangeable with any other. It was something you could actually feel — in the way strangers were welcomed, in the weight given to listening, in the assumption that every person in the room had something irreplaceable to offer."
      - "For a young Dutch kid far from home, navigating a culture not his own, something about that community lodged deep. Not the theology — but the underlying conviction that every human being is specific, irreducible, and not interchangeable with any other."
      - "It's a conviction his own life has never let him forget. His family is Brazilian, Dutch, and French all at once — his children grow up navigating languages and worlds that don't map cleanly onto each other. The idea that a single instrument, designed for a single 'average' human, could capture what any one of them is going through has always felt, to him, self-evidently absurd."
      - "For two decades, that conviction sat uneasily alongside the dominant logic of his own field."
      - "Early in his career, Hans immersed himself in the study of honor culture — fascinated by how profoundly context shapes behavior and self-understanding. The lesson the data kept teaching was the same one he’d felt instinctively: who a person is changes what everything means. The same action, the same word, the same experience — interpreted through a different life, a different culture, a different self — is not the same thing."
      - "But mainstream psychology, including his own field, kept reaching for the average. Measure large groups. Find the central tendency. Build tools around that center. It was practical. It was scalable. And for a long time, Hans worked within that logic too — because it was the field’s logic, and because the tools to do otherwise didn’t yet exist. What changed, slowly and then undeniably, was the evidence."
      - "The moment the research made this undeniable came through an unexpected subject: romantic love. Hans and his collaborators set out to test whether the standard instruments used to measure relationship quality actually measured the same thing across different people. The answer was no — clearly, empirically, reproducibly no. Of course people experience love differently depending on who they are. And if that was true for love, the implications for depression, anxiety, loneliness, and every other psychological construct that clinical tools relied on were significant. The average wasn't just imprecise. It was systematically missing something."
      - "The clinical cost of that gap was something Hans saw through his partner, Daniela, a psychologist with 15 years of practice. She encountered it constantly — the difficulty of interpreting scale scores that didn't mean what they appeared to mean, the real risk of sending someone down the wrong treatment pathway because the instrument hadn't been built to understand them as an individual. Paul Meehl had spent decades arguing that clinicians needed better actuarial tools to translate assessment data into good decisions. Decades later, the tools still hadn't caught up."
      - "And then there was the experience — shared, in some form, by most families — of trying to find the right mental health care for someone you love. Not care in the abstract. The right care, for this person, now. Even with clinical training and with system knowledge. The mismatch between individual need and available support is not a minor inefficiency. It causes harm that compounds."
      - "A scientist who had spent years working within the mainstream — and slowly, reluctantly, became convinced it was asking the wrong question. A clinician who saw daily what happened when tools ignored those differences. A family that had felt the cost firsthand. That combination is what became Entrelacs."
      - "Entrelacs isn't built for the average patient — because that patient doesn't exist. It's built for the actual, specific, irreducibly individual human being who needs care."     
