home:
  meta:
    title: "Entrelacs"
  video_link: https://www.youtube.com/embed/KT3zVYqUUn4?si=zRbS_7o-PsrSFgDD
  hero:
    title_prefix: "The asset your company runs on has never been measured."
    tag_text: "Brain Health. Personal, Private, Precise."
    wheel:
      item1: "when it matters"
      item2: "with clinical AI"
      item3: "before crisis"
      item4: "when it matters"
    cta_waitlist: "Join our waiting list"
    cta_demo: "Request a demo"
  problem:
    tag: "Why now"
    heading: "You measure every asset <br> you manage. Except this one."
    description: "Finance has a ledger. Sales has a pipeline. Infrastructure has uptime. The asset all three depend on—your people's capacity to think, adapt, and work together—is the only one without a measurement. As AI absorbs the routine, your people's capacity is now the single biggest factor in your organization's success. The OECD calls it brain capital. Companies pour 93% of their AI budgets into technology and 7% into the people who have to absorb it (Deloitte, 2026). Nobody develops what they can't measure."
    image: "/images/problem-hero.png"
    cardiology:
      title: "In cardiology"
      desc: "We catch warning signs years before a heart attack."
    oncology:
      title: "In oncology"
      desc: "We screen before symptoms appear."
    workforce:
      title: "But in workforce <br> brain health"
      desc: "There is no screen and no baseline. Nothing gets measured until something breaks, and the first data point is the exit interview."
    stats:
      - value: "20%"
        text: "of employees worldwide are engaged at work — a post-2020 low, costing an estimated $10 trillion in lost productivity"
        source: "Gallup, 2026"
      - value: "49%"
        text: "of U.S. workers now describe themselves as struggling — more than thriving (46%), for the first time on record"
        source: "Gallup, 2026"
      - value: "42%"
        text: "believe disclosing a mental health struggle would damage their career"
        source: "NAMI & Ipsos, 2025"
      - value: "<10%"
        text: "EAP utilization — though 82% of employers offer one"
        source: "SHRM, 2024–2025"
  cost:
    heading: "The cost of waiting"
    description: "We're missing the early signs that could prevent bigger problems down the road, waiting until someone is already struggling before we act."
    stats:
      - value: "€600B"
        text: "Annual cost in EU alone from reactive mental health care."
      - value: "10–20%"
        text: "YoY growth in mental health claims seen by payers."
      - value: "€15K"
        text: "Lost per employee annually in productivity and turnover."
  pillars:
    heading: "From reactive to preventive in three steps"
    description: "Three pillars that move mental health care from reactive crisis response to proactive, measurable outcomes."
    cta: "Join the waiting list"
    list:
      - image: "/images/dart-mission-goal-success.svg"
        tag: "PRECISION"
        title: "Screen with clinical accuracy, not guesswork"
        desc: "One 15-minute conversational assessment creates a unique mental health profile for each individual - replacing lengthy and burdensome traditional assessment."
      - image: "/images/health.svg"
        tag: "PERSONALIZATION"
        title: "No more trial-and-error referrals"
        desc: "AI matches each individual to the most effective intervention from day one — reducing failed treatments and accelerating time to improvement by 2–3x."
      - image: "/images/fraudprotectmajor.svg"
        tag: "PREVENTION"
        title: "Detect deterioration weeks before crisis"
        desc: "Continuous digital monitoring tracks changes in engagement, language patterns, and behavioral signals between sessions, alerting care teams days to weeks before a crisis — turning reactive care into preventive care."
  how_it_works:
    tag: "The instrument"
    heading: "One private conversation. <br> One precise measurement. <br> A direction you can act on."
    description: "An employee talks with Entrelacs — a brief, natural conversation, not a form, but a conversation partner. Underneath runs Lacis, our psychometric engine, which does what no survey does: it measures that specific person."
    cards:
      screen:
        title: "Person-specific, not <br> population-average"
        desc: "A survey scores your answers against a norm. Lacis models you, and returns a picture of how your own connection actually works rather than the average of everyone else's."
      match:
        title: "Where to act, <br> not just a score"
        desc: "44 domains, 26 in life and 18 at work. Each person gets a Key Connection Signature — the five areas carrying the most weight right now — and a Connection Keystone: the one place where acting carries furthest."
      monitor:
        title: "Private for the person, <br> patterns for the organization"
        desc: "Employees get a confidential picture of their own connection. Leaders get aggregated patterns across groups of ten or more, with recommendations matched to the team's profile. Never an individual."
  trust:
    tag: "Trust architecture"
    heading: "Private employee data is protected, free of management supervision. Private by design."
    description: "Every workplace tool that routes sensitive data to management gets the same result: people stop telling the truth. 42% believe disclosing a mental health struggle would damage their career (NAMI & Ipsos, 2025). The reverse is just as well documented: people are measurably more honest with a system when no one who evaluates them is watching (Lucas et al., 2014)."
    employee:
      title: "What stays with the employee"
      items:
        - "Individual responses are never exposed to the employer"
        - "Personal baselines and history belong to the employee alone"
        - "The employee controls sharing and deletion at any time"
        - "Participation is voluntary; consent is explicit and revocable"
    organization:
      title: "What the organisation sees:"
      items:
        - "Aggregate patterns only, never individuals"
        - "Cohorts of at least ten people"
        - "No path from a group result back to a person"
        - "Research use requires separate, revocable consent"
    note: "Without that condition the measurement would not be valid. <br> Entrelacs is a private mirror that serves the employee first, not a monitor that reports on them."
  research:
    heading: "Research-grade rigor, real-world proof"
    description: "Grounded in 80,000+ research articles, validated across 8 countries, and backed by €3M in EU funding."
    partnership: "Developed in partnership with WHO and EU policy frameworks"
    stats:
      - value: "80K+"
        label: "Research articles reviewed"
      - value: "8"
        label: "Countries validated"
      - value: "€3M"
        label: "EU research funding awarded"
      - value: "CE Mark"
        label: "Certification pathway, 2027"
  partners:
    heading: "Developed in collaboration with the world's leading research institutions"
    description: "Entrelacs is built on global scientific partnerships that ensure every clinical claim is grounded in evidence."
    logos:
      - src: "/images/university_of_california.png"
      - src: "/images/oecd.png"
      - src: "/images/university_of_oxford.png"
      - src: "/images/stanford_university.png"
      - src: "/images/european_commission.png"
        style: "max-height: 80px;"
  scientific_credibility:
    tag: "Scientific credibility"
    title: "Research-grade, <br> by construction."
    text_intro: "Built by researchers who spent two decades documenting why standard instruments fail individuals — then built the instrument the evidence called for."
    stats:
      - value: "9,000+"
        desc: "research articles screened across seven languages, mapping every validated social-connection instrument in the literature"
      - value: "354"
        desc: "in-depth interviews across eight countries and five continents, coded into the domain model"
      - value: "€3M"
        desc: "EU Horizon LONELY-EU program, led by our CEO as Principal Investigator"
      - value: "FDA"
        subtitle: "Pre-Submission filed"
        desc: "pursuing De Novo classification; CE Mark Class IIa targeted 2027"
    bottom_text: "Developed with strategic advisors at Stanford and UC Davis, an Oxford research affiliation through our CEO, alongside WHO and OECD policy work on social connection."
  help_now:
    heading: "If you need help now"
    intro1: "Entrelacs is a measurement instrument, not a crisis service. If you need help now, it can only point you toward it."
    intro2: "If you're struggling, or worried about someone else, talk to a person — your doctor, a crisis line, or someone you trust. Your employer is not involved and cannot see that you looked."
    items:
      - label: "US"
        text: "988 Suicide & Crisis Lifeline, call or text 988"
      - label: "France"
        text: "3114, national suicide prevention line"
      - label: "UK"
        text: "Samaritans, 116 123"
      - label: "Elsewhere"
        text: "lists services by country"
        link_text: "findahelpline.com"
        link: "https://findahelpline.com"
      - label: "Immediate danger"
        text: "emergency services"
    outro: "If something in your report worried you, take it to a professional rather than sitting with it."
    image: "/images/helpNow.jpg"
  who_we_serve:
    tag: "Who we serve"
    heading: "Built for the workplace. <br> Engineered to clinical standards."
    cards:
