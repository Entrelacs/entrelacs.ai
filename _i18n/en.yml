employers:
  meta:
    title: "Entrelacs for Employers"
  hero:
    eyebrow: "ENTRELACS FOR EMPLOYERS"
    title: "Your benefits stack is fully funded. It just can't see who needs it."
    description: "As AI absorbs routine execution, what remains is the work most sensitive to how your people are actually doing — judgment, adaptation, collaboration. That capacity is brain capital, and it sits on no dashboard you own. Entrelacs measures it through social connection, the determinant with the strongest evidence and the lowest burden — and measures it one person at a time, because an average tells you the group is struggling without telling you who, or why."
    cta_demo: "Request a demo"
    cta_sample: "See a sample report"
  credibility:
    items:
      - "FDA Pre-Submission filed"
      - "Built alongside a €3M EU Horizon LONELY-EU research program"
      - "Advised by researchers at Stanford and UC Davis"
      - "Aligned with WHO and OECD policy work on social connection"
  decade:
    tag: "The problem"
    title: "A decade of spending. Still no signal."
    intro:
      - "Organizations put 93% of AI spending into technology and 7% into enabling the people expected to absorb it (Deloitte, Tech Trends 2026). What decides the return is your people's capacity to adapt — what the OECD calls brain capital. It can't be tested directly: a cognitive test becomes a performance exam the moment you repeat it. So it has to be read through its determinants, and nobody does."
      - "The tools that come closest wouldn't help if they did. They score people against a population mean, so two employees returning the same number can be depleted for entirely different reasons. One person has no one to turn to; another feels they are not recognized. Both score a 5.5 out of 7 on your test. A decade of spend on EAPs, wellness apps and engagement surveys produced programs, not measurement. Every one of them is blind in the same place:"
    rows:
      - title: "The EAP waits to be called — and mostly isn't."
        text: "82% of employers offer one; utilization sits in the low single digits"
        source: "SHRM, 2024"
      - title: "The engagement survey reports averages"
        text: "A few times a year, it describes the group — never the individual — and employees answer knowing results roll up to management. 42% believe disclosing a mental health struggle would damage their career"
        source: "NAMI & Ipsos, 2025"
      - title: "Point solutions require a raised hand"
        text: "Every tool activates only when a struggling employee self-identifies in an environment where doing so feels risky. Roughly 97% of users of standalone digital mental health tools drop out within 30 days; median 30-day retention is 3.3%"
        source: "Baumel et al., 2019"
    stats:
      - value: "1 in 5"
        text: "employees worldwide report feeling lonely a lot of the previous day"
        source: "Gallup, 2024"
      - value: "$154B"
        text: "estimated annual cost of the workplace connection deficit in lost productivity and absenteeism"
        source: "U.S. Surgeon General, 2023"
      - value: "50–55%"
        text: "of U.S. jobs expected to be reshaped by AI within two to three years"
        source: "Boston Consulting Group, 2026"
      - value: "2.2%"
        text: "of companies assessed run employee surveys focused on health and wellbeing"
        source: "S&P Global / McKinsey Health Institute, 2025"
    footer: "By the time risk shows up in an exit interview, you're reading history. The gap isn't another program. It's measurement."
  three_moves:
    tag: "How it works"
    title: "From unmeasured to actionable, in three moves"
    accordion:
      - title: "A conversation, not a survey"
        text: "Employees talk privately with Entrelacs — about fifteen minutes the first time. Lacis places each person with people whose psychology moves the way theirs does, then draws only the questions that carry real information for someone in that group. Connection is the entry point for a reason: among the determinants of brain health it carries the strongest evidence at the lowest burden, and it is the only one you can measure repeatedly without the measurement becoming a test."
        image: "/images/employersPage/accordion1.png"
      - title: "A private mirror for every employee"
        text: "Each person receives a confidential picture of their own connection: their Key Connection Signature, the five areas that matter most for them right now, and within it the Connection Keystone, the one place where acting would help most. The reading serves the employee first, which gives people a reason of their own to come back. Management is locked out in the architecture, not in a policy."
        image: "/images/employersPage/accordion2.png"
      - title: "True patterns for your organization"
        text: "You see aggregated, anonymized patterns across cohorts of ten or more: which teams' connection is eroding, which domains are driving it, and where your existing programs are most needed. At a 1,000-person organization that typically means readouts by department, site, and function, with every cohort at or above the privacy threshold. No individual is ever exposed, and employees know it. That is why the data you act on is data people gave honestly."
        image: "/images/employersPage/accordion3.png"
    note: "See what you'd get — an annotated sample of the organizational dashboard and one anonymized individual report, including the in-product label that tells employees how their data is aggregated (“these results are aggregated across 15 employees”). We show the privacy architecture rather than describing it."
    cta_sample: "See a sample report"
  cohort:
    tag: "What you do with the signal"
    title: "When a cohort's capacity starts eroding"
    subtitle: "Measurement only matters if it changes a decision. Two loops run from day one."
    employee_card:
      title: "The employee's loop, private"
      text: "Each person sees their own signature and keystone, alongside insights they can use. No one reports on them; what they do with it is theirs alone."
    org_card:
      title: "Your loop, aggregate"
      text: "The dashboard shows you, for example, that one function's workplace-connection domains have eroded two readings in a row, concentrated in employees' psychological safety — people don't feel they can speak up without it costing them. That is actionable: coach managers on how they respond to mistakes and dissent, clarify roles and decision rights, reset team norms on raising concerns. These are directional workforce signals, not clinical alerts on individuals, and we provide clinician-built governance guidance on how to respond. Read across a quarter, the same readouts tell you something no engagement survey can: whether the parts of your organization absorbing the most AI-driven change are holding their capacity, or quietly losing it."
    roadmap:
      title: "On the roadmap"
      text: "A recommendation system for building brain capital at team level, in-product routing that connects each person privately to the named resources in your benefits stack — never a report on an individual to the employer — plus HRIS and collaboration tool integrations."
    consent:
      title: "Your consent, in four lines"
      items:
        - "Participation is voluntary. Not participating has no visibility to your employer."
        - "Consent is explicit and revocable at any point. Withdrawing it stops collection."
        - "Research use is a separate consent, asked separately and withdrawable separately."
        - "Infrastructure is encrypted and GDPR-compliant, with EU hosting for European deployments and HIPAA-aligned handling in care settings."
  stop_guessing:
    tag: "Why different"
    title: "Stop guessing. Start measuring."
    description: "Entrelacs does not compete with your EAP, your clinical platform, or your wellness benefits. It is the measurement layer they have always been missing. Your stack was built to respond; what it lacks is the instrument that shows where response is needed. In a consolidation review, Entrelacs shows which lines are earning their renewal and which are not — and because it measures the determinant of cognitive capacity rather than sentiment, it answers a question your stack was never built to answer: whether your workforce can carry the change you're asking of it."
    accordion:
      - title: "Individual, not average — which is what makes it an instrument"
        text: "Every other tool in this budget measures sentiment or delivers care, and scores people against a population mean. Entrelacs measures the determinant of cognitive capacity person by person: the first workplace instrument we know of that models each individual on their own baseline. Brain capital measured on averages isn't brain capital measurement — it's an engagement survey with new vocabulary."
      - title: "Honest, by architecture"
        text: "Survey platforms cannot model individuals without becoming surveillance; care platforms cannot measure everyone without abandoning the care model they sell. The privacy lockout is the mechanism that makes the data true, and it is a position incumbents structurally cannot copy."
      - title: "Clinically grounded"
        text: "Built on five years of research — 354 in-depth interviews across eight countries and five continents, a systematic review of the world's validated social-connection instruments, and psychometric validation study with representative samples from three countries — and engineered to clinical standards: patent-pending measurement method, FDA Pre-Submission filed, De Novo classification being pursued. A level of rigor no wellness app or survey vendor carries."
  what_you_get:
    tag: "What's live and what's next"
    title: "What you get today — and where the instrument is going."
    live:
      title: "Live now (V1)"
      items:
        - "Conversational, person-specific assessment of social connection (44 domains: 26 life, 18 workplace)"
        - "Individual connection profile per employee: five-domain signature and highest-leverage keystone"
        - "Brain capital reporting at cohort level: which parts of the organization are holding capacity and which are eroding"
        - "Directional cohort trend reporting across readings — where connection is moving, and in which domains. Not prediction."
        - "Aggregated organizational dashboard (cohorts of ten or more): patterns, trends, domain drivers"
        - "GDPR-compliant infrastructure; privacy-first architecture with employee-owned data"
    roadmap:
      title: "On the roadmap"
      items:
        - "Personalized private recommendations matched to each employee's keystone, from an evidence-tagged intervention library (V1.3)"
        - "Validated predictive early warning from longitudinal measurement (in validation for V2)"
        - "Additional domains beyond connection, including dimensions of depression and anxiety, on the same scientific pipeline"
        - "In-product routing to the named resources in your benefits stack — private to the employee, never a report to the employer — plus HRIS and collaboration-tool integrations"
    disclaimer: "We publish this distinction on purpose. Buyers in this category have been promised too much, too vaguely, for a decade — and we would rather lose a deal on what we can't do yet than win one on it."
  faq:
    title: "Frequently asked questions"
    items:
    - q: "What can my organization actually see?"
      a: "Aggregated, anonymized patterns across cohorts of at least ten people: trends, domains, direction. Never an individual's responses, scores, or identity. The same plain-language one-pager we give your employees describes exactly what you can and cannot see."
    - q: "Why will employees use this when they don't use our EAP?"
      a: "The EAP asks a struggling person to raise a hand. Entrelacs gives every person a private reading of their own connection. That is a design bet, and we treat it like one: participation and return-use rates are reported to you quarterly, from your own workforce."
    - q: "Why measure connection rather than testing cognitive capacity directly?"
      a: "Because a cognitive test at workforce scale becomes a performance exam. People optimize for it, it can't be repeated at cadence, and it produces evaluation anxiety in exactly the population you're trying to protect. Brain capital has to be measured through its determinants, and connection is the only one that can be measured continuously without the measurement changing the thing measured."
    - q: "How does this connect to our AI investment?"
      a: "Directly. The return on AI depends on whether people can take on more strategic work, adapt fast enough, and implement the change. You already measure the technology side of that investment in detail. This is the instrument for the other side, on the same quarterly cadence."
    - q: "Our engagement platform is adding wellbeing scores. Isn't that the same thing?"
      a: "No, and the difference is structural rather than a feature gap. An engagement platform reports averages to management, because managers are the buyer. That architecture cannot produce person-level measurement without becoming surveillance, and it cannot produce honest data while employees know results roll up. Adding a wellbeing question to a survey built on averages gives you a new number with the same two defects: it can't tell you who, and it can't tell you why."
    - q: "Does this replace anything we already have?"
      a: "It replaces guesswork, not programs. Entrelacs is the measurement layer over your existing stack — it shows where your EAP, clinical platform and wellbeing spend are needed, and in a consolidation review, which lines are earning their renewal."
  final_cta:
    badge: "Brain Health. Personal, Private, Precise."
    title: "Start measuring the asset everything else depends on."
    subtext: "We're building our next design-partner cohort with a small group of employers who want early access, direct input into the roadmap, and a proactive way to protect their people."
    cta_primary: "Request a demo"
    cta_secondary: "Apply to be a design partner →"


employees:
  meta:
    title: "Entrelacs for Employees"
  hero:
    eyebrow: "ENTRELACS FOR EMPLOYEES"
    title: "Fifteen minutes for a read on your own life, not a comparison to everyone else's."
    description: "Entrelacs measures social connection — the driver of brain capital with the strongest evidence behind it and the lowest burden to measure. It measures it for you specifically, not against a population average. Your employer bought the instrument. They cannot see your answers, now or ever."
    cta_sample: "See a sample report"
    cta_employer: "Skip to what your employer sees"
    image: "/images/employeesPage/hero.webp"
  why_bother:
    tag: "Why you'd bother"
    title: "The output is yours first. That's the design, not a courtesy."
    text: "Most workplace surveys ask you questions and hand the data straight to management. You get a slide in an all-hands six weeks later. Naturally, you answer carefully rather than honestly."
    text2: "The measurement only works on honest answers, and nobody answers honestly for a system that gives them nothing back. So it has to be worth your time on the first conversation, and worth even more on the tenth."
  forty_two:
    tag: "What it actually tells you"
    title: "\"I'm fine, I'm just tired\" is one sentence covering 42 different things."
    text: "When something's off, most people have one word for it. Tired. Flat. Off. One feeling, so it gets one explanation — usually work, or sleep, or yourself."
    text2: "Underneath are dozens of separate things, and they're all facets of one: how you're connected to the people around you. Whether there's anyone you can be completely open with. Whether some part of you worries about being a bother. Whether a normal week holds real contact or mostly logistics. Whether you could say a difficult thing at work without it costing you. Whether the work you do gets noticed by anyone."
    text3: "Entrelacs reads 44 of these — 26 across your life, 18 at work, read separately because they don't move together. Social connection is what gets measured for a good reason: of everything that shapes how you're doing, it carries the strongest evidence and the lightest measurement burden. So the report tells you what your forty-two add up to — where you stand on burnout, loneliness, low mood and physical health — and which connection domain is driving it. Indications, not diagnoses, with the lever attached."
    text4: "A vague, heavy feeling becomes specific things in specific places. Specific things can be worked on. Vague ones can only be endured."
    image: "/images/employeesPage/forty-two.webp"
  four_moves:
    tag: "How it reads you"
    title: "Four moves. The method is called Key Signature Reconstruction — here's what each part does for you."
    subtitle: "This is the part that makes it different from every survey you've been sent. Not the questions. What happens to your answers."
    accordion:
      - title: "It works out who to read you alongside."
        text: "Not people who look like you on paper, but people whose patterns rise and fall together over time. Which means the conclusions actually apply to you — the reason generic advice so often lands wrong is that it was derived from an average across everyone, and the average person doesn't exist."
        image: "/images/employeesPage/accordion1.png"
      - title: "It stops asking you things it can already work out."
        text: "It draws only the questions that carry real information for someone like you, and reconstructs the rest. Fifteen minutes instead of an hour, with no stretch of irrelevant questions. Most people notice the opposite of survey fatigue — a question arrives that feels uncomfortably well-aimed."
        image: "/images/employeesPage/accordion2.png"
      - title: "It maps you as a system, not a scorecard."
        text: "Your answers become a network where things hold each other up. That explains what never made sense: why you can be fine on paper and not fine, why the obvious fix didn't help, why one loss seemed to take three things with it."
        image: "/images/employeesPage/accordion3.png"
      - title: "It tells you the one place to push."
        text: "Among everything the model reads, one point moves the rest of the network more than any other. That is your keystone — the single place where effort is most likely to ripple out everywhere else, so you're not left guessing where to start."
        image: "/images/employeesPage/accordion4.png"
  remembers:
    tag: "What changes when it remembers you"
    title: "Most tools tell you how you compare. This one tells you how you've changed."
    text: "Every wellbeing app you've tried scored you against other people, which is why the number never meant much — it couldn't tell you whether a hard month was a real shift or just a hard month. Entrelacs builds a model of you specifically, so it can notice when you have moved."
    image: "/images/employeesPage/remembers.webp"
    cards:
      - title: "Fewer questions, not more"
        text: "As it learns what's stable about you, it stops asking. The conversation gets shorter each time."
      - title: "You find out whether it worked"
        text: "Act on your keystone, and next time you can see whether the network moved. Advice is everywhere; evidence that your effort changed your situation is not."
      - title: "You see drift before it becomes a bad month"
        text: "With enough history the model can flag when your patterns start shifting the way they usually shift before things get difficult — early, quietly, and to you. Nobody else is told, ever."
      - title: "It re-reads you when your life changes"
        text: "New manager, new city, new baby. Yours gets re-estimated, because the point was never to file you into a type."
    note:
      title: "Where this stands today"
      text: "The person-specific model, your signature, your keystone and asking questions about your own report are live now. Continuity between conversations, the shortening assessment and personal early warning are in development. We'll tell you when each arrives, and none of it changes who can see your data."
  the_line:
    tag: "The line"
    title: "What your employer sees. And what they never will."
    you_card:
      title: "What you see"
      text: "Your answers. Your words. Your report. Your signature. Your keystone. How all of it changes over time — the history, which is the part that becomes most useful to you."
      image: "/images/employeesPage/what-you-see.webp"
    them_card:
      title: "What they see"
      text: "Patterns across groups of ten people or more. Where connection is eroding across a team or a function, and which support resources they already pay for are actually needed. Never attributable to a person. No individual, identifiable result reaches management at any time, in any form — including if they ask for it."
      image: "/images/employeesPage/what-they-see.webp"
    notes:
      - title: "Why ten"
        text: "Below that threshold a group average can be worked backwards to individuals. So there is no reporting below it. Not a smaller number for a smaller team, not an exception for a senior request. It is a property of the system, not a policy someone administers."
      - title: "Where your data sits"
        text: "Your individual profile is encrypted to you. Your employer's reporting layer is a separate, downstream system that only ever receives thresholded aggregates. The two are not joined by a permission setting somebody could change."
    consent:
      title: "Your consent, in four lines"
      items:
        - "Participation is voluntary. Not participating has no visibility to your employer"
        - "Consent is explicit and revocable at any point. Withdrawing it stops collection"
        - "Research use is a separate consent, asked separately and withdrawable separately"
        - "Infrastructure is encrypted and GDPR-compliant, with EU hosting for European deployments and HIPAA-aligned handling in care settings"
    later:
      title: "Coming later, and only if you opt in"
      text: "A future version will be able to use signals you already generate — a history you export yourself, or wearable data such as sleep and heart-rate variability — to sharpen the picture between conversations. Opt-in, initiated by you, revocable, routed to your own profile. It never passes through your employer, it does not exist in the version you are using today, and it will never be switched on for you by someone else."
  ai_question:
    tag: "The AI question"
    title: "Yes, there's an AI. No, it isn't the thing assessing you."
    text: "You should be skeptical of AI in anything touching mental health. General-purpose chatbots are poor at high-stakes judgment, they tend to agree with you rather than assess you, and almost none have been evaluated over time."
    text2: "So we didn't build one. The language model handles the conversation: it turns what you say into structured inputs, and explains your results back to you in plain language. That is the whole of its job."
    text3: "It does not score you. It does not assess you. It does not diagnose you. Every measurement and every network calculation runs deterministically in Lacis — auditable and traceable. The structure it places you in was learned in advance from five years of research; it is not improvised in the moment by a generative model."
    image: "/images/employeesPage/ai-question.webp"
  faq:
    title: "Frequently asked questions"
    items:
    - q: "How long does it take?"
      a: "About fifteen minutes the first time, and less after that as the instrument learns what it can stop asking."
    - q: "How often will I be asked?"
      a: "As often as it's useful to you. There is no mandated cadence and no reminder you can't turn off. Most people find a check-in worthwhile when something has changed, or every few months."
    - q: "Will it remember me between conversations?"
      a: "Today each conversation stands on its own, and your profile persists so you can see your previous report. Continuity is in development. When it arrives it will be yours, encrypted to you, and still invisible to your employer."
    - q: "Can my manager ask for my results?"
      a: "They can ask. There is nothing to give them — individual results do not exist in any form your employer can reach."
    - q: "What if I stop halfway through?"
      a: "Nothing happens. Participation is voluntary throughout and consent is revocable, and neither is visible to your employer."
    - q: "What if I'm the only person on my team using it?"
      a: "Then there is no cohort, and nothing is reported. Ten is the floor."
    - q: "What if I just don't recognize myself in the report?"
      a: "Say so, in the conversation. You can ask why it read you that way and what would change the picture. The model is a reconstruction, not a ruling, and a mismatch is useful information rather than an argument you have to win."
    - q: "What if I'm not okay right now?"
      a: "See the block at the foot of every page. Entrelacs isn't the right thing to reach for in a hard moment, and it will point you to what is."
    - q: "What happens to my profile if I leave the company?"
      a: "[DECISION NEEDED — see build notes. Do not publish this page without an answer here; the sections above make every reader ask it.]"
    - q: "Who do I contact about my data?"
      a: "Our Data Protection Officer handles anything to do with your data — access, corrections, deletion, and consent, including withdrawing it. Reach them at dpo@entrelacs.ai. Your employer is not involved in these requests and cannot see them."


care_settings:
  meta:
    title: "Entrelacs for Care Settings"
  hero:
    eyebrow: "ENTRELACS FOR CARE SETTINGS"
    title: "Your patients live between your appointments. Measurement should too."
    description: "Entrelacs is building the person-specific measurement instrument for mental health care — conversational, clinically grounded, and engineered toward regulatory clearance. We're opening a limited clinical partner programme for the clinics, health systems and research groups that will shape that path with us."
    cta_primary: "Talk to our clinical team"
    cta_secondary: "Explore research collaboration"
  the_gap:
    tag: "The gap"
    title: "Care is continuous. Measurement is episodic."
    text: "Clinical assessment today happens at the moments care can see: intake, sessions, crisis. Between those moments, where deterioration takes shape, standard instruments are silent. And the instruments themselves were normed on populations, not persons: two patients with identical scores can be struggling for entirely different reasons, and a score benchmarked against the average patient can point a clinician toward the wrong pathway for the real one."
    text2: "The measurement science to do better now exists. Person-specific network modeling — the approach at Entrelacs' core — reads each individual against their own subgroup baseline rather than a population norm, and reports not just severity but which domain matters most for that person."
  brings:
    tag: "What Entrelacs brings"
    title: "Measurement built for individuals — designed for clinical standards from day one."
    accordion:
      - title: "A validated, person-specific instrument"
        text: "Lacis builds a person-specific model of social connection and its impact on well-being. Patients engage with the conversational interface, while the deterministic psychometrics run reliably underneath. The AI handles the conversation; it doesn't score, assess, or diagnose."
      - title: "Clinical governance, not just claims"
        text: "Our Chief Clinical Officer is a practicing clinical psychologist with fifteen years in care. We are forming a six-member cross-market Clinical Advisory Board, anchored in the US and France, with at least half its seats held by clinicians currently seeing patients, to govern the platform's clinical boundaries."
      - title: "A regulatory trajectory, stated precisely"
        text: "Entrelacs today is a measurement and development instrument — not a diagnostic, not a treatment — deployed within clinical boundaries governed by our CCO and advisory board. We have filed an FDA Pre-Submission and are pursuing De Novo classification in the US, alongside CE Mark Class IIa in the EU targeted for 2027, supported by ongoing validation studies and a French clinical track."
  partnership:
    tag: "Partnership"
    title: "Where this goes next — with partners, not just customers."
    text: "The same instrument that makes workforce capacity measurable is being built toward population-scale mental health measurement: the early-detection foundation that cardiology and oncology have relied on for decades. Getting there takes longitudinal evidence generated in real care settings."
    subtitle: "Who we're building this with"
    cards:
      - text: "Clinics and health systems deploying the instrument commercially on per-patient platform fees, generating real-world evidence with us"
      - text: "Research groups in our multi-country validation network, building the longitudinal cohorts behind the next generation of the engine"
      - text: "Payers and public health bodies exploring what person-specific connection measurement means for population risk — a conversation that becomes commercial after clearance, and starts now."



the_science:
  meta:
    title: "Entrelacs — The Science"
  hero:
    title: "The average person doesn't exist. We stopped measuring them."
    description: "Entrelacs is built on a finding the field spent decades resisting: psychological instruments normed on populations systematically mismeasure individuals. Lacis, our proprietary engine, models one person at a time. That changes what measurement can do."
    cta_demo: "Request a demo"
    cta_sample: "See a sample report"
  problem:
    tag: "The average problem"
    title: "Why every survey you've taken was built for someone who isn't real."
    stat1_value: "4,063"
    stat1_label: "pilots measured on ten dimensions"
    stat2_value: "0"
    stat2_label: "fit the average on all ten"
    paragraphs:
      - "In 1952, the U.S. Air Force measured 4,063 pilots on ten dimensions to design a cockpit for the average pilot. Zero pilots fit the average on all ten. The fix — the adjustable seat — established the first law of personalization: you don't fit the human to the mean, you build the instrument around the individual (Daniels, 1952; Rose, 2016)."
      - "Psychological measurement never had its adjustable seat. Engagement surveys, wellbeing questionnaires and most clinical scales still ask everyone the same questions and score answers against a population mean, carrying an assumption the measurement literature has formally rejected: that group-level statistics describe individuals (Molenaar, 2004). Two people with identical scores can be struggling for entirely different reasons. An average-based instrument can't tell them apart. And when a score drives a decision — a benefits allocation, a care pathway — mismeasurement compounds into real harm."
      - "Our founding team spent two decades inside that problem as researchers, and helped produce the evidence that made it undeniable, including showing empirically that standard instruments don't measure the same construct across different people. Entrelacs is the instrument they built in response."
  engine:
    tag: "The engine"
    title: "Lacis: person-specific measurement, engineered."
    description: "Tailored questions and a clear map of your connections to show you exactly what to change."
    ksr_title: "The four stages of the KSR (Key Signature Reconstruction) method — patent pending"
    accordion:
      - title: "Your subgroup, not the population"
        text: "Before asking anything that matters, Lacis places you with people whose psychology moves the way yours does over time — a subgroup narrow enough that a conclusion drawn about the group is formally valid for the individual inside it. Population statistics assume this condition. They almost never meet it."
        image: "/images/theSciencePage/engine-mockup.png"
      - title: "The most informative questions, for you"
        text: "Once Lacis has your subgroup, it selects the questions that carry the most information for someone like you — not a fixed battery answered by everyone, but the smallest set of items that resolves uncertainty about your specific pattern fastest."
        image: "/images/theSciencePage/engine-mockup.png"
      - title: "44-domain network modeling"
        text: "Your answers are mapped into a network of 44 psychological domains, capturing how they relate to and reinforce one another for you specifically, rather than scoring each domain in isolation the way traditional instruments do."
        image: "/images/theSciencePage/engine-mockup.png"
      - title: "Signature and keystone"
        text: "From that network, Lacis extracts your signature — the handful of domains driving the rest — and your keystone, the single lever most likely to move the whole system if you act on it."
        image: "/images/theSciencePage/engine-mockup.png"
    why_connection:
      title: "Why connection first"
      text: "Brain capital cannot be tested directly at workforce scale; the test itself would become a performance exam. It can be measured through its determinants, and among them social connection carries the strongest evidence base at the lowest measurement burden. The same engine is built to extend to further determinants, including dimensions of depression and anxiety, on the same validation pipeline."
    why_now:
      title: "Why now"
      text: "The components have precedents. Regulators have already certified conversational clinical assessment as a medical device in Europe, and payers already fund the detection of loneliness in covered populations. What no one had assembled is a person-specific instrument for the workforce — the position Entrelacs is built to occupy."
  trust:
    tag: "Trust"
    title: "The measurement belongs to the person being measured."
    paragraphs:
      - "A measurement instrument that people answer strategically is not measuring what it claims to. This is the failure mode legacy tools never solved: engagement surveys route answers to management, 42% of employees believe disclosure would damage their career (NAMI & Ipsos, 2025), and the resulting data is biased in a direction no statistical correction recovers. Entrelacs treats the trust architecture as part of the instrument."
      - "The employee uses a private interface and gets results immediately: their own signature, keystone, and first move. Their answers, text, and data are encrypted and never shown to management or HR. The organization only sees patterns across groups of ten or more.  Never who said what."
      - "This isn't a privacy feature bolted onto a measurement product. It's the precondition for the measurement being true. People tell a mirror things they will not tell an employer."
  ai_boundary:
    tag: "The AI boundary"
    title: "What the AI does — and what it's forbidden to do."
    paragraphs:
      - "Buyers are right to be wary of generative AI in mental health. The research is blunt: general-purpose models perform poorly at high-risk clinical tasks, tend to agree with users rather than assess them, and are almost never evaluated longitudinally."
      - "Entrelacs is built against those failure modes. The large language model manages the conversation: it turns natural dialogue into structured inputs and explains results in plain, supportive language. As validated items move into conversational phrasing, each one passes psychometric-equivalence checks before it ships — response distributions, completion rates, and item functioning benchmarked against the original instrument."
    cards:
      - title: "It never scores, assesses or diagnoses."
        text: "All measurement, subgrouping, network estimation, and recommendation logic runs deterministically in Lacis — auditable, traceable, and grounded in a validated research corpus. The subgroup structure itself is learned offline from our research base, not invented in the moment by a generative model."
      - title: "Entrelacs is not a therapy service and not a crisis service."
        text: "When a conversation surfaces acute distress, a signposting protocol governed by our Chief Clinical Officer directs the person to human help and crisis resources immediately. The instrument measures; people care for people."
  solution:
    tag: "Validation & partnerships"
    title: "Grounded in a research asset a competitor can't shortcut."
    intro: "Lacis is calibrated on a proprietary research substrate built over five years by Annecy Behavioral Science Lab (ABSL), to which Entrelacs holds the exclusive commercial license — open as science, exclusive as an enterprise asset. Its two longest-lead inputs are complete: a field-wide review screening 9,032 articles across seven languages, mapping every validated social-connection instrument in the literature; and a cross-cultural corpus of 354 in-depth interviews across eight countries and five continents, coded into the 44-domain model. Both took years. A competitor starts from zero on both — it cannot be reproduced by web-scraping or reading the same published literature, and it compounds with every deployment."
    foundations:
      columns:
        - title: "Global policy & research"
          items:
            - "ABSL’s work anchors the EU’s social-connection monitoring framework and informs the WHO’s development of a Global Index for Social Connection"
            - "EU Horizon Europe - €3M LONELY-EU research project"
            - "OECD cooperation on social health measurement"
            - "Oxford University research affiliation"
        - title: "Academic network"
          items:
            - "Psychological Science Accelerator — research network spanning 80+ countries (our CSO is Associate Director)"
            - "Strategic advisors at Stanford (Dr. Michal Kosinski — AI behavioral prediction) and UC Davis (Dr. Emorie Beck — personalized psychological measurement)"
        - title: "Published, not just asserted"
          items:
            - "Paris, B., Ropovik, I., Silan, M., d’Hombres, B., Casabianca, E., & IJzerman, H. (2026). Evaluating loneliness measurements across the European Union. Collabra: Psychology, 12(1)."
            - "Coll-Planas, L., Akhter-Khan, S. C., Longworth, G., Srivastava, P., Mosalakanti, S., Silan, M. A., IJzerman, H., & McHugh Power, J. (2026). Rethinking loneliness interventions. — Why connection must be supported at the level of the individual, not the population."
            - "Silan, M. A. (2024). Rethinking multi-site studies in social and personality psychology. Social and Personality Psychology Compass. — The cross-cultural validity problem the 354-interview corpus was built to solve."
            - "Mosalakanti, S., Paris, B., Brickau, D., Luhmann, M., & Rocha IJzerman, H., (2026, August 25). A systematic review of social connection inventories."
            - "Molenaar, P. C. M. (2004). A manifesto on psychology as idiographic science: Bringing the person back into scientific psychology, this time forever. Measurement: Interdisciplinary Research and Perspectives, 2(4), 201–218."
            - "Borsboom, D. (2017). A network theory of mental disorders. World Psychiatry, 16(1), 5–13."
            - "Holt-Lunstad, J., Smith, T. B., Baker, M., Harris, T., & Stephenson, D. (2015). Loneliness and social isolation as risk factors for mortality: A meta-analytic review. Perspectives on Psychological Science, 10(2), 227–237."
            - "World Health Organization. (2025). From loneliness to social connection: Charting a path to healthier societies. Report of the WHO Commission on Social Connection. WHO."
            - "Office of the U.S. Surgeon General. (2023). Our epidemic of loneliness and isolation: The U.S. Surgeon General’s advisory on the healing effects of social connection and community. U.S. Department of Health and Human Services."
    in_progress_label: "In progress:"
    in_progress_text: "further peer-reviewed publications from the Entrelacs validation program in preparation; longitudinal validation cohorts underway; clinical outcome tracking in pilot settings."
  certifications:
    tag: "Regulatory & security"
    title: "Engineered to clinical standards. Certified step by step."
    status:
      title: "Status today"
      text: "A measurement and development instrument — deliberately not a diagnostic or treatment device, with clinical boundaries governed by our CCO and Clinical Advisory Board."
    items:
    - q: "FDA (US)"
      a: "Pre-Submission filed; pursuing De Novo classification (no clear predicate device exists — the route for novel instruments)"
    - q: "CE Mark (EU)"
      a: "Class IIa, targeted 2027"
    - q: "Clinical governance"
      a: "Clinical Advisory Board forming — six members across the US and France, at least half of them clinicians currently seeing patients; software development under ISO 13485/14971 discipline"
    - q: "Intellectual property"
      a: "The KSR measurement method is patent-pending (U.S. provisional application filed June 2026)"
    - q: "Data protection"
      a: "GDPR-compliant, encrypted infrastructure; EU data hosting for European deployments; multi-jurisdiction compliance programme (EU, UK, Swiss, US including state privacy laws)"
    - q: "Care settings"
      a: "HIPAA-aligned data handling"
    - q: "Security certification"
      a: "SOC 2 Type II audit preparation in progress; ISO 27001 on the roadmap — security documentation available to procurement teams on request"
    - q: "Reporting threshold"
      a: "Aggregation threshold of ten or more for any organisational reporting; voluntary participation with transparent, revocable consent, including for research use"

