home:
  meta:
    title: "Entrelacs"
  video_link: https://www.youtube.com/embed/8Fzfn64_KF0?si=t0QUz5IS1bdXzJmB
  hero:
    tag_text: "Santé cérébrale. Personnelle, privée, précise."
    title_prefix: "L'actif sur lequel repose votre entreprise n'a jamais été mesuré."
    wheel:
      item1: "quand cela compte"
      item2: "avec l'IA clinique"
      item3: "avant la crise"
      item4: "quand cela compte"
    cta_waitlist: "Rejoignez notre liste d’attente"
    cta_demo: "Demander une démo"
  problem:
    tag: "Pourquoi maintenant"
    heading: "Vous mesurez chaque actif <br> que vous gérez. Sauf celui-ci."
    description: "La finance a son grand livre. Les ventes ont leur pipeline. L'infrastructure a son taux de disponibilité. L'actif dont ces trois dépendent — la capacité de vos collaborateurs à penser, s'adapter et travailler ensemble — est le seul qui ne soit pas mesuré. À mesure que l'IA absorbe les tâches routinières, la capacité de vos collaborateurs devient le principal facteur de succès de votre organisation. L'OCDE appelle cela le capital cérébral. Les entreprises consacrent 93 % de leurs budgets IA à la technologie et seulement 7 % aux personnes qui doivent l'absorber (Deloitte, 2026). On ne développe pas ce qu'on ne mesure pas."
    image: "/images/problem-hero.png"
    cardiology:
      title: "En cardiologie"
      desc: "Nous détectons les signes avant-coureurs des années avant une crise cardiaque."
    oncology:
      title: "En oncologie"
      desc: "Nous effectuons des dépistages avant l'apparition des symptômes."
    workforce:
      title: "Mais côté santé <br> cérébrale au travail"
      desc: "Il n'y a ni dépistage ni référence de base. Rien n'est mesuré jusqu'à ce que quelque chose se brise, et le premier point de données est l'entretien de départ."
    stats:
      - value: "20 %"
        text: "des employés dans le monde sont engagés au travail — un minimum depuis 2020, coûtant environ 10 000 milliards $ en productivité perdue"
        source: "Gallup, 2026"
      - value: "49 %"
        text: "des travailleurs américains se décrivent désormais comme étant en difficulté — plus que ceux qui s'épanouissent (46 %), une première"
        source: "Gallup, 2026"
      - value: "42 %"
        text: "pensent que révéler une difficulté de santé mentale nuirait à leur carrière"
        source: "NAMI & Ipsos, 2025"
      - value: "<10 %"
        text: "taux d'utilisation des programmes d'aide aux employés — alors que 82 % des employeurs en proposent un"
        source: "SHRM, 2024–2025"
  cost:
    heading: "Le coût de l'attente"
    description: "Nous manquons les signes avant-coureurs qui pourraient prévenir des problèmes plus importants à l'avenir, en attendant que quelqu'un soit déjà en difficulté avant d'agir."
    stats:
      - value: "600 Md€"
        text: "Coût annuel dans la seule UE dû aux soins de santé mentale réactifs."
      - value: "10–20 %"
        text: "Croissance annuelle des demandes de remboursement en santé mentale observées par les payeurs."
      - value: "15 K€"
        text: "Perte par employé et par an en productivité et en rotation du personnel."
  pillars:
    heading: "De la réactivité à la prévention en trois étapes"
    description: "Trois piliers qui font passer les soins de santé mentale d'une réponse réactive aux crises à des résultats proactifs et mesurables."
    cta: "Rejoindre la liste d'attente"
    list:
      - image: "/images/dart-mission-goal-success.svg"
        tag: "PRÉCISION"
        title: "Un dépistage d'une précision clinique, sans approximations"
        desc: "Une évaluation conversationnelle de 15 minutes crée un profil de santé mentale unique pour chaque individu, remplaçant les évaluations traditionnelles longues et fastidieuses."
      - image: "/images/health.svg"
        tag: "PERSONNALISATION"
        title: "Fini les orientations par essais et erreurs"
        desc: "L'IA associe chaque individu à l'intervention la plus efficace dès le premier jour, réduisant ainsi les échecs de traitement et accélérant le temps d'amélioration de 2 à 3 fois."
      - image: "/images/fraudprotectmajor.svg"
        tag: "PRÉVENTION"
        title: "Détecter la détérioration des semaines avant la crise"
        desc: "La surveillance numérique continue suit les changements d'engagement, les modèles linguistiques et les signaux comportementaux entre les séances, alertant les équipes de soins des jours, voire des semaines avant une crise, transformant ainsi les soins réactifs en soins préventifs."
  how_it_works:
    tag: "L'instrument"
    heading: "Une conversation privée. <br> Une mesure précise. <br> Une direction sur laquelle agir."
    description: "Un employé s'entretient avec Entrelacs — une conversation brève et naturelle, pas un formulaire, mais un partenaire de conversation. En arrière-plan fonctionne Lacis, notre moteur psychométrique, qui fait ce qu'aucune enquête ne fait : il mesure cette personne en particulier."
    cards:
      screen:
        title: "Propre à la personne, <br> pas à la moyenne de la population"
        desc: "Une enquête évalue vos réponses par rapport à une norme. Lacis vous modélise et renvoie une image du fonctionnement réel de vos propres liens, plutôt que la moyenne de tout le monde."
      match:
        title: "Où agir, <br> pas seulement un score"
        desc: "44 domaines, 26 dans la vie et 18 au travail. Chaque personne obtient une Signature de Connexion Clé — les cinq domaines qui pèsent le plus lourd en ce moment — et une Pierre Angulaire de Connexion : l'endroit où agir porte le plus loin."
      monitor:
        title: "Privé pour la personne, <br> des tendances pour l'organisation"
        desc: "Les employés obtiennent une image confidentielle de leurs propres liens. Les dirigeants obtiennent des tendances agrégées sur des groupes de dix personnes ou plus, avec des recommandations adaptées au profil de l'équipe. Jamais un individu."
  trust:
    tag: "Architecture de confiance"
    heading: "Les données privées des employés sont protégées, à l'abri de la supervision de la direction. Privé par conception."
    description: "Tout outil de travail qui achemine des données sensibles vers la direction obtient le même résultat : les gens cessent de dire la vérité. 42 % pensent que révéler une difficulté de santé mentale nuirait à leur carrière (NAMI & Ipsos, 2025). L'inverse est tout aussi bien documenté : les gens sont mesurablement plus honnêtes avec un système lorsque personne ne les évalue (Lucas et al., 2014)."
    employee:
      title: "Ce qui reste avec l'employé"
      items:
        - "Les réponses individuelles ne sont jamais exposées à l'employeur"
        - "Les référentiels personnels et l'historique appartiennent uniquement à l'employé"
        - "L'employé contrôle le partage et la suppression à tout moment"
        - "La participation est volontaire ; le consentement est explicite et révocable"
    organization:
      title: "Ce que voit l'organisation :"
      items:
        - "Uniquement des tendances agrégées, jamais des individus"
        - "Des cohortes d'au moins dix personnes"
        - "Aucun lien entre un résultat de groupe et une personne"
        - "L'usage à des fins de recherche nécessite un consentement distinct et révocable"
    note: "Sans cette condition, la mesure ne serait pas valide. <br> Entrelacs est un miroir privé qui sert d'abord l'employé, pas un moniteur qui rapporte à son sujet."
  research:
    heading: "Rigueur de niveau recherche, preuves en conditions réelles"
    description: "Fondé sur plus de 80 000 articles de recherche, validé dans 8 pays et soutenu par 3 millions d'euros de financement de l'UE."
    partnership: "Développé en partenariat avec l'OMS et les cadres politiques de l'UE"
    stats:
      - value: "+ de 80 K"
        label: "Articles de recherche examinés"
      - value: "8"
        label: "Pays validés"
      - value: "3 M€"
        label: "Financement de recherche de l'UE accordé"
      - value: "Marquage CE"
        label: "Parcours de certification, 2027"
  partners:
    heading: "Développé en collaboration avec les plus grandes institutions de recherche au monde"
    description: "Entrelacs repose sur des partenariats scientifiques mondiaux qui garantissent que chaque allégation clinique est fondée sur des preuves."
    logos:
      - src: "/images/university_of_california.png"
      - src: "/images/oecd.png"
      - src: "/images/university_of_oxford.png"
      - src: "/images/stanford_university.png"
      - src: "/images/european_commission.png"
        style: "max-height: 80px;"
  scientific_credibility:
    tag: "Crédibilité scientifique"
    title: "De qualité recherche, <br> par construction."
    text_intro: "Conçu par des chercheurs qui ont passé deux décennies à documenter pourquoi les instruments standards échouent auprès des individus — puis ont construit l'instrument que les preuves exigeaient."
    stats:
      - value: "9 000+"
        desc: "articles de recherche examinés dans sept langues, cartographiant chaque instrument de connexion sociale validé dans la littérature"
      - value: "354"
        desc: "entretiens approfondis menés dans huit pays et cinq continents, codés dans le modèle de domaine"
      - value: "3 M€"
        desc: "programme EU Horizon LONELY-EU, dirigé par notre PDG en tant qu'investigateur principal"
      - value: "FDA"
        subtitle: "Dossier de pré-soumission déposé"
        desc: "poursuivant une classification De Novo ; marquage CE de classe IIa visé pour 2027"
    bottom_text: "Développé avec des conseillers stratégiques à Stanford et UC Davis, une affiliation de recherche à Oxford par l'intermédiaire de notre PDG, ainsi que des travaux politiques auprès de l'OMS et de l'OCDE sur la connexion sociale."
  help_now:
    heading: "Si vous avez besoin d'aide maintenant"
    intro1: "Entrelacs est un instrument de mesure, pas un service de crise. Si vous avez besoin d'aide maintenant, il peut seulement vous orienter vers elle."
    intro2: "Si vous êtes en difficulté, ou inquiet pour quelqu'un d'autre, parlez à une personne — votre médecin, une ligne de crise, ou quelqu'un en qui vous avez confiance. Votre employeur n'est pas impliqué et ne peut pas voir que vous avez consulté cela."
    items:
      - label: "États-Unis"
        text: "988 Suicide & Crisis Lifeline, appelez ou envoyez un texto au 988"
      - label: "France"
