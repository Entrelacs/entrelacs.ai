employers:
  meta:
    title: "Entrelacs pour les Employeurs"
  hero:
    eyebrow: "ENTRELACS POUR LES EMPLOYEURS"
    title: "Votre budget avantages sociaux est intégralement financé. Il ne voit simplement pas qui en a besoin."
    description: "À mesure que l'IA absorbe l'exécution routinière, ce qui reste est le travail le plus sensible à la manière dont vos équipes se portent réellement — jugement, adaptation, collaboration. Cette capacité est du capital cérébral, et elle ne figure sur aucun tableau de bord que vous possédez. Entrelacs la mesure à travers le lien social, le déterminant disposant des preuves les plus solides et de la charge la plus faible — et la mesure personne par personne, car une moyenne vous dit que le groupe est en difficulté sans vous dire qui, ni pourquoi."
    cta_demo: "Demander une démo"
    cta_sample: "Voir un exemple de rapport"
  credibility:
    items:
      - "Pre-Submission FDA déposée"
      - "Développé avec un programme de recherche EU Horizon LONELY-EU de 3 M€"
      - "Conseillé par des chercheurs de Stanford et UC Davis"
      - "Aligné sur les travaux politiques de l'OMS et de l'OCDE sur le lien social"
  decade:
    tag: "Le problème"
    title: "Une décennie de dépenses. Toujours aucun signal."
    intro:
      - "Les organisations consacrent 93 % de leurs dépenses en IA à la technologie et 7 % à préparer les personnes censées l'absorber (Deloitte, Tech Trends 2026). Ce qui détermine le retour sur investissement, c'est la capacité d'adaptation de vos équipes — ce que l'OCDE appelle le capital cérébral. Il ne peut pas être testé directement : un test cognitif devient un examen de performance dès qu'on le répète. Il faut donc le lire à travers ses déterminants, ce que personne ne fait."
      - "Les outils qui s'en approchent le plus n'aideraient pas même s'ils le pouvaient. Ils comparent les personnes à une moyenne de population, si bien que deux employés obtenant le même score peuvent être épuisés pour des raisons totalement différentes. L'un n'a personne vers qui se tourner ; l'autre ne se sent pas reconnu. Tous deux obtiennent 5,5 sur 7 à votre test. Une décennie de dépenses en programmes d'aide aux employés, applications de bien-être et enquêtes d'engagement a produit des programmes, pas une mesure. Chacun d'eux est aveugle au même endroit :"
    rows:
      - title: "Le programme d'aide aux employés attend d'être sollicité — et il ne l'est presque jamais."
        text: "82 % des employeurs en proposent un ; le taux d'utilisation reste à un chiffre"
        source: "SHRM, 2024"
      - title: "L'enquête d'engagement rapporte des moyennes"
        text: "Quelques fois par an, elle décrit le groupe — jamais l'individu — et les employés répondent en sachant que les résultats remontent à la direction. 42 % pensent que révéler une difficulté de santé mentale nuirait à leur carrière"
        source: "NAMI & Ipsos, 2025"
      - title: "Les solutions ponctuelles exigent de lever la main"
        text: "Chaque outil ne s'active que lorsqu'un employé en difficulté s'identifie lui-même dans un contexte où cela semble risqué. Environ 97 % des utilisateurs d'outils de santé mentale numériques autonomes abandonnent en 30 jours ; la rétention médiane à 30 jours est de 3,3 %"
        source: "Baumel et al., 2019"
    stats:
      - value: "1 sur 5"
        text: "employés dans le monde déclarent se sentir souvent seuls la veille de l'enquête"
        source: "Gallup, 2024"
      - value: "154 Md$"
        text: "coût annuel estimé du déficit de lien social au travail en perte de productivité et absentéisme"
        source: "U.S. Surgeon General, 2023"
      - value: "50–55 %"
        text: "des emplois américains devraient être transformés par l'IA d'ici deux à trois ans"
        source: "Boston Consulting Group, 2026"
      - value: "2,2 %"
        text: "des entreprises évaluées mènent des enquêtes auprès des employés centrées sur la santé et le bien-être"
        source: "S&P Global / McKinsey Health Institute, 2025"
    footer: "Quand le risque apparaît dans un entretien de sortie, vous lisez déjà de l'histoire. Ce qui manque n'est pas un autre programme. C'est la mesure."
  three_moves:
    tag: "Comment ça marche"
    title: "De l'invisible à l'actionnable, en trois mouvements"
    accordion:
      - title: "Une conversation, pas une enquête"
        text: "Les employés participent à un bref échange conversationnel — cinq à sept minutes — sur leur lien social, de manière générale et au sein de leur équipe. Cela ressemble à une conversation, pas à un exercice de conformité, ce qui favorise des réponses sincères."
        image: "/images/employersPage/accordion1.png"
      - title: "Un miroir privé pour chaque employé"
        text: "Chaque personne voit sa propre signature et ses relations clés, accompagnées d'analyses qu'elle peut utiliser. Personne ne fait de rapport sur elle ; ce qu'elle en fait lui appartient."
        image: "/images/employersPage/accordion2.png"
      - title: "De vraies tendances pour votre organisation"
        text: "Avec le consentement des employés, des signaux anonymisés et agrégés montrent si les différentes parties de votre organisation renforcent leur capacité de lien social ou la perdent — bien avant que cela n'apparaisse dans les données de départ."
        image: "/images/employersPage/accordion3.png"
    note: "Rien ici ne remplace une vraie conversation. Cela vous indique simplement où en avoir une."
    cta_sample: "Voir un exemple de rapport"
  cohort:
    tag: "Ce que vous faites du signal"
    title: "Quand la capacité d'un collectif commence à s'éroder"
    subtitle: "La mesure ne compte que si elle change une décision. Deux boucles fonctionnent dès le premier jour."
    employee_card:
      title: "La boucle de l'employé, privée"
      text: "Chaque personne voit sa propre signature et sa relation clé, accompagnées d'analyses qu'elle peut utiliser. Personne ne fait de rapport sur elle ; ce qu'elle en fait lui appartient."
    org_card:
      title: "Votre boucle, agrégée"
      text: "Le tableau de bord vous montre, par exemple, que les domaines de lien social au travail d'une fonction se sont érodés deux relevés de suite, concentrés sur la sécurité psychologique des employés — les personnes ne se sentent pas libres de s'exprimer sans que cela leur coûte. C'est exploitable : entraînez les managers à répondre aux erreurs et aux désaccords, clarifiez les rôles et les droits de décision, réinitialisez les normes d'équipe sur la manière de soulever des préoccupations. Ce sont des signaux directionnels sur la main-d'œuvre, pas des alertes cliniques sur des individus, et nous fournissons des recommandations de gouvernance conçues par des cliniciens sur la façon de répondre. Sur un trimestre, ces mêmes relevés vous disent quelque chose qu'aucune enquête d'engagement ne peut : si les parties de votre organisation absorbant le plus de changement lié à l'IA maintiennent leur capacité, ou la perdent silencieusement."
    roadmap:
      title: "Sur la feuille de route"
      text: "Un système de recommandation pour construire le capital cérébral au niveau de l'équipe, un routage intégré au produit qui connecte chaque personne, en privé, aux ressources nommées de votre offre d'avantages sociaux — jamais un rapport sur un individu à l'employeur — ainsi que des intégrations SIRH et outils collaboratifs."
    consent:
      title: "Votre consentement, en quatre lignes"
      items:
        - "La participation est volontaire. Ne pas participer n'a aucune visibilité pour votre employeur."
        - "Le consentement est explicite et révocable à tout moment. Le retirer arrête la collecte."
        - "L'usage à des fins de recherche fait l'objet d'un consentement séparé, demandé et révocable séparément."
        - "L'infrastructure est chiffrée et conforme au RGPD, avec hébergement en UE pour les déploiements européens et un traitement aligné HIPAA dans les contextes de soin."
  stop_guessing:
    tag: "Pourquoi c'est différent"
    title: "Arrêtez de deviner. Commencez à mesurer."
    description: "Entrelacs ne concurrence pas votre PAE, votre plateforme clinique ou vos avantages bien-être. C'est la couche de mesure qui leur a toujours manqué. Votre dispositif a été conçu pour répondre ; ce qui lui manque, c'est l'instrument qui montre où une réponse est nécessaire. Lors d'une revue de consolidation, Entrelacs montre quelles solutions méritent leur renouvellement et lesquelles non — et parce qu'il mesure le déterminant de la capacité cognitive plutôt que le ressenti, il répond à une question que votre dispositif n'a jamais été conçu pour résoudre : votre main-d'œuvre peut-elle absorber le changement que vous lui demandez ?"
    accordion:
      - title: "Individuel, pas moyen — ce qui en fait un instrument"
        text: "Tous les autres outils de ce budget mesurent le ressenti ou délivrent des soins, et évaluent les individus par rapport à une moyenne de population. Entrelacs mesure le déterminant de la capacité cognitive individu par individu : le premier instrument professionnel que nous connaissions qui modélise chaque personne sur sa propre référence. Un capital cérébral mesuré sur des moyennes n'est pas une mesure du capital cérébral — c'est une enquête d'engagement avec un nouveau vocabulaire."
      - title: "Honnête, par construction"
        text: "Les plateformes d'enquête ne peuvent pas modéliser les individus sans devenir de la surveillance ; les plateformes de soins ne peuvent pas mesurer tout le monde sans abandonner le modèle de soins qu'elles vendent. Le verrou de confidentialité est le mécanisme qui rend la donnée vraie, et c'est une position que les acteurs historiques ne peuvent structurellement pas copier."
      - title: "Ancré cliniquement"
        text: "Construit sur cinq ans de recherche — 354 entretiens approfondis dans huit pays et cinq continents, une revue systématique des instruments de lien social validés dans le monde, et une étude de validation psychométrique avec des échantillons représentatifs de trois pays — et conçu selon des standards cliniques : méthode de mesure en attente de brevet, pré-soumission FDA déposée, classification De Novo en cours. Un niveau de rigueur qu'aucune application de bien-être ou fournisseur d'enquête ne possède."
  what_you_get:
    tag: "Ce qui est disponible et ce qui arrive"
    title: "Ce que vous obtenez aujourd'hui — et vers où va l'instrument."
    live:
      title: "Disponible dès maintenant (V1)"
      items:
        - "Évaluation conversationnelle et personnalisée du lien social (44 domaines : 26 vie personnelle, 18 milieu professionnel)"
        - "Profil de lien social individuel par employé : signature en cinq domaines et relation clé à plus fort effet de levier"
        - "Rapport de capital cérébral au niveau du collectif : quelles parties de l'organisation maintiennent leur capacité et lesquelles s'érodent"
        - "Rapport de tendance directionnelle du collectif entre les relevés — où le lien social évolue, et dans quels domaines. Pas de prédiction."
        - "Tableau de bord organisationnel agrégé (collectifs de dix personnes ou plus) : tendances, schémas, facteurs par domaine"
        - "Infrastructure conforme au RGPD ; architecture priorisant la confidentialité, avec des données appartenant à l'employé"
    roadmap:
      title: "Sur la feuille de route"
      items:
        - "Recommandations privées et personnalisées adaptées à la relation clé de chaque employé, issues d'une bibliothèque d'interventions validées (V1.3)"
        - "Alerte précoce prédictive validée à partir d'une mesure longitudinale (en cours de validation pour la V2)"
        - "Domaines supplémentaires au-delà du lien social, incluant des dimensions liées à la dépression et à l'anxiété, sur le même pipeline scientifique"
        - "Routage intégré au produit vers les ressources nommées de votre offre d'avantages sociaux — privé pour l'employé, jamais un rapport à l'employeur — ainsi que des intégrations SIRH et outils collaboratifs"
    disclaimer: "Nous publions cette distinction volontairement. Les acheteurs de cette catégorie se sont vu promettre trop, trop vaguement, depuis une décennie — et nous préférons perdre une vente sur ce que nous ne savons pas encore faire que d'en gagner une sur cette base."
  faq:
    title: "Questions fréquentes"
    items:
      - q: "Que peut réellement voir mon organisation ?"
        a: "Des tendances agrégées et anonymisées sur des cohortes d'au moins dix personnes : évolutions, domaines, direction. Jamais les réponses, scores ou l'identité d'un individu. Le même document d'une page en langage clair que nous remettons à vos employés décrit exactement ce que vous pouvez et ne pouvez pas voir."
      - q: "Pourquoi les employés utiliseraient-ils cet outil alors qu'ils n'utilisent pas notre PAE ?"
        a: "Le PAE demande à une personne en difficulté de lever la main. Entrelacs donne à chaque personne une lecture privée de son propre lien social. C'est un pari de conception, et nous le traitons comme tel : les taux de participation et de retour vous sont rapportés chaque trimestre, à partir de votre propre effectif."
      - q: "Pourquoi mesurer le lien social plutôt que tester directement la capacité cognitive ?"
        a: "Parce qu'un test cognitif à l'échelle de l'effectif devient un examen de performance. Les gens l'optimisent, il ne peut pas être répété à un rythme régulier, et il produit de l'anxiété d'évaluation exactement dans la population que vous cherchez à protéger. Le capital cérébral doit être mesuré à travers ses déterminants, et le lien social est le seul qui puisse être mesuré en continu sans que la mesure ne modifie ce qu'elle mesure."
      - q: "Quel est le lien avec notre investissement dans l'IA ?"
        a: "Direct. Le retour sur l'IA dépend de la capacité des personnes à assumer un travail plus stratégique, à s'adapter assez vite et à mettre en œuvre le changement. Vous mesurez déjà en détail le volet technologique de cet investissement. Voici l'instrument pour l'autre volet, sur le même rythme trimestriel."
      - q: "Notre plateforme d'engagement ajoute des scores de bien-être. N'est-ce pas la même chose ?"
        a: "Non, et la différence est structurelle, pas une simple fonctionnalité manquante. Une plateforme d'engagement rapporte des moyennes à la direction, car les managers en sont les acheteurs. Cette architecture ne peut pas produire une mesure au niveau individuel sans devenir de la surveillance, et elle ne peut pas produire de données honnêtes tant que les employés savent que les résultats remontent. Ajouter une question de bien-être à une enquête construite sur des moyennes vous donne un nouveau chiffre avec les deux mêmes défauts : il ne peut pas vous dire qui, ni pourquoi."
      - q: "Est-ce que cela remplace ce que nous avons déjà ?"
        a: "Cela remplace les suppositions, pas les programmes. Entrelacs est la couche de mesure au-dessus de votre dispositif existant — elle montre où votre PAE, votre plateforme clinique et vos dépenses de bien-être sont nécessaires, et lors d'une revue de consolidation, quelles solutions méritent leur renouvellement."
  final_cta:
    badge: "Santé cérébrale. Personnelle, privée, précise."
    title: "Commencez à mesurer l'actif dont tout le reste dépend."
    subtext: "Nous constituons notre prochaine cohorte de partenaires de conception avec un petit groupe d'employeurs qui souhaitent un accès anticipé, une influence directe sur la feuille de route, et un moyen proactif de protéger leur personnel."
    cta_primary: "Demander une démo"
    cta_secondary: "Devenir partenaire de conception →"



employees:
  meta:
    title: "Entrelacs pour les Employés"
  hero:
    eyebrow: "ENTRELACS POUR LES EMPLOYÉS"
    title: "Quinze minutes pour une lecture de votre propre vie, pas une comparaison à tout le monde."
    description: "Entrelacs mesure le lien social — le déterminant du capital cérébral disposant des preuves les plus solides et de la charge de mesure la plus faible. Il vous le mesure spécifiquement, pas par rapport à une moyenne de population. Votre employeur a acheté l'instrument. Il ne peut voir vos réponses, ni maintenant ni jamais."
    cta_sample: "Voir un exemple de rapport"
    cta_employer: "Passer à ce que voit votre employeur"
    image: "/images/employeesPage/hero.webp"
  why_bother:
    tag: "Pourquoi vous prendriez la peine"
    title: "Le résultat est à vous en premier. C'est la conception, pas une faveur."
    text: "La plupart des enquêtes en entreprise vous posent des questions et transmettent les données directement à la direction. Vous recevez une diapositive lors d'une réunion générale six semaines plus tard. Naturellement, vous répondez avec prudence plutôt qu'honnêtement."
    text2: "La mesure ne fonctionne qu'avec des réponses honnêtes, et personne ne répond honnêtement à un système qui ne lui rend rien. Il faut donc que cela vaille votre temps dès la première conversation, et encore plus à la dixième."
  forty_two:
    tag: "Ce que cela vous dit vraiment"
    title: "« Ça va, je suis juste fatigué(e) » est une phrase qui recouvre 42 choses différentes."
    text: "Quand quelque chose ne va pas, la plupart des gens n'ont qu'un mot pour le dire. Fatigué. Terne. Pas dans son assiette. Un seul ressenti, donc une seule explication — généralement le travail, le sommeil, ou soi-même."
    text2: "En dessous se trouvent des dizaines d'éléments distincts, tous des facettes d'une seule chose : la manière dont vous êtes connecté aux personnes qui vous entourent. Y a-t-il quelqu'un avec qui vous pouvez être entièrement ouvert. Une partie de vous s'inquiète-t-elle de déranger. Une semaine normale contient-elle un vrai contact ou surtout de la logistique. Pourriez-vous dire une chose difficile au travail sans que cela vous coûte. Le travail que vous faites est-il remarqué par quelqu'un."
    text3: "Entrelacs lit 44 de ces éléments — 26 dans votre vie, 18 au travail, lus séparément parce qu'ils n'évoluent pas ensemble. Le lien social est ce qui est mesuré, et pour une bonne raison : parmi tout ce qui façonne votre état, c'est ce qui dispose des preuves les plus solides et de la charge de mesure la plus légère. Le rapport vous dit donc ce que vos quarante-deux éléments donnent au total — où vous en êtes sur l'épuisement, la solitude, la baisse de moral et la santé physique — et quel domaine de lien social en est le moteur. Des indications, pas des diagnostics, avec le levier qui va avec."
    text4: "Un ressenti vague et pesant devient des éléments précis à des endroits précis. Les éléments précis peuvent être travaillés. Les éléments vagues ne peuvent qu'être supportés."
    image: "/images/employeesPage/forty-two.webp"
  four_moves:
    tag: "Comment il vous lit"
    title: "Quatre mouvements. La méthode s'appelle Reconstruction de la Signature Clé — voici ce que fait chaque partie pour vous."
    subtitle: "C'est la partie qui rend cet outil différent de toutes les enquêtes que vous avez reçues. Pas les questions. Ce qui arrive à vos réponses."
    accordion:
      - title: "Il détermine avec qui vous lire."
        text: "Pas des personnes qui vous ressemblent sur le papier, mais des personnes dont les tendances évoluent en même temps que les vôtres dans le temps. Ce qui veut dire que les conclusions s'appliquent réellement à vous — la raison pour laquelle les conseils génériques tombent si souvent à côté, c'est qu'ils ont été tirés d'une moyenne sur tout le monde, et la personne moyenne n'existe pas."
        image: "/images/employeesPage/accordion1.png"
      - title: "Il arrête de vous demander ce qu'il peut déjà déduire."
        text: "Il ne pose que les questions qui apportent une information réelle pour quelqu'un comme vous, et reconstruit le reste. Quinze minutes au lieu d'une heure, sans une seule question superflue. La plupart des gens remarquent l'inverse de la lassitude face aux enquêtes — une question arrive qui semble étrangement bien ciblée."
        image: "/images/employeesPage/accordion2.png"
      - title: "Il vous cartographie comme un système, pas comme un bulletin de notes."
        text: "Vos réponses deviennent un réseau où les éléments se soutiennent mutuellement. Cela explique ce qui ne faisait jamais sens : pourquoi vous pouvez aller bien sur le papier sans aller bien, pourquoi la solution évidente n'a pas aidé, pourquoi une seule perte semblait en entraîner trois autres avec elle."
        image: "/images/employeesPage/accordion3.png"
      - title: "Il vous indique le seul endroit où agir."
        text: "Parmi tout ce que le modèle lit, un point fait bouger le reste du réseau plus que tout autre. C'est votre relation clé — l'endroit unique où l'effort a le plus de chances de se répercuter partout ailleurs, pour que vous ne soyez pas laissé à deviner par où commencer."
        image: "/images/employeesPage/accordion4.png"
  remembers:
    tag: "Ce qui change quand il se souvient de vous"
    title: "La plupart des outils vous disent comment vous vous comparez. Celui-ci vous dit comment vous avez changé."
    text: "Chaque application de bien-être que vous avez essayée vous notait par rapport aux autres, ce qui explique pourquoi le chiffre n'a jamais vraiment eu de sens — il ne pouvait pas vous dire si un mois difficile était un vrai changement ou juste un mois difficile. Entrelacs construit un modèle de vous spécifiquement, pour pouvoir remarquer quand vous avez évolué."
    image: "/images/employeesPage/remembers.webp"
    cards:
      - title: "Moins de questions, pas plus"
        text: "À mesure qu'il apprend ce qui est stable chez vous, il arrête de demander. La conversation devient plus courte à chaque fois."
      - title: "Vous découvrez si cela a fonctionné"
        text: "Agissez sur votre relation clé, et la prochaine fois vous pourrez voir si le réseau a bougé. Les conseils sont partout ; la preuve que votre effort a changé votre situation ne l'est pas."
      - title: "Vous voyez la dérive avant qu'elle ne devienne un mauvais mois"
        text: "Avec suffisamment d'historique, le modèle peut signaler quand vos tendances commencent à évoluer comme elles le font habituellement avant que les choses ne deviennent difficiles — tôt, discrètement, et à vous seul. Personne d'autre n'en est jamais informé."
      - title: "Il vous relit quand votre vie change"
        text: "Nouveau manager, nouvelle ville, nouveau bébé. Le vôtre est réévalué, parce que le but n'a jamais été de vous enfermer dans un type."
    note:
      title: "Où en est cela aujourd'hui"
      text: "Le modèle spécifique à la personne, votre signature, votre relation clé et le fait de poser des questions sur votre propre rapport sont disponibles dès maintenant. La continuité entre les conversations, le raccourcissement de l'évaluation et l'alerte précoce personnelle sont en développement. Nous vous informerons de l'arrivée de chacun, et rien de tout cela ne change qui peut voir vos données."
  the_line:
    tag: "La ligne"
    title: "Ce que voit votre employeur. Et ce qu'il ne verra jamais."
    you_card:
      title: "Ce que vous voyez"
      text: "Vos réponses. Vos mots. Votre rapport. Votre signature. Votre relation clé. Comment tout cela évolue dans le temps — l'historique, qui est la partie qui devient la plus utile pour vous."
      image: "/images/employeesPage/what-you-see.webp"
    them_card:
      title: "Ce qu'il voit"
      text: "Des tendances sur des groupes de dix personnes ou plus. Où le lien social s'érode au sein d'une équipe ou d'une fonction, et quelles ressources d'accompagnement déjà financées sont réellement nécessaires. Jamais attribuable à une personne. Aucun résultat individuel identifiable ne remonte à la direction, à aucun moment, sous aucune forme — même si elle le demande."
      image: "/images/employeesPage/what-they-see.webp"
    notes:
      - title: "Pourquoi dix"
        text: "En dessous de ce seuil, une moyenne de groupe peut être retracée jusqu'aux individus. Il n'y a donc aucun rapport en dessous. Pas un chiffre plus petit pour une équipe plus petite, pas d'exception pour une demande hiérarchique. C'est une propriété du système, pas une politique administrée par quelqu'un."
      - title: "Où se trouvent vos données"
        text: "Votre profil individuel est chiffré pour vous seul. La couche de reporting de votre employeur est un système séparé, en aval, qui ne reçoit que des agrégats au-dessus du seuil. Les deux ne sont pas reliés par un paramètre de permission que quelqu'un pourrait modifier."
    consent:
      title: "Votre consentement, en quatre lignes"
      items:
        - "La participation est volontaire. Ne pas participer n'a aucune visibilité pour votre employeur."
        - "Le consentement est explicite et révocable à tout moment. Le retirer arrête la collecte."
        - "L'usage à des fins de recherche fait l'objet d'un consentement séparé, demandé et révocable séparément."
        - "L'infrastructure est chiffrée et conforme au RGPD, avec hébergement en UE pour les déploiements européens et un traitement aligné HIPAA dans les contextes de soin."
    later:
      title: "Bientôt disponible, et seulement si vous y consentez"
      text: "Une future version pourra utiliser des signaux que vous générez déjà — un historique que vous exportez vous-même, ou des données d'objets connectés comme le sommeil et la variabilité de la fréquence cardiaque — pour affiner l'image entre les conversations. Une option activée par vous, révocable, dirigée vers votre propre profil. Cela ne passe jamais par votre employeur, cela n'existe pas dans la version que vous utilisez aujourd'hui, et cela ne sera jamais activé pour vous par quelqu'un d'autre."
  ai_question:
    tag: "La question de l'IA"
    title: "Oui, il y a une IA. Non, ce n'est pas elle qui vous évalue."
    text: "Vous devriez être sceptique face à l'IA dans tout ce qui touche à la santé mentale. Les agents conversationnels génériques sont peu fiables pour les jugements à fort enjeu, ils ont tendance à vous approuver plutôt qu'à vous évaluer, et presque aucun n'a été évalué dans la durée."
    text2: "C'est pourquoi nous n'en avons pas construit. Le modèle de langage gère la conversation : il transforme ce que vous dites en données structurées, et vous explique vos résultats en langage clair. C'est tout son rôle."
    text3: "Il ne vous note pas. Il ne vous évalue pas. Il ne vous diagnostique pas. Chaque mesure et chaque calcul de réseau s'exécute de manière déterministe dans Lacis — auditable et traçable. La structure dans laquelle vous êtes placé a été apprise à l'avance à partir de cinq ans de recherche ; elle n'est pas improvisée sur le moment par un modèle génératif."
    image: "/images/employeesPage/ai-question.webp"
  faq:
    title: "Questions fréquentes"
    items:
      - q: "Combien de temps cela prend-il ?"
        a: "Environ quinze minutes la première fois. Chaque conversation suivante devient plus courte, car Lacis arrête de demander ce qu'il sait déjà de vous."
      - q: "À quelle fréquence serai-je sollicité(e) ?"
        a: "Aussi souvent que cela vous est utile. Il n'y a pas de calendrier imposé et aucun rappel que vous ne puissiez désactiver. La plupart des gens trouvent utile de faire un point quand quelque chose a changé, ou tous les quelques mois."
      - q: "Se souviendra-t-il de moi d'une conversation à l'autre ?"
        a: "Aujourd'hui, chaque conversation existe de façon indépendante, et votre profil persiste pour que vous puissiez consulter votre rapport précédent. La continuité entre les conversations est en cours de développement. Quand elle arrivera, elle vous appartiendra, sera chiffrée pour vous, et restera invisible pour votre employeur."
      - q: "Mon manager peut-il demander mes résultats ?"
        a: "Non. Votre rapport individuel n'est jamais partagé avec votre employeur, sous aucune forme, même s'il le demande. Il ne voit que des tendances anonymisées et à seuil, sur des groupes de dix personnes ou plus."
      - q: "Que se passe-t-il si j'arrête en cours de route ?"
        a: "Rien ne vous est reproché. Vous pouvez arrêter à tout moment, et votre employeur n'a aucune visibilité sur le fait que vous ayez commencé, mis en pause, ou terminé."
      - q: "Et si je suis la seule personne de mon équipe à l'utiliser ?"
        a: "Votre rapport individuel fonctionne de la même façon dans tous les cas — il est construit à partir de votre propre historique, pas d'une comparaison avec vos collègues. Les tendances organisationnelles n'apparaissent qu'une fois qu'une cohorte de dix personnes ou plus y a participé."
      - q: "Et si je ne me reconnais pas dans le rapport ?"
        a: "Dites-le-lui. Le rapport est une lecture, pas un verdict, et une partie de son utilité vient du fait de le corriger quand il se trompe — cette correction est elle-même une information que Lacis utilise pour mieux vous lire la prochaine fois."
      - q: "Et si je ne vais pas bien en ce moment ?"
        a: "Entrelacs est un instrument de mesure, pas un service de crise. Si vous avez besoin d'aide maintenant, consultez les ressources ci-dessous — une personne, pas un rapport, est la bonne prochaine étape."
      - q: "Que devient mon profil si je quitte l'entreprise ?"
        a: "[DÉCISION REQUISE — voir les notes de production. Ne pas publier cette page sans réponse ici ; les sections précédentes amènent chaque lecteur à se poser cette question.]"
      - q: "Qui contacter au sujet de mes données ?"
        a: "Notre délégué à la protection des données traite tout ce qui concerne vos données — accès, corrections, suppression, et consentement, y compris son retrait. Contactez-le à dpo@entrelacs.ai. Votre employeur n'est pas impliqué dans ces demandes et ne peut pas les voir."


care_settings:
  meta:
    title: "Entrelacs pour les établissements de soins"
  hero:
    eyebrow: "ENTRELACS POUR LES ÉTABLISSEMENTS DE SOINS"
    title: "Vos patients vivent entre deux rendez-vous. La mesure devrait faire de même."
    description: "Entrelacs développe l'instrument de mesure spécifique à la personne pour la santé mentale — conversationnel, ancré cliniquement, et conçu pour obtenir une autorisation réglementaire. Nous ouvrons un programme limité de partenaires cliniques pour les cliniques, systèmes de santé et groupes de recherche qui façonneront cette trajectoire avec nous."
    cta_primary: "Parlez à notre équipe clinique"
    cta_secondary: "Explorer une collaboration de recherche"
  the_gap:
    tag: "L'écart"
    title: "Le soin est continu. La mesure est épisodique."
    text: "L'évaluation clinique se fait aujourd'hui aux seuls moments où le soin peut observer : admission, séances, crise. Entre ces moments, là où la dégradation se forme, les instruments standards restent silencieux. Et les instruments eux-mêmes ont été normés sur des populations, pas sur des personnes : deux patients avec des scores identiques peuvent souffrir pour des raisons entièrement différentes, et un score comparé à la moyenne des patients peut orienter un clinicien vers la mauvaise voie pour la personne réelle."
    text2: "La science de la mesure nécessaire pour faire mieux existe déjà. La modélisation de réseau spécifique à la personne — l'approche au cœur d'Entrelacs — évalue chaque individu par rapport à son propre sous-groupe de référence plutôt qu'à une norme populationnelle, et rend compte non seulement de la sévérité, mais aussi du domaine qui compte le plus pour cette personne."
  brings:
    tag: "Ce qu'apporte Entrelacs"
    title: "Une mesure conçue pour les individus — pensée pour les standards cliniques dès le premier jour."
    accordion:
      - title: "Un instrument validé, spécifique à la personne"
        text: "Lacis construit un modèle spécifique à la personne du lien social et de son impact sur le bien-être. Les patients interagissent avec l'interface conversationnelle, tandis que la psychométrie déterministe s'exécute de manière fiable en arrière-plan. L'IA gère la conversation ; elle ne note pas, n'évalue pas, ne diagnostique pas."
      - title: "Une gouvernance clinique, pas seulement des promesses"
        text: "Notre Directeur/Directrice clinique (Chief Clinical Officer) est psychologue clinicien(ne) en exercice depuis quinze ans. Nous constituons un Comité consultatif clinique de six membres, réparti entre plusieurs marchés, ancré aux États-Unis et en France, dont au moins la moitié des sièges sont occupés par des cliniciens voyant actuellement des patients, pour encadrer les limites cliniques de la plateforme."
      - title: "Une trajectoire réglementaire, énoncée avec précision"
        text: "Entrelacs est aujourd'hui un instrument de mesure et de développement — ni un dispositif de diagnostic, ni un traitement — déployé dans des limites cliniques encadrées par notre Chief Clinical Officer et le comité consultatif. Nous avons déposé une Pre-Submission auprès de la FDA et visons une classification De Novo aux États-Unis, ainsi qu'un marquage CE classe IIa dans l'UE ciblé pour 2027, appuyés par des études de validation en cours et un volet clinique français."
  partnership:
    tag: "Partenariat"
    title: "La suite — avec des partenaires, pas seulement des clients."
    text: "Le même instrument qui rend mesurable la capacité de la main-d'œuvre est conçu pour évoluer vers une mesure de la santé mentale à l'échelle des populations : le socle de détection précoce sur lequel la cardiologie et l'oncologie s'appuient depuis des décennies. Y parvenir demande des preuves longitudinales générées dans de vrais contextes de soins."
    subtitle: "Avec qui nous construisons cela"
    cards:
      - text: "Des cliniques et systèmes de santé qui déploient l'instrument commercialement sur des frais de plateforme par patient, générant avec nous des preuves en conditions réelles"
      - text: "Des groupes de recherche de notre réseau de validation multi-pays, qui construisent les cohortes longitudinales à l'origine de la prochaine génération du moteur"
      - text: "Des payeurs et organismes de santé publique qui explorent ce que la mesure de la connexion spécifique à la personne signifie pour le risque populationnel — une conversation qui devient commerciale après l'autorisation, et qui commence maintenant."

the_science:
  meta:
    title: "Entrelacs — La Science"
  hero:
    title: "La personne moyenne n'existe pas. Nous avons arrêté de la mesurer."
    description: "Entrelacs repose sur un constat que le domaine a longtemps résisté à admettre : les instruments psychologiques étalonnés sur des populations mesurent systématiquement mal les individus. Lacis, notre moteur propriétaire, modélise une personne à la fois. Cela change ce que la mesure peut accomplir."
    cta_demo: "Demander une démo"
    cta_sample: "Voir un exemple de rapport"
  problem:
    tag: "Le problème de la moyenne"
    title: "Pourquoi chaque questionnaire que vous avez rempli a été conçu pour quelqu'un qui n'existe pas."
    stat1_value: "4 063"
    stat1_label: "pilotes mesurés sur dix dimensions"
    stat2_value: "0"
    stat2_label: "correspondaient à la moyenne sur les dix"
    paragraphs:
      - "En 1952, l'armée de l'air américaine a mesuré 4 063 pilotes sur dix dimensions pour concevoir un cockpit adapté au pilote moyen. Aucun pilote ne correspondait à la moyenne sur les dix. La solution — le siège réglable — a établi la première loi de la personnalisation : on n'adapte pas l'humain à la moyenne, on construit l'instrument autour de l'individu (Daniels, 1952 ; Rose, 2016)."
      - "La mesure psychologique n'a jamais eu son siège réglable. Les enquêtes d'engagement, les questionnaires de bien-être et la plupart des échelles cliniques posent encore les mêmes questions à tout le monde et notent les réponses par rapport à une moyenne de population, portant une hypothèse que la littérature scientifique a formellement rejetée : que des statistiques de groupe décrivent des individus (Molenaar, 2004). Deux personnes ayant des scores identiques peuvent traverser des difficultés totalement différentes. Un instrument fondé sur la moyenne ne peut pas les distinguer. Et quand un score guide une décision — une allocation d'avantages, un parcours de soins — l'erreur de mesure se transforme en préjudice réel."
      - "Notre équipe fondatrice a passé deux décennies au cœur de ce problème en tant que chercheurs, et a contribué à produire les preuves qui l'ont rendu incontestable, notamment en démontrant empiriquement que les instruments standards ne mesurent pas la même construction d'une personne à l'autre. Entrelacs est l'instrument qu'ils ont conçu en réponse."
  engine:
    tag: "Le moteur"
    title: "Lacis : la mesure propre à chaque personne, conçue pour durer."
    description: "Des questions adaptées et une carte claire de vos connexions pour vous montrer exactement quoi changer."
    ksr_title: "Les quatre étapes de la méthode KSR (Key Signature Reconstruction) — brevet en cours"
    accordion:
      - title: "Votre sous-groupe, pas la population"
        text: "Avant de poser la moindre question qui compte, Lacis vous place parmi des personnes dont la psychologie évolue de la même manière que la vôtre au fil du temps — un sous-groupe suffisamment restreint pour qu'une conclusion tirée sur le groupe soit formellement valable pour l'individu qui s'y trouve. Les statistiques de population supposent cette condition. Elles ne la remplissent presque jamais."
        image: "/images/theSciencePage/engine-mockup.png"
      - title: "Les questions les plus informatives, pour vous"
        text: "Une fois votre sous-groupe identifié, Lacis sélectionne les questions qui apportent le plus d'information pour une personne comme vous — non pas une batterie fixe posée à tout le monde, mais le plus petit ensemble de questions qui résout le plus vite l'incertitude sur votre profil spécifique."
        image: "/images/theSciencePage/engine-mockup.png"
      - title: "Modélisation en réseau sur 44 domaines"
        text: "Vos réponses sont projetées dans un réseau de 44 domaines psychologiques, capturant la manière dont ils se lient et se renforcent mutuellement pour vous en particulier, plutôt que de noter chaque domaine isolément comme le font les instruments traditionnels."
        image: "/images/theSciencePage/engine-mockup.png"
      - title: "Signature et pierre angulaire"
        text: "À partir de ce réseau, Lacis extrait votre signature — la poignée de domaines qui entraîne les autres — et votre pierre angulaire, le levier le plus susceptible de faire bouger tout le système si vous agissez dessus."
        image: "/images/theSciencePage/engine-mockup.png"
    why_connection:
      title: "Pourquoi le lien social d'abord"
      text: "Le capital cérébral ne peut pas être testé directement à l'échelle d'une organisation ; le test lui-même deviendrait un examen de performance. Il peut être mesuré à travers ses déterminants, et parmi eux le lien social dispose de la base de preuves la plus solide pour la charge de mesure la plus faible. Le même moteur est conçu pour s'étendre à d'autres déterminants, dont des dimensions de la dépression et de l'anxiété, sur le même pipeline de validation."
    why_now:
      title: "Pourquoi maintenant"
      text: "Les composants ont des précédents. Les régulateurs ont déjà certifié l'évaluation clinique conversationnelle comme dispositif médical en Europe, et des payeurs financent déjà la détection de l'isolement social dans des populations couvertes. Personne n'avait encore assemblé un instrument propre à chaque personne pour le monde du travail — la position qu'Entrelacs est conçu pour occuper."
  trust:
    tag: "Confiance"
    title: "La mesure appartient à la personne mesurée."
    paragraphs:
      - "Un instrument de mesure auquel les gens répondent de façon stratégique ne mesure pas ce qu'il prétend mesurer. C'est l'échec que les outils traditionnels n'ont jamais résolu : les enquêtes d'engagement font remonter les réponses à la direction, 42 % des salariés pensent qu'une divulgation nuirait à leur carrière (NAMI & Ipsos, 2025), et les données obtenues sont biaisées dans une direction qu'aucune correction statistique ne rattrape. Entrelacs traite l'architecture de confiance comme faisant partie de l'instrument."
      - "Le salarié utilise une interface privée et obtient ses résultats immédiatement : sa propre signature, son levier clé et son premier geste. Ses réponses, ses textes et ses données sont chiffrés et ne sont jamais montrés à la direction ou aux RH. L'organisation ne voit que des tendances sur des groupes de dix personnes ou plus. Jamais qui a dit quoi."
      - "Ce n'est pas une fonctionnalité de confidentialité ajoutée après coup à un produit de mesure. C'est la condition pour que la mesure soit vraie. On confie à un miroir des choses qu'on ne confierait pas à un employeur."
  ai_boundary:
    tag: "La limite de l'IA"
    title: "Ce que l'IA fait — et ce qu'il lui est interdit de faire."
    paragraphs:
      - "Les acheteurs ont raison de se méfier de l'IA générative en santé mentale. La recherche est sans équivoque : les modèles généralistes sont peu performants sur les tâches cliniques à haut risque, ont tendance à approuver les utilisateurs plutôt qu'à les évaluer, et sont presque jamais évalués de manière longitudinale."
      - "Entrelacs est conçu contre ces modes d'échec. Le modèle de langage gère la conversation : il transforme un dialogue naturel en données structurées et explique les résultats dans un langage clair et bienveillant. À mesure que les items validés passent en formulation conversationnelle, chacun subit des contrôles d'équivalence psychométrique avant sa mise en production — distributions de réponses, taux de complétion et fonctionnement des items comparés à l'instrument d'origine."
    cards:
      - title: "Elle ne note, n'évalue ni ne diagnostique jamais."
        text: "Toute la logique de mesure, de sous-groupement, d'estimation du réseau et de recommandation s'exécute de manière déterministe dans Lacis — auditable, traçable, et ancrée dans un corpus de recherche validé. La structure des sous-groupes elle-même est apprise hors ligne à partir de notre base de recherche, et non inventée sur l'instant par un modèle génératif."
      - title: "Entrelacs n'est ni un service de thérapie ni un service de crise."
        text: "Lorsqu'une conversation fait apparaître une détresse aiguë, un protocole d'orientation encadré par notre Chief Clinical Officer dirige immédiatement la personne vers une aide humaine et des ressources de crise. L'instrument mesure ; ce sont des personnes qui prennent soin des personnes."
  solution:
    tag: "Validation et partenariats"
    title: "Ancré dans un actif de recherche qu'un concurrent ne peut pas raccourcir."
    intro: "Lacis est calibré sur un socle de recherche propriétaire construit sur cinq ans par l'Annecy Behavioral Science Lab (ABSL), dont Entrelacs détient la licence commerciale exclusive — ouvert en tant que science, exclusif en tant qu'actif d'entreprise. Ses deux composantes les plus longues à produire sont achevées : une revue exhaustive de 9 032 articles dans sept langues, recensant tous les instruments validés de mesure du lien social dans la littérature ; et un corpus interculturel de 354 entretiens approfondis dans huit pays et cinq continents, codé selon le modèle à 44 domaines. Les deux ont pris des années. Un concurrent repart de zéro sur les deux — cela ne peut pas être reproduit par extraction web ou lecture de la même littérature publiée, et cela s'accumule à chaque déploiement."
    foundations:
      columns:
        - title: "Politique mondiale et recherche"
          items:
            - "Les travaux de l'ABSL sont à la base du cadre de suivi du lien social de l'UE et alimentent le développement par l'OMS d'un indice mondial du lien social"
            - "Projet de recherche Horizon Europe de l'UE — LONELY-EU, 3 M€"
            - "Coopération avec l'OCDE sur la mesure de la santé sociale"
            - "Affiliation de recherche avec l'université d'Oxford"
        - title: "Réseau académique"
          items:
            - "Psychological Science Accelerator — réseau de recherche présent dans plus de 80 pays (notre CSO en est directeur associé)"
            - "Conseillers stratégiques à Stanford (Dr Michal Kosinski — prédiction comportementale par IA) et à UC Davis (Dr Emorie Beck — mesure psychologique personnalisée)"
        - title: "Publié, pas seulement affirmé"
          items:
            - "Paris, B., Ropovik, I., Silan, M., d’Hombres, B., Casabianca, E., & IJzerman, H. (2026). Evaluating loneliness measurements across the European Union. Collabra: Psychology, 12(1)."
            - "Coll-Planas, L., Akhter-Khan, S. C., Longworth, G., Srivastava, P., Mosalakanti, S., Silan, M. A., IJzerman, H., & McHugh Power, J. (2026). Rethinking loneliness interventions. — Why connection must be supported at the level of the individual, not the population."
            - "Silan, M. A. (2024). Rethinking multi-site studies in social and personality psychology. Social and Personality Psychology Compass. — The cross-cultural validity problem the 354-interview corpus was built to solve."
            - "Mosalakanti, S., Paris, B., Brickau, D., Luhmann, M., & Rocha IJzerman, H., (2026, August 25). A systematic review of social connection inventories."
            - "Molenaar, P. C. M. (2004). A manifesto on psychology as idiographic science: Bringing the person back into scientific psychology, this time forever. Measurement: Interdisciplinary Research and Perspectives, 2(4), 201–218."
            - "Borsboom, D. (2017). A network theory of mental disorders. World Psychiatry, 16(1), 5–13."
            - "Holt-Lunstad, J., Smith, T. B., Baker, M., Harris, T., & Stephenson, D. (2015). Loneliness and social isolation as risk factors for mortality: A meta-analytic review. Perspectives on Psychological Science, 10(2), 227–237."
            - "World Health Organization. (2025). From loneliness to social connection: Charting a path to healthier societies. Report of the WHO Commission on Social Connection. WHO."
            - "Office of the U.S. Surgeon General. (2023). Our epidemic of loneliness and isolation: The U.S. Surgeon General’s advisory on the healing effects of social connection and community. U.S. Department of Health and Human Services."
    in_progress_label: "En cours :"
    in_progress_text: "d'autres publications évaluées par les pairs issues du programme de validation Entrelacs sont en préparation ; des cohortes de validation longitudinale sont en cours ; le suivi des résultats cliniques est en phase pilote."
  certifications:
    tag: "Réglementation et sécurité"
    title: "Conçu selon les normes cliniques. Certifié étape par étape."
    status:
      title: "État actuel"
      text: "Un instrument de mesure et de développement — délibérément pas un dispositif de diagnostic ou de traitement, avec des limites cliniques encadrées par notre Chief Clinical Officer et notre comité consultatif clinique."
    items:
      - q: "FDA (États-Unis)"
        a: "Pre-Submission déposée ; classification De Novo visée (aucun dispositif prédicat clair n'existe — la voie prévue pour les instruments inédits)"
      - q: "Marquage CE (UE)"
        a: "Classe IIa, visée pour 2027"
      - q: "Gouvernance clinique"
        a: "Comité consultatif clinique en cours de constitution — six membres aux États-Unis et en France, dont au moins la moitié sont des cliniciens en exercice ; développement logiciel sous la discipline ISO 13485/14971"
      - q: "Propriété intellectuelle"
        a: "La méthode de mesure KSR est en cours de brevetage (demande provisoire américaine déposée en juin 2026)"
      - q: "Protection des données"
        a: "Infrastructure chiffrée et conforme au RGPD ; hébergement des données en UE pour les déploiements européens ; programme de conformité multi-juridictionnel (UE, Royaume-Uni, Suisse, États-Unis, y compris les lois de confidentialité des États américains)"
      - q: "Contextes de soins"
        a: "Traitement des données aligné sur HIPAA"
      - q: "Certification de sécurité"
        a: "Préparation à l'audit SOC 2 Type II en cours ; ISO 27001 sur la feuille de route — documentation de sécurité disponible pour les équipes d'achat sur demande"
      - q: "Seuil de signalement"
        a: "Seuil d'agrégation de dix personnes ou plus pour tout signalement organisationnel ; participation volontaire avec consentement transparent et révocable, y compris pour un usage de recherche"

team:
  leadership:
    title: "Découvrez l'équipe de direction"
    subtitle: "Une expertise dédiée couvrant la science, la technologie et la santé."
    list:
      - name: "Dr Hans Rocha IJzerman"
        role: "CEO et co-fondateur"
        bio: "Chercheur en psychologie, auteur de Heartwarming (W. W. Norton) et chercheur principal du projet européen LONELY-EU Horizon Europe (3 M€). Co-fondateur du Psychological Science Accelerator, chercheur affilié à l'Université d'Oxford, et conseiller auprès de l'OMS et de l'UE sur les politiques liées au lien social."
        image: "/images/teamMembers/DrHansIjzerman.png"
      - name: "Dr Miguel Silan"
        role: "Directeur scientifique et co-fondateur"
        bio: "Directeur associé du Psychological Science Accelerator, le plus grand réseau de recherche en psychologie, couvrant plus de 80 pays. Sa spécialité — la méta-méthodologie et les problèmes de mesure que la psychologie ignore le plus souvent — constitue le pilier de la validation interculturelle d'Entrelacs."
        image: "/images/teamMembers/DrMiguelSilan.png"
  extendedLeadership:
    title: "Équipe de direction élargie"
    list:
      - name: "Daniela Rocha Lopes"
        role: "Directrice clinique"
        bio: "Psychologue clinicienne agréée en France, au Brésil et aux Pays-Bas, avec quinze ans d'expérience en pratique clinique et en opérations. Directrice générale de Solstice Psychologues ; elle garantit l'intégrité clinique de l'instrument."
        image: "/images/teamMembers/DanielaRocha.png"
      - name: "Dr Andrews Cordolino Sobral"
        role: "Directeur de la technologie"
        bio: "Docteur en vision par ordinateur et apprentissage automatique, ancien responsable de l'IA chez ActiveEon, où il a fait passer des plateformes d'IA du prototype à la production. Auteur de bibliothèques open source de vision par ordinateur utilisées dans le monde entier."
        image: "/images/teamMembers/DrAndrewsSobral.png"
      - name: "Alexandra Lung"
        role: "Directrice produit (désignée)"
        bio: "Cadre produit avec quinze ans d'expérience dans les startups et scale-ups ; a dirigé le produit et le design chez Aircall, de la Série B jusqu'au statut de licorne, puis a été directrice produit mondiale de Signaturit Group. Nommée parmi les 50 femmes les plus influentes du produit en Europe."
        image: "/images/teamMembers/AlexandraLung.png"
      - name: "Matthew Reed"
        role: "Directeur financier"
        bio: "A dirigé le développement de la finance durable chez EDF Group, gérant plus de 8 Md€ d'émissions d'obligations vertes et sociales. Membre du Green Bond Principles Advisory Council de l'ICMA et chargé de cours en finance durable à l'Université d'Oxford."
        image: "/images/teamMembers/MatthewReed.png"
      - name: "Dr Cristina Claver Sicilia"
        role: "Directrice des opérations"
        bio: "Docteure en pharmacie, MBA. A dirigé la mise en œuvre de stratégies pharmaceutiques à travers l'Europe ; pilote l'excellence opérationnelle et l'accès au marché européen."
        image: "/images/teamMembers/DrCristinaClaver.png"
      - name: "Katie Cobb"
        role: "Directrice marketing (à venir)"
        bio: "Fondatrice d'Oxford Comma Strategy et architecte de la stratégie de catégorie d'Entrelacs ainsi que du discours de mise sur le marché aux États-Unis."
        image: "/images/teamMembers/katieCobb.png"
      - name: "Cyril Marie"
        role: "Responsable de la marque et de la création, France (à venir)"
        bio: "Directeur créatif et entrepreneur depuis vingt-cinq ans ; président d'Inspire Studio, Annecy. Dirige l'identité de marque française, la direction créative et la stratégie presse."
        image: "/images/teamMembers/CyrilMarie.png"
  advisors:
    title: "Conseillers stratégiques"
    subtitle: "Guidés par les esprits qui façonnent l'avenir de l'IA, des sciences du comportement et de la santé mondiale."
    list:
      - name: "Dr Michal Kosinski"
        role: "Professeur associé, Stanford Graduate School of Business"
        bio: "Conseille sur la méthodologie d'IA et la prédiction comportementale."
        image: "/images/teamMembers/DrMichalKosinski.png"
      - name: "Jillian Miranda"
        role: "Fondatrice en santé numérique, conseillère et connectrice"
        bio: "Associée gérante de Snatch Health. Conseille sur la mise sur le marché de la santé aux États-Unis et pilote l'expansion américaine."
        image: "/images/teamMembers/JilianMiranda.png"
      - name: "Ron Ivey"
        role: "Fondateur, HumanConnections.AI"
        bio: "Deux décennies à relier politiques publiques, philanthropie et technologie autour du lien social ; conseiller du T20 du G20 sur l'IA et la confiance. Conseille sur l'IA responsable et la conception centrée sur l'épanouissement."
        image: "/images/teamMembers/RonIvey.png"
      - name: "Dr Emorie Beck"
        role: "Professeure assistante de psychologie, UC Davis"
        bio: "Conseille sur la méthodologie de mesure personnalisée."
        image: "/images/teamMembers/DrEmorieBeck.png"
      - name: "Carson Kelly"
        role: "Fondateur et PDG, Compassion 2.0"
        bio: "Défenseur de la compassion comme pratique commerciale ; consultant stratégique auprès des entreprises de bien-être et de potentiel humain entrant sur les marchés d'entreprise. Conseille sur les modèles de produits axés sur la compassion et le ROI des soins."
        image: "/images/teamMembers/CarsonKelly.png"
      - name: "Jackie Ourman, LMHC-D"
        role: "Fondatrice, Social Connection Collective"
        bio: "Psychothérapeute en exercice et fondatrice du Social Connection Collective, né du lancement de la Commission de l'OMS sur le lien social. Conseille sur le lien entre la mesure et la pratique de terrain."
        image: "/images/teamMembers/JackieOurman.png"


