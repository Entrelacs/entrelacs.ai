home:
  meta:
    title: "Entrelacs"
    description: "Entrelacs met la santé cérébrale au travail en mesure grâce à une IA à standard clinique, privée par conception, pour agir plus tôt et plus justement."
  video_link: https://www.youtube.com/embed/8Fzfn64_KF0?si=t0QUz5IS1bdXzJmB
  hero:
    tag_text: "Santé cérébrale. Personnelle, privée, précise."
    title_prefix: "Votre entreprise repose sur le lien social.<br> Il n'a jamais été mesuré."
    subtitle: "Entrelacs le mesure, une personne à la fois et toujours en privé. Chaque personne salariée voit sa propre lecture ; l'employeur voit où le soutien qu'il finance déjà est nécessaire."
    wheel:
      item1: "au bon moment"
      item2: "avec la rigueur clinique"
      item3: "avant la crise"
      item4: "au bon moment"
    cta_waitlist: "Entrer en liste d’attente"
    cta_demo: "Demander une démo"
    cta_sample_report: "Voir un rapport type"
  credibility_bar:
    fda_pre_submission: "FDA Pre-Submission déposée"
    eu_research_program: "Développé en parallèle d’un programme de recherche européen Horizon LONELY-EU de 3 M €"
  problem:
    tag: "Le constat"
    heading: "Vous mesurez tous les actifs <br> que vous gérez. Sauf un seul."
    description: "La finance a son grand livre. Le commercial a son pipeline. L’infrastructure a son taux de disponibilité. L’actif dont ces trois-là dépendent, la capacité de vos équipes à penser, à s’adapter et à travailler ensemble, est le seul qui ne soit pas mesuré. À mesure que l’IA absorbe les tâches routinières, cette capacité devient le premier facteur de réussite de votre organisation. L’OCDE l’appelle le capital cérébral. Les entreprises consacrent 93 % de leurs budgets IA à la technologie et 7 % aux personnes qui doivent l’absorber (Deloitte, 2026). On ne développe jamais ce que l’on ne mesure pas."
    cardiology:
      title: "En cardiologie"
      desc: "On repère les signaux d’alerte des années avant l’infarctus."
    oncology:
      title: "En oncologie"
      desc: "On dépiste avant l’apparition des symptômes."
    workforce:
      title: "Mais pour la santé <br> cérébrale au travail"
      desc: "Il n’existe ni dépistage ni point de référence. Rien n’est mesuré tant que rien ne casse, et la première donnée arrive au moment de l’entretien de départ."
    stats:
      - value: "20%"
        text: "des personnes salariées dans le monde se disent engagées au travail, le niveau le plus bas depuis 2020, soit, selon les estimations, $10 000 milliards de productivité perdue"
        source: "Gallup, 2026"
      - value: "49%"
        text: "des personnes actives aux États-Unis se disent en difficulté, plus que celles qui se disent épanouies (46 %), une première depuis le début des relevés"
        source: "Gallup, 2026 (États-Unis)"
      - value: "42%"
        text: "estiment que révéler des difficultés de santé mentale nuirait à leur carrière"
        source: "NAMI & Ipsos, 2025"
      - value: "<10%"
        text: "de recours aux EAP (programmes d’aide aux personnes salariées), alors que 82 % des entreprises en proposent un"
        source: "SHRM, 2024–2025 (États-Unis)"
  cost:
    heading: "Le coût de l’attente"
    description: "Nous passons à côté des signaux précoces qui permettraient d’éviter des problèmes bien plus lourds, parce que nous attendons qu’une personne aille déjà mal pour agir."
    stats:
      - value: "€600B"
        text: "Coût annuel, pour la seule UE, d’une santé mentale prise en charge en réaction."
      - value: "10–20%"
        text: "Croissance annuelle des demandes de remboursement en santé mentale chez les organismes payeurs."
      - value: "€15K"
        text: "Perte par personne en situation de crise : productivité perdue, coûts de remplacement et temps d’encadrement mobilisé pour chaque cas grave."
  pillars:
    heading: "De la réaction à la prévention, en trois étapes"
    description: "Trois piliers qui font passer la santé mentale d’une réponse de crise à une démarche anticipée, aux résultats mesurables."
    cta: "Entrer en liste d’attente"
    list:
      - image: "/images/dart-mission-goal-success.svg"
        tag: "PRÉCISION"
        title: "Mesurer avec la rigueur des standards cliniques"
        desc: "Un entretien conversationnel de 15 minutes suffit à construire une image propre à chaque personne de la façon dont ses liens sociaux fonctionnent, là où un questionnaire classique prend bien plus de temps et évalue tout le monde selon la même norme."
      - image: "/images/health.svg"
        tag: "PERSONNALISATION"
        title: "En finir avec les orientations à tâtons"
        desc: "L’IA oriente chaque personne vers l’accompagnement qui a le plus de chances de fonctionner pour elle, plutôt que par essais successifs. Nos modélisations projettent une amélioration 2 à 3 fois plus rapide ; la validation est en cours."
      - image: "/images/fraudprotectmajor.svg"
        tag: "PRÉVENTION"
        title: "Voir l’érosion tant qu’elle est encore réversible"
        desc: "La mesure répétée suit l’évolution des liens sociaux d’une conversation à l’autre et signale les cohortes dont la capacité s’érode, des semaines avant que cela n’apparaisse dans l’absentéisme ou les départs. Une alerte précoce validée au niveau individuel est en développement."
  how_it_works:
    tag: "L’instrument"
    heading: "Une conversation confidentielle. <br> Une mesure précise. <br> Une direction sur laquelle agir."
    description: "La personne salariée échange avec Entrelacs le temps d’une conversation brève et naturelle : non pas un formulaire, mais quelqu’un à qui parler. En dessous tourne Lacis, notre moteur psychométrique, qui mesure cette personne en particulier au lieu de la situer par rapport à une moyenne de population."
    cards:
      screen:
        title: "Calibré sur la personne, <br> non sur la population"
        desc: "Un questionnaire note vos réponses par rapport à une norme. Lacis, lui, vous modélise et restitue le fonctionnement réel de vos propres liens sociaux, plutôt que la moyenne de ceux de tout le monde."
      match:
        title: "Où il faut agir, <br> pas seulement un score"
        desc: "44 domaines, 26 dans la vie personnelle et 18 au travail. Chaque personne reçoit une Signature de lien social, les cinq domaines qui pèsent le plus aujourd’hui, ainsi qu’une Clé de voûte relationnelle : l’endroit unique où l’action porte le plus loin."
      monitor:
        title: "Confidentiel pour la personne, <br> des tendances pour l’organisation"
        desc: "Chaque personne obtient une image confidentielle de ses propres liens sociaux. Les responsables voient des tendances agrégées par groupes d’au moins dix personnes, avec des recommandations adaptées au profil de l’équipe. Jamais à celui d’une personne."
  trust:
    tag: "Cadre de confiance"
    heading: "Les données personnelles restent protégées, hors du regard de la hiérarchie. Confidentielles dès la conception."
    description: "Tout outil professionnel qui fait remonter des données sensibles à la hiérarchie produit le même effet : les gens cessent de dire la vérité. 42 % estiment que révéler des difficultés de santé mentale nuirait à leur carrière (NAMI & Ipsos, 2025). L’inverse est tout aussi documenté : face à un système, les réponses sont mesurablement plus sincères lorsqu’aucune personne chargée de les évaluer ne les observe (Lucas et al., 2014)."
    employee:
      title: "Ce qui reste du côté de la personne salariée"
      items:
        - "Les réponses individuelles ne sont jamais accessibles à l’employeur"
        - "Les repères personnels et l’historique n’appartiennent qu’à la personne concernée"
        - "La personne décide à tout moment du partage et de la suppression"
        - "La participation est volontaire ; le consentement est explicite et révocable"
    organization:
      title: "Ce que voit l’organisation"
      items:
        - "Uniquement des tendances agrégées, jamais des personnes"
        - "Des cohortes d’au moins dix personnes"
        - "Aucun chemin d’un résultat de groupe vers une personne"
        - "Tout usage en recherche exige un consentement distinct et révocable"
    note: "Sans cette condition, la mesure n’aurait aucune validité. <br> Entrelacs est un miroir privé au service de la personne salariée avant tout, et non un outil de surveillance qui rend des comptes sur elle."
  research:
    heading: "La rigueur de la recherche, la preuve sur le terrain"
    description: "Adossé à plus de 9 000 articles de recherche, à une base constituée dans 8 pays, et développé en parallèle d’un programme de recherche européen Horizon doté de €3M."
    partnership: "La recherche qui fonde Entrelacs alimente les travaux de l’OMS sur l’indice mondial du lien social et sert de socle au cadre européen de suivi du lien social"
    stats:
      - value: "9K+"
        label: "Articles de recherche analysés"
      - value: "8"
        label: "Pays représentés dans le corpus"
      - value: "€3M"
        label: "Programme de recherche européen Horizon"
      - value: "2027"
        label: "Marquage CE classe IIa visé"
  partners:
    heading: "Développé en collaboration avec les plus grandes institutions de recherche au monde"
    description: "Entrelacs repose sur des partenariats scientifiques mondiaux qui garantissent que chaque allégation clinique est fondée sur des preuves."
    logos:
      - src: "/images/university_of_california.png"
      - src: "/images/oecd.png"
      - src: "/images/university_of_oxford.png"
      - src: "/images/stanford_university.png"
      - src: "/images/european_commission.png"
        style: "max-height: 80px;"
  scientific_credibility:
    tag: "Crédibilité scientifique"
    title: "Le niveau de la recherche, <br> par construction."
    text_intro: "Conçu par une équipe de recherche qui a passé vingt ans à documenter pourquoi les instruments standard échouent à l’échelle de la personne, avant de construire celui que les données appelaient."
    stats:
      - value: "9,000+"
        desc: "articles de recherche passés au crible en sept langues, pour cartographier tous les instruments validés de mesure du lien social présents dans la littérature"
      - value: "354"
        desc: "entretiens approfondis menés dans huit pays et sur quatre continents, codés dans le modèle de domaines"
      - value: "€3M"
        desc: "programme européen Horizon LONELY-EU, dont notre directeur général est l’investigateur principal"
      - value: "FDA"
        subtitle: "Pre-Submission (dossier de pré-soumission) déposée"
        desc: "classification De Novo visée (voie réglementaire des instruments inédits) ; marquage CE classe IIa visé pour 2027"
    bottom_text: "Développé avec des conseils stratégiques à Stanford et à UC Davis, une affiliation de recherche à Oxford via notre directeur général, et en lien avec les travaux de l’OMS et de l’OCDE sur le lien social."
  help_now:
    heading: "Si vous avez besoin d’aide maintenant"
    intro1: "Entrelacs est un instrument de mesure, pas un service d’urgence. Si vous avez besoin d’aide tout de suite, il ne peut que vous orienter."
    intro2: "Si vous traversez une période difficile, ou si vous vous inquiétez pour quelqu’un, parlez-en à une personne : votre médecin, une ligne d’écoute, ou quelqu’un de confiance. Votre employeur n’est pas impliqué et ne peut pas voir que vous avez cherché de l’aide."
    items:
      - label: "France"
        text: "3114, numéro national de prévention du suicide"
      - label: "É.-U."
        text: "988 Suicide & Crisis Lifeline, appelez ou envoyez un SMS au 988"
      - label: "R.-U."
        text: "Samaritans, 116 123"
      - label: "Ailleurs"
        text: "recense les services par pays"
        link_text: "findahelpline.com"
        link: "https://findahelpline.com"
      - label: "Danger immédiat"
        text: "Appelez le 15 (SAMU) ou le 112."
    outro: "Si un élément de votre bilan vous a inquiété, parlez-en à une personne qualifiée plutôt que de le garder pour vous."
    image: "/images/helpNow.jpg"
  who_we_serve:
    tag: "Pour qui"
    heading: "Conçu pour le travail. <br> Développé selon des standards cliniques."
    cards:
      - bg_color: "#33486A"
        text_color: "#FFFFFF"
        arrow_color: "#FFFFFF"
        title: "Pour les personnes salariées"
        desc: "Un miroir privé, pas un outil de surveillance. Obtenez une lecture personnalisée de la façon dont le lien social fonctionne réellement dans votre vie et de l’endroit où un changement aurait le plus d’effet."
        cta_text: "En savoir plus"
