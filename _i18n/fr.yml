      - name: "Emorie Beck"
        role: "UC Davis"
        bio: "Spécialiste de premier plan de la mesure psychologique personnalisée et de la recherche sur les différences interindividuelles. Elle guide la méthodologie psychométrique et la science de la mesure sur lesquelles repose le moteur de bilan d’Entrelacs."
        image: "/images/teamMembers/DrEmorieBeck.png"
      - name: "Carson Kelly"
        role: "Compassion 2.0"
        bio: "Fort d’une longue carrière dans la tech, il défend l’approche Compassion 2.0. Il nous conseille sur l’intégration de modèles guidés par la compassion dans notre plateforme."
        image: "/images/teamMembers/CarsonKelly.png"
      - name: "Jackie Ourman, LMHC-D"
        role: "Fondatrice, Social Connection Collective"
        bio: "Psychothérapeute en exercice et fondatrice du Social Connection Collective, né du lancement de la Commission de l'OMS sur le lien social. Conseille sur le lien entre la mesure et la pratique de terrain."
        image: "/images/teamMembers/JackieOurman.png"

