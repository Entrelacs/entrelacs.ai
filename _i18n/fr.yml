about:
  meta:
    title: "À propos d’Entrelacs"
    description: "Découvrez Entrelacs, son équipe et sa mission : rendre la mesure de la santé mentale personnelle, privée et précise."
  title: "À propos d’Entrelacs"
  hero:
    title: "Nous créons l’instrument qui permet de mesurer l’actif que l’économie a oublié de prendre en compte."
    description: "Entrelacs rend mesurable le capital cérébral des travailleurs — la capacité humaine à créer des liens, à s’adapter et à réfléchir — afin que les organisations puissent enfin développer ce qu’elles n’ont jusqu’ici fait qu’espérer."

  vision_mission:
    heading: "Vision et mission"
    description: "Un monde où ce qui conduit aux crises de santé mentale devient visible assez tôt pour qu’on puisse agir."
    cards:
      - title: "Vision"
        desc: "Un avenir où la santé mentale sera prise en charge comme toute autre spécialité médicale, avec un repérage systématique, une prise en compte précoce des signaux et une intervention anticipée pour norme plutôt que pour exception."
      - title: "Mission"
        desc: "Rendre mesurables les déterminants de la santé mentale, grâce à une psychométrie avancée et à une IA conçue selon des standards cliniques, pour que les personnes, les équipes soignantes, les entreprises et les systèmes de santé disposent de quelque chose sur quoi agir tôt, et pas seulement au moment de la crise."
  origin_story:
    tag: "Nos origines"
    title: "Né d’un constat dérangeant. Bâti pour corriger ce qu’il révèle."
    card:
      heading_lead: "Entrelacs est né d’une question simple et radicale : "
      heading_bold: "et si le patient moyen n’existait pas ?"
      paragraphs:
        - "Pendant des décennies, la mesure psychologique a reposé sur un postulat commun : trouver le schéma qui convient au plus grand nombre, bâtir autour de ce centre, puis l’appliquer largement. Mais pour une large part des personnes que ces outils sont censés aider, le centre donne la mauvaise réponse. La dépression ne se manifeste pas de la même façon chez tout le monde. L’anxiété, le sentiment de solitude et l’épuisement professionnel non plus. Un score qui signifie une chose chez une personne en signifie une autre chez la suivante, non parce que l’instrument serait défaillant, mais parce que les personnes diffèrent réellement. Et les décisions prises à partir de ces scores s’enchaînent : mauvaise lecture, mauvais parcours, des mois perdus."
        - "Nous avons enfin la science pour modéliser des personnes, et non plus seulement des groupes. Nous avons le cadre de confiance qui permet de recueillir des données sincères. Il ne manquait qu’une équipe pour construire l’instrument."
        - "Aujourd’hui, Entrelacs mesure le lien social, le déterminant du bien-être psychique le mieux étayé et le moins lourd à recueillir, d’abord au sein des effectifs, avec une trajectoire réglementaire déjà engagée vers les soins cliniques, et une conviction sous l’ensemble : mesurer la personne plutôt que la moyenne."
  story:
    heading: "Notre histoire"
    subheading: "Né d’un constat dérangeant. Bâti pour corriger ce qu’il révèle."
    intro: "Entrelacs est né d’une question d’apparence simple, qui se révèle radicale :"
    question: "Et si le patient moyen<br>n’existait pas ?"
    main_text: "Pendant des décennies, la science de la santé mentale a reposé sur un postulat commun : trouver le schéma qui convient au plus grand nombre, bâtir autour de ce centre, puis l’appliquer largement. La démarche est raisonnable. Mais pour une part importante des personnes que ces outils sont censés aider, elle donne la mauvaise réponse. La dépression ne se manifeste pas de la même façon chez tout le monde. L’anxiété, le sentiment de solitude et l’épuisement professionnel non plus. Un score obtenu sur une échelle peut signifier une chose chez une personne et tout autre chose chez une autre, non parce que l’instrument serait défaillant, mais parce que les êtres humains diffèrent réellement dans leur façon d’éprouver leurs états psychologiques. Recommander une prise en charge à partir de ce score, sans comprendre ces différences, cause de vrais dommages. Et comme chaque erreur d’appréciation en appelle d’autres, mauvais parcours, mauvais traitement, des mois voire des années perdues, le prix de l’erreur se paie en dégradation évitable."
    hidden_text_1: "Ce n’est pas une hypothèse marginale. C’est ce que la recherche montre de plus en plus clairement. Et c’est ce que savent déjà d’expérience bien des équipes soignantes comme bien des personnes soignées : trouver la bonne prise en charge en santé mentale, ajustée à ce que vous êtes vraiment, est réellement difficile. Quand votre bilan ne saisit pas qui vous êtes, le parcours de soins vers lequel il oriente peut être entièrement le mauvais. Et trouver la bonne prise en charge, ajustée à ce que vous êtes vraiment, est déjà réellement difficile, y compris pour qui a une formation clinique et connaît le système. La technologie permettant de faire mieux existe désormais. Ce qui manquait, c’était la volonté, et l’équipe, pour la construire correctement."
    hidden_text_2: "Entrelacs a été fondé pour combler cet écart. Bâtie sur une science ouverte, nourrie par plus de 9 000 articles de recherche et par des années d’entretiens menés dans 8 pays, la plateforme réunit l’IA, la modélisation psychométrique dynamique et la mesure répétée pour faire ce que les instruments en milieu professionnel n’avaient pas fait : mesurer la personne plutôt que la moyenne, et continuer de la mesurer à mesure que les choses changent. Et parce que le modèle est construit autour de qui chacune et chacun est, et non seulement du score obtenu, il montre où le lien social évolue et quel changement porterait le plus loin, tant qu’il reste de la marge pour agir."
    hidden_text_3: "Aujourd’hui, Entrelacs avance vers le marquage CE en 2027, en s’appuyant sur des conseils à Stanford et à UC Davis, sur une affiliation de recherche avec Oxford par l’intermédiaire de notre directeur général, et sur le Psychological Science Accelerator, ce réseau de recherche mondial dont notre directeur scientifique est directeur associé, avec une voie commerciale claire vers les entreprises, les systèmes de santé et les réseaux de soins qui en ont le plus besoin."
    more: "Lire la suite"
    less: "Réduire"
  founder:
    tag: "Le fondateur"
    title: "Le scientifique qui a cessé de croire à la personne moyenne."
    name: "Dr Hans Rocha IJzerman"
    role: "Directeur général et cofondateur"
    paragraphs:
      - "Hans Rocha IJzerman a quitté les Pays-Bas à 18 ans pour jouer au basket aux États-Unis, et a atterri dans un petit college bénédictin de Pennsylvanie dont les moines suivaient la même règle depuis quinze siècles : prêter attention à chaque personne, n’en tenir aucune pour interchangeable. La conviction s’est ancrée profondément, et elle a cohabité difficilement, deux décennies durant, avec la logique de sa propre discipline, qui mesurait de grands groupes, en dégageait la tendance centrale et construisait ses outils autour de ce centre."
      - "Ce sont les données qui ont tout changé. Lorsque Hans et son équipe de recherche ont vérifié si les instruments standard de qualité relationnelle mesuraient bien la même chose d’une personne à l’autre, la réponse fut non, de façon claire, empirique et reproductible. Si cela valait pour l’amour, cela valait aussi pour la dépression, l’anxiété et le sentiment de solitude, et chaque outil clinique bâti sur la moyenne laissait systématiquement échapper quelque chose."
      - "Ce manque avait un visage : sa compagne Daniela, psychologue avec quinze ans de pratique, y était confrontée chaque jour, avec des scores qui ne voulaient pas dire ce qu’ils semblaient dire et des personnes envoyées sur le mauvais parcours parce que l’instrument n’était pas fait pour les comprendre. D’un côté un scientifique convaincu que sa discipline posait la mauvaise question, de l’autre une clinicienne qui en constatait le prix."
      - "Entrelacs est né de cette rencontre."
  who_we_serve:
    tag: "Nous contacter"
    heading: "Construisons ensemble l’avenir de la santé mentale"
    des: "Entreprise, structure de soins, système de santé, investissement ou recherche : d’où que vous veniez, nous serons ravis de vous lire."
    cards:
      - bg_color: "#F2EFE9"
        title: "Entreprises et systèmes de santé"
        desc: "Demandez une démo et une estimation du retour sur investissement adaptées à votre organisation."
        cta_text: "Demander une démo"
        link: "/contact-us/"
