employers:
  meta:
    title: "Entrelacs pour les employeurs"
    description: "Découvrez comment Entrelacs aide les entreprises à mesurer le capital cérébral, repérer les besoins plus tôt et renforcer l’impact des dispositifs déjà financés."
  hero:
    eyebrow: "ENTRELACS POUR L’EMPLOYEUR"
    title: "Vos avantages sociaux sont financés. Rien ne vous dit qui en a besoin."
    description: "À mesure que l’IA absorbe l’exécution routinière, le travail qui subsiste est celui qui dépend le plus de l’état réel de vos équipes : le jugement, l’adaptation, la collaboration. Cette capacité porte un nom, le capital cérébral, et elle ne figure sur aucun tableau de bord dont vous disposez. Entrelacs la mesure à travers le lien social, celui de ses déterminants qui réunit le niveau de preuve le plus élevé pour la charge la plus faible, et elle la mesure personne par personne, parce qu’une moyenne vous apprend que le collectif va mal sans vous dire qui, ni pourquoi."
    cta_demo: "Demander une démo"
    cta_sample: "Voir un rapport type"
  credibility:
    items:
      - "Pre-Submission FDA (dossier de pré-soumission) déposée"
      - "Développé en parallèle du programme de recherche européen Horizon LONELY-EU, doté de €3M"
      - "Conseillé par des scientifiques de Stanford et de UC Davis"
      - "Travaux de recherche qui alimentent ceux de l’OMS et de l’OCDE sur le lien social"
  decade:
    tag: "Le problème"
    title: "Dix ans de dépenses, toujours aucun signal."
    intro:
      - "Les organisations consacrent 93 % de leurs dépenses d’IA à la technologie et 7 % à l’accompagnement des personnes censées l’absorber (Deloitte, 2026). Ce qui décide du retour, c’est la capacité d’adaptation de vos équipes, ce que l’OCDE appelle le capital cérébral. Elle ne se teste pas directement : un test cognitif devient un examen de performance dès l’instant où on le répète. Elle doit donc se lire à travers ses déterminants, et personne ne le fait."
      - "Les outils qui s’en approchent le plus ne seraient d’aucun secours s’ils le faisaient. Ils situent chaque personne par rapport à une moyenne de population, si bien que deux personnes salariées qui obtiennent le même score peuvent être épuisées pour des raisons entièrement différentes. L’une n’a personne vers qui se tourner, l’autre ne se sent pas reconnue. Toutes deux obtiennent 5,5 sur 7 à votre test. Dix ans de dépenses consacrées aux EAP (programmes d’aide aux personnes salariées), aux applications de bien-être et aux enquêtes d’engagement ont produit des programmes, non de la mesure. Tous sont aveugles au même endroit :"
    rows:
      - title: "L’EAP attend qu’on l’appelle, ce qui arrive rarement."
        text: "82 % des employeurs en proposent un ; le taux de recours ne dépasse pas quelques points de pourcentage"
        source: "SHRM, 2024–2025 (États-Unis)"
      - title: "L’enquête d’engagement restitue des moyennes"
        text: "Quelques fois par an, elle décrit le collectif et jamais la personne, et l’on y répond en sachant que les résultats remontent à la direction. 42 % estiment que révéler une difficulté de santé mentale nuirait à leur carrière"
        source: "NAMI & Ipsos, 2025"
      - title: "Les solutions ponctuelles exigent que quelqu’un lève la main"
        text: "Chaque outil ne s’active que lorsqu’une personne en difficulté se signale elle-même, dans un environnement où le faire paraît risqué. Environ 97 % des personnes qui utilisent un outil numérique autonome de santé mentale l’abandonnent en moins de 30 jours ; la rétention médiane à 30 jours s’établit à 3,3 %"
        source: "Baumel et al., 2019"
    stats:
      - value: "1 sur 5"
        text: "des personnes salariées dans le monde déclarent avoir éprouvé un sentiment de solitude pendant une grande partie de la veille"
        source: "Gallup, 2024"
      - value: "$154B"
        text: "coût annuel estimé du déficit de lien social au travail, en perte de productivité et en absentéisme"
        source: "Cigna, 2023 (États-Unis)"
      - value: "50–55%"
        text: "des emplois aux États-Unis devraient être transformés par l’IA d’ici deux à trois ans"
        source: "Boston Consulting Group, 2026"
      - value: "2.2%"
        text: "des entreprises évaluées mènent auprès de leurs effectifs des enquêtes consacrées à la santé et au bien-être"
        source: "S&P Global / McKinsey Health Institute, 2024"
    footer: "Lorsque le risque apparaît dans un entretien de départ, vous ne lisez déjà plus que de l’histoire, et ce qui manque alors n’est pas un programme de plus mais la mesure."
  three_moves:
    tag: "Fonctionnement"
    title: "De l’absence de mesure à la décision, en trois temps"
    accordion:
      - title: "Une conversation, là où l’on attend un questionnaire"
        text: "Chaque personne s’entretient en privé avec Entrelacs, une quinzaine de minutes la première fois. Lacis la rapproche de celles dont la psychologie évolue de la même manière, puis ne tire que les questions porteuses d’information réelle pour quelqu’un de ce groupe. Si le lien social sert de porte d’entrée, c’est pour une raison précise : parmi les déterminants de la santé cérébrale, il réunit le niveau de preuve le plus élevé pour la charge la plus faible, et il est le seul que l’on puisse mesurer de façon répétée sans que la mesure ne devienne un test."
        image: "/images/employersPage/accordion1.webp"
      - title: "Un miroir privé pour chaque personne salariée"
        text: "Chaque personne reçoit une image confidentielle de ses propres liens sociaux : sa Signature de lien social, c’est-à-dire les cinq domaines qui comptent le plus pour elle en ce moment, et, à l’intérieur de celle-ci, sa Clé de voûte relationnelle, le seul endroit où agir apporterait le plus. Cette lecture sert d’abord la personne salariée, ce qui lui donne une raison à elle d’y revenir. L’accès de la direction est verrouillé par l’architecture du produit, et non par une règle interne."
        image: "/images/employersPage/accordion2.webp"
      - title: "Des tendances fidèles à la réalité de votre organisation"
        text: "Vous voyez des tendances agrégées et anonymisées, par cohortes d’au moins dix personnes : les équipes dont le lien social s’érode, les domaines qui en sont à l’origine, et les endroits où vos programmes existants sont le plus nécessaires. Dans une organisation de 1 000 personnes, cela signifie généralement des restitutions par direction, par site et par fonction, chaque cohorte se situant au seuil de confidentialité ou au-dessus. Aucune personne n’est jamais exposée, et les personnes salariées le savent. C’est pourquoi les données sur lesquelles vous agissez sont des données que les personnes ont livrées sincèrement."
        image: "/images/employersPage/accordion3.webp"
    note: "Voyez ce que vous obtiendriez : un exemple annoté du tableau de bord organisationnel et un rapport individuel anonymisé, avec la mention affichée dans le produit qui indique à chaque personne comment ses données sont agrégées (“ces résultats sont agrégés sur 10 personnes salariées”). Nous montrons l’architecture de confidentialité au lieu de la décrire."
    cta_sample: "Voir un rapport type"
  cohort:
    tag: "Ce que vous faites du signal"
    title: "Quand la capacité d’une cohorte commence à s’éroder"
    subtitle: "La mesure ne compte que si elle change une décision. Deux boucles fonctionnent dès le premier jour."
    employee_card:
      title: "La boucle de la personne salariée, privée"
      text: "Chaque personne voit sa propre signature et sa clé de voûte, accompagnées d’éclairages qu’elle peut utiliser. Personne ne rend compte d’elle ; ce qu’elle en fait n’appartient qu’à elle."
    org_card:
      title: "Votre boucle, agrégée"
      text: "Le tableau de bord vous montre par exemple que, dans une fonction donnée, les domaines de lien social au travail se sont érodés sur deux relevés consécutifs, avec une concentration sur la sécurité psychologique : les personnes n’ont pas le sentiment de pouvoir s’exprimer sans que cela leur coûte. Un tel constat se traduit en actions : accompagner l’encadrement sur sa manière de réagir aux erreurs et aux désaccords, clarifier les rôles et les périmètres de décision, reprendre avec les équipes les règles du jeu sur l’expression des préoccupations. Il s’agit de signaux indicatifs portant sur les effectifs, non d’alertes cliniques portant sur des personnes, et nous fournissons un guide de gouvernance élaboré avec des spécialistes cliniques sur la façon d’y répondre. Lus sur un trimestre, ces mêmes relevés vous disent ce qu’aucune enquête d’engagement ne peut dire : si les parties de votre organisation qui absorbent le plus de changement lié à l’IA tiennent leur capacité, ou la perdent silencieusement."
    roadmap:
      title: "Sur la feuille de route"
      text: "Un système de recommandations pour construire le capital cérébral à l’échelle des équipes ; une orientation intégrée au produit qui met chaque personne en relation, de manière privée, avec les ressources nommément identifiées de votre dispositif d’avantages sociaux, sans jamais adresser à l’employeur de rapport sur une personne ; ainsi que des intégrations avec le SIRH et les outils collaboratifs."
    consent:
      title: "Votre consentement, en quatre lignes"
      items:
        - "La participation est volontaire. Le fait de ne pas participer n’est pas visible par votre employeur."
        - "Le consentement est explicite et révocable à tout moment. Son retrait met fin à la collecte."
        - "L’utilisation à des fins de recherche relève d’un consentement distinct, recueilli séparément et révocable séparément."
        - "L’infrastructure est chiffrée et conforme au RGPD, hébergée sur une infrastructure certifiée HDS, les données au repos restant dans l’Union européenne."
  stop_guessing:
    tag: "Notre différence"
    title: "Cesser de supposer, commencer à mesurer."
    description: "Entrelacs ne concurrence ni votre EAP, ni votre plateforme clinique, ni vos avantages bien-être. C’est la couche de mesure qui leur a toujours manqué. Votre socle a été construit pour répondre ; ce qu’il n’a pas, c’est l’instrument qui montre où la réponse est nécessaire. Lors d’une revue de vos avantages sociaux, Entrelacs montre où vos programmes sont réellement utiles et où ils ne le sont pas — et, parce qu’il mesure le déterminant de la capacité cognitive plutôt qu’un ressenti, il répond à une question que votre socle n’a jamais été conçu pour traiter : vos équipes peuvent-elles porter le changement que vous leur demandez."
    accordion:
      - title: "Une mesure prise personne par personne, et c’est ce qui en fait un instrument"
        text: "Tous les autres outils financés sur cette ligne budgétaire mesurent un ressenti ou dispensent des soins, et situent les personnes par rapport à une moyenne de population. Entrelacs mesure le déterminant de la capacité cognitive personne par personne : à notre connaissance, c’est le premier instrument en milieu professionnel qui modélise chaque personne à partir de sa propre référence, de sorte qu’un capital cérébral mesuré sur des moyennes n’est pas une mesure du capital cérébral, mais une enquête d’engagement dotée d’un vocabulaire neuf."
      - title: "Sincère par construction"
        text: "Les plateformes d’enquête ne peuvent pas modéliser des personnes sans devenir des outils de surveillance. Les plateformes de soin mesurent les personnes qui se manifestent, à l’entrée et selon des normes de population, parce que leur chiffre d’affaires repose sur la conversion de la mesure en prise en charge : mesurer l’ensemble d’un effectif à cadence régulière, chacune sur sa propre référence et sans parcours de soins au bout, ne leur rapporte rien. Le verrouillage de la confidentialité est ce qui rend les données sincères, et comme l’acheteur des acteurs en place est le manager, le reproduire leur coûterait ce qu’ils vendent."
      - title: "Un ancrage clinique"
        text: "Fondé sur cinq années de recherche (354 entretiens approfondis dans huit pays et sur quatre continents, une revue systématique des instruments de mesure du lien social validés dans le monde, une étude de validation psychométrique menée sur des échantillons représentatifs de trois pays) et conçu selon des standards cliniques : méthode de mesure en cours de brevet, Pre-Submission FDA déposée, classification De Novo visée (voie réglementaire des instruments inédits). Un niveau de rigueur qu’aucune application de bien-être ni aucun éditeur d’enquêtes ne présente."
  what_you_get:
    tag: "Ce qui existe et ce qui vient"
    title: "Ce que vous obtenez aujourd’hui, et où va l’instrument."
    live:
      title: "Disponible aujourd’hui (V1)"
      items:
        - "Bilan conversationnel du lien social, propre à chaque personne (44 domaines : 26 dans la vie, 18 au travail)"
        - "Profil individuel de lien social pour chaque personne salariée : signature en cinq domaines et clé de voûte au plus fort effet de levier"
        - "Restitution du capital cérébral à l’échelle des cohortes : quelles parties de l’organisation tiennent leur capacité et lesquelles s’érodent"
        - "Restitution des tendances indicatives par cohorte, d’un relevé à l’autre : où le lien social évolue, et dans quels domaines. Il ne s’agit pas de prédiction."
        - "Tableau de bord organisationnel agrégé (cohortes d’au moins dix personnes) : tendances, évolutions, domaines moteurs"
        - "Infrastructure conforme au RGPD ; architecture donnant la priorité à la confidentialité, où les données appartiennent à la personne salariée"
    roadmap:
      title: "Sur la feuille de route"
      items:
        - "Recommandations privées personnalisées, ajustées à la clé de voûte de chaque personne, issues d’une bibliothèque d’interventions référencées par niveau de preuve (V1.3)"
        - "Signaux précoces prédictifs validés, issus de la mesure longitudinale (en cours de validation pour la V2)"
        - "Domaines supplémentaires au-delà du lien social, dont des dimensions de la dépression et de l’anxiété, développés selon la même démarche scientifique"
        - "Orientation intégrée au produit vers les ressources nommément identifiées de votre dispositif d’avantages sociaux, privée pour la personne salariée et ne donnant jamais lieu à un rapport adressé à l’employeur, ainsi que des intégrations avec le SIRH et les outils collaboratifs"
    disclaimer: "Nous publions cette distinction à dessein. Depuis dix ans, on promet trop, et trop vaguement, aux organisations qui achètent dans cette catégorie ; nous préférons perdre un contrat à cause de ce que nous ne savons pas encore faire plutôt que d’en gagner un grâce à cela."
  faq:
    title: "Questions fréquentes"
    items:
      - q: "Que voit réellement mon organisation ?"
        a: "Des tendances agrégées et anonymisées, par cohortes d’au moins dix personnes : les évolutions, les domaines, le sens dans lequel ils vont. Jamais les réponses, les scores ni l’identité d’une personne. Le document d’une page, en langage clair, que nous remettons à vos équipes décrit exactement ce que vous pouvez voir et ce que vous ne pouvez pas voir."
      - q: "Pourquoi les équipes utiliseraient-elles ce produit alors qu’elles n’utilisent pas notre EAP ?"
        a: "L’EAP demande à une personne en difficulté de lever la main. Entrelacs donne à chaque personne une lecture privée de ses propres liens sociaux. C’est un pari de conception, et nous le traitons comme tel : les taux de participation et de réutilisation vous sont communiqués chaque trimestre, à partir de vos propres effectifs."
      - q: "Pourquoi mesurer le lien social plutôt que tester directement la capacité cognitive ?"
        a: "Parce qu’un test cognitif déployé à l’échelle des effectifs devient un examen de performance. On s’y prépare, il ne peut pas être répété à intervalles réguliers, et il produit une anxiété de l’évaluation précisément chez les personnes que vous cherchez à protéger. Le capital cérébral doit se mesurer à travers ses déterminants, et le lien social est le seul qui puisse être mesuré en continu sans que la mesure ne modifie ce qu’elle mesure."
      - q: "Quel est le rapport avec notre investissement dans l’IA ?"
        a: "Un rapport direct. Le rendement de l’IA dépend de la capacité des personnes à prendre en charge un travail plus stratégique, à s’adapter assez vite et à mettre en œuvre le changement. Vous mesurez déjà en détail le versant technologique de cet investissement. Voici l’instrument qui mesure l’autre versant, au même rythme trimestriel."
      - q: "Notre plateforme d’engagement ajoute des scores de bien-être. N’est-ce pas la même chose ?"
        a: "Non, et l’écart est de nature structurelle plutôt que fonctionnelle. Une plateforme d’engagement restitue des moyennes à la direction, parce que c’est l’encadrement qui achète. Cette architecture ne peut pas produire de mesure au niveau de la personne sans devenir un dispositif de surveillance, et elle ne peut pas produire de données sincères tant que l’ensemble du personnel sait que les résultats remontent. Ajouter une question de bien-être à une enquête construite sur des moyennes vous donne un nombre de plus, affecté des deux mêmes défauts : il ne vous dit ni qui, ni pourquoi."
      - q: "Cela remplace-t-il quelque chose que nous avons déjà ?"
        a: "Cela remplace les suppositions, non les programmes. Entrelacs est la couche de mesure posée sur votre dispositif existant : il montre où votre EAP, votre plateforme clinique et vos dépenses de bien-être sont nécessaires, et, lors d’une revue de rationalisation, quelles lignes justifient leur reconduction."
  final_cta:
    badge: "Santé cérébrale. Personnelle, privée, précise."
    title: "Commencez à mesurer l’actif dont tout le reste dépend."
    subtext: "Nous constituons notre première cohorte de partenaires pilotes : un petit groupe d’entreprises qui souhaitent un accès anticipé, une influence directe sur la feuille de route et un moyen d’agir en amont pour leurs équipes."
    cta_primary: "Demander une démo"
    cta_secondary: "Postuler comme partenaire pilote"

employees:
  meta:
    title: "Entrelacs pour les personnes salariées"
    description: "Découvrez comment Entrelacs offre aux personnes salariées une lecture privée et personnalisée de leur lien social, sans exposer leurs réponses à l’employeur."
  hero:
    eyebrow: "ENTRELACS POUR LES ÉQUIPES"
    title: "Quinze minutes pour une lecture de ce que vous vivez, sans comparaison avec les autres."
    description: "Entrelacs mesure le lien social, le déterminant du capital cérébral qui repose sur les preuves les plus solides et dont la mesure coûte le moins. Il le mesure pour vous en particulier, et non au regard d’une moyenne de population. Votre employeur a acheté l’instrument. Il ne peut pas voir vos réponses, ni maintenant ni jamais."
    cta_sample: "Voir un rapport type"
    cta_employer: "Aller à ce que voit votre employeur"
    image: "/images/employeesPage/hero.webp"
  why_bother:
    tag: "Pourquoi le faire"
    title: "Le résultat vous revient d’abord à vous : c’est le principe même de sa conception."
    text: "La plupart des enquêtes internes vous posent des questions et transmettent les données directement à la direction. Six semaines plus tard, vous en voyez une diapositive en réunion générale. Forcément, vous répondez avec prudence plutôt qu’avec franchise."
    text2: "La mesure ne fonctionne qu’avec des réponses franches, et personne ne répond franchement à un système qui ne lui rend rien. Il faut donc que la première conversation vaille votre temps, et que la dixième le vaille encore davantage."
  forty_two:
    tag: "Ce que cela vous apprend"
    title: "« Ça va, c’est juste la fatigue » : une seule phrase qui recouvre 44 choses différentes."
    text: "Quand quelque chose ne va pas, on n’a le plus souvent qu’un mot pour le dire. Fatigue. Lassitude. Décalage. Une seule sensation, donc une seule explication, généralement le travail, le sommeil, ou vous-même."
    text2: "En dessous, il y a des dizaines de choses distinctes, et toutes sont des facettes d’une seule : la nature de vos liens avec les personnes qui vous entourent. Savoir s’il existe quelqu’un devant qui vous pouvez être entièrement vous-même. Savoir si une part de vous craint de déranger. Savoir si une semaine ordinaire contient du contact réel ou surtout de la logistique. Savoir si vous pourriez dire une chose difficile au travail sans que cela vous coûte. Savoir si le travail que vous faites est remarqué par quelqu’un."
    text3: "Entrelacs en lit 44 : 26 dans votre vie, 18 au travail, lus séparément parce qu’ils ne varient pas ensemble. Si c’est le lien social qui est mesuré, c’est pour une bonne raison : de tout ce qui façonne votre état, c’est lui qui repose sur les preuves les plus solides et qui demande le moins d’efforts de mesure. Le rapport vous dit donc ce que ces quarante-quatre domaines donnent une fois réunis, c’est-à-dire où vous en êtes en matière d’épuisement professionnel, de sentiment de solitude, de baisse de moral et de santé physique, ainsi que le domaine de lien qui pèse le plus dans ce résultat. Ce sont des indications, et non l’identification d’une maladie ; chacune vient avec le levier correspondant."
    text4: "Un ressenti vague et lourd devient des choses précises, situées à des endroits précis, et si l’on peut agir sur des choses précises, un ressenti vague, lui, ne peut qu’être subi."
    image: "/images/employeesPage/forty-two.webp"
  four_moves:
    tag: "Comment il vous lit"
    title: "Quatre opérations. La méthode s’appelle Key Signature Reconstruction, reconstruction de la signature clé, et voici ce que chacune vous apporte."
    subtitle: "C’est ce qui distingue Entrelacs de toutes les enquêtes qu’on vous a envoyées. La différence ne tient pas aux questions, mais à ce qu’il advient de vos réponses."
    accordion:
      - title: "Lacis détermine aux côtés de qui vous lire."
        text: "Il ne s’agit pas de personnes qui vous ressemblent sur le papier, mais de personnes dont les variations suivent le même mouvement que les vôtres au fil du temps. Les conclusions vous concernent donc réellement. Si les conseils génériques tombent si souvent à côté, c’est qu’ils sont tirés d’une moyenne calculée sur tout le monde, et que la personne moyenne n’existe pas."
        image: "/images/employeesPage/accordion1.webp"
      - title: "Il cesse de vous demander ce qu’il peut déjà déduire."
        text: "Il ne tire que les questions qui apportent une information réelle pour quelqu’un comme vous, et reconstruit le reste. Quinze minutes au lieu d’une heure, sans longue série de questions hors sujet. La plupart des gens éprouvent l’inverse de la lassitude des questionnaires : une question arrive, et elle tombe si juste que c’en est troublant."
        image: "/images/employeesPage/accordion2.webp"
      - title: "Entrelacs vous cartographie comme un système, sans vous réduire à une grille de notes."
        text: "Vos réponses forment un réseau dans lequel les éléments se tiennent les uns les autres. Cela éclaire ce qui n’avait jamais eu de sens : pourquoi tout peut aller sur le papier alors que rien ne va, pourquoi la solution évidente n’a rien changé, pourquoi une seule perte a semblé en entraîner trois autres."
        image: "/images/employeesPage/accordion3.webp"
      - title: "Il vous indique le seul point sur lequel appuyer."
        text: "Parmi tout ce que le modèle lit, un point déplace le reste du réseau plus que n’importe quel autre. C’est votre clé de voûte, l’endroit unique où un effort a le plus de chances de se propager partout ailleurs, ce qui vous évite d’avoir à deviner par où commencer."
        image: "/images/employeesPage/accordion4.webp"
  remembers:
    tag: "Ce qui change quand il vous connaît"
    title: "La plupart des outils vous disent où vous vous situez ; celui-ci vous dit comment vous avez changé."
    text: "Toutes les applications de bien-être que vous avez essayées vous notaient par rapport à d’autres personnes, et c’est pourquoi ce chiffre n’a jamais dit grand-chose : il ne pouvait pas vous dire si un mois difficile marquait un vrai changement ou n’était qu’un mois difficile. Entrelacs construit un modèle de vous en particulier, et peut donc voir quand vous avez bougé."
    image: "/images/employeesPage/remembers.webp"
    cards:
      - title: "Moins de questions au fil du temps"
        text: "À mesure qu’il apprend ce qui est stable chez vous, il cesse de le demander. La conversation raccourcit à chaque fois."
      - title: "Vous voyez si cela a fonctionné"
        text: "Agissez sur votre clé de voûte, et la fois suivante vous verrez si le réseau a bougé. Les conseils, il y en a partout ; la preuve que votre effort a changé votre situation, beaucoup moins."
      - title: "Vous voyez la dérive avant qu’elle ne devienne un mauvais mois"
        text: "Avec assez d’historique, le modèle peut signaler que vos schémas commencent à évoluer comme ils évoluent d’habitude avant que les choses ne se compliquent : tôt, discrètement, et à vous. Personne d’autre n’en est informé, jamais."
      - title: "Il vous relit quand votre vie change"
        text: "Nouvelle hiérarchie, nouvelle ville, nouvel enfant. Votre modèle est réestimé, parce qu’il n’a jamais été question de vous ranger dans une catégorie."
    note:
      title: "Où nous en sommes aujourd’hui"
      text: "Le modèle propre à chaque personne, votre Signature de lien social, votre Clé de voûte relationnelle et la possibilité de poser des questions sur votre rapport sont disponibles dès maintenant. La continuité entre les conversations, le bilan qui raccourcit et l’alerte précoce personnelle sont en développement. Nous vous préviendrons à chaque arrivée, et rien de tout cela ne change qui peut voir vos données."
  the_line:
    tag: "La limite"
    title: "Ce que votre employeur voit, et ce qu’il ne verra jamais."
    you_card:
      title: "Ce que vous voyez"
      text: "Vos réponses. Vos mots. Votre rapport. Votre signature. Votre clé de voûte. Et l’évolution de tout cela dans le temps, cet historique qui devient la partie la plus utile pour vous."
      image: "/images/employeesPage/what-you-see.webp"
    them_card:
      title: "Ce que votre employeur voit"
      text: "Des tendances sur des groupes de dix personnes ou plus. Les endroits où le lien social s’érode dans une équipe ou une fonction, et lesquelles des ressources d’accompagnement qu’il finance déjà répondent à un besoin réel. Rien n’est jamais attribuable à une personne. Aucun résultat individuel ou identifiable ne parvient à la direction, à aucun moment et sous aucune forme, y compris si elle en fait la demande."
      image: "/images/employeesPage/what-they-see.webp"
    notes:
      - title: "Pourquoi dix"
        text: "En dessous de ce seuil, une moyenne de groupe peut être remontée jusqu’aux personnes. Il n’y a donc aucune restitution en dessous. Pas de seuil abaissé pour une petite équipe, pas d’exception pour une demande venue de la direction. C’est une propriété du système lui-même, et non une règle que quelqu’un applique et pourrait donc lever."
      - title: "Où vos données se trouvent"
        text: "Votre profil individuel est chiffré à votre nom. La couche de restitution destinée à votre employeur est un système distinct, situé en aval, qui ne reçoit jamais que des agrégats soumis au seuil. Les deux ne sont pas reliés par un réglage d’autorisation que quelqu’un pourrait modifier."
    consent:
      title: "Votre consentement, en quatre lignes"
      items:
        - "La participation est volontaire, et votre employeur ne voit pas qui s’abstient"
        - "Le consentement est explicite et révocable à tout moment ; le retirer arrête la collecte"
        - "L’usage en recherche relève d’un consentement distinct, demandé séparément et retirable séparément"
        - "L’infrastructure est chiffrée et conforme au RGPD, hébergée sur une infrastructure certifiée HDS, les données au repos restant dans l’Union européenne"
    later:
      title: "Plus tard, et seulement si vous le demandez"
      text: "Une version future pourra s’appuyer sur des signaux que vous produisez déjà, un historique que vous exportez vous-même ou des données de bracelet connecté comme le sommeil et la variabilité de la fréquence cardiaque, pour affiner l’image entre deux conversations. L’activation est facultative, elle part de vous, elle reste révocable et elle n’alimente que votre propre profil. Rien ne passe jamais par votre employeur, cette fonction n’existe pas dans la version que vous utilisez aujourd’hui, et personne d’autre ne pourra jamais l’activer à votre place."
  ai_question:
    tag: "La question de l’IA"
    title: "Oui, il y a une IA. Non, ce n’est pas elle qui vous évalue."
    text: "Il est sain de se méfier de l’IA dès qu’il s’agit de santé mentale. Les agents conversationnels généralistes jugent mal les situations à fort enjeu, ils ont tendance à vous approuver plutôt qu’à vous évaluer, et presque aucun n’a fait l’objet d’une évaluation dans la durée."
    text2: "Nous n’en avons donc pas construit un. Le modèle de langage conduit la conversation : il transforme ce que vous dites en données structurées et vous explique vos résultats en langage clair. Son rôle s’arrête là."
    text3: "Il ne vous note pas, il ne vous évalue pas, et il ne se prononce en rien sur votre état de santé. Toutes les mesures et tous les calculs de réseau s’exécutent de façon déterministe dans Lacis, de manière auditable et traçable. La structure dans laquelle il vous situe a été apprise à l’avance à partir de cinq années de recherche, et non improvisée sur le moment par un modèle génératif."
    image: "/images/employeesPage/ai-question.webp"
  faq:
    title: "Questions fréquentes"
    items:
      - q: "Combien de temps cela prend-il ?"
        a: "Environ quinze minutes la première fois, puis moins ensuite, à mesure que l’instrument apprend ce qu’il peut cesser de demander."
      - q: "À quelle fréquence me le proposera-t-on ?"
        a: "Aussi souvent que cela vous est utile. Aucune fréquence n’est imposée, et tout rappel peut être désactivé. La plupart des gens trouvent un point utile quand quelque chose a changé, ou à quelques mois d’intervalle."
      - q: "Se souviendra-t-il de moi d’une conversation à l’autre ?"
        a: "Aujourd’hui, chaque conversation se suffit à elle-même, et votre profil est conservé pour que vous puissiez consulter votre rapport précédent. La continuité est en cours de développement. Quand elle arrivera, elle vous appartiendra, chiffrée à votre nom, et restera invisible pour votre employeur."
      - q: "Ma hiérarchie peut-elle demander mes résultats ?"
        a: "Elle peut le demander, mais il n’y a rien à lui remettre : les résultats individuels n’existent sous aucune forme que votre employeur puisse atteindre."
      - q: "Et si j’arrête en cours de route ?"
        a: "Il ne se passe rien. La participation est volontaire d’un bout à l’autre et le consentement est révocable, et rien de tout cela n’est visible pour votre employeur."
      - q: "Et si je suis la seule personne de mon équipe à l’utiliser ?"
        a: "Alors il n’y a pas de cohorte et rien n’est restitué, puisque le plancher est fixé à dix."
      - q: "Et si je ne me reconnais pas du tout dans le rapport ?"
        a: "Dites-le, dans la conversation. Vous pouvez demander pourquoi il vous a lu ainsi et ce qui changerait l’image. Le modèle est une reconstruction et non un verdict, et un écart constitue une information utile plutôt qu’un débat qu’il vous faudrait gagner."
      - q: "Et si je ne vais pas bien en ce moment ?"
        a: "Reportez-vous au bloc situé au bas de chaque page. Entrelacs n’est pas ce vers quoi se tourner dans un moment difficile, et il vous orientera vers ce qui l’est."
      - q: "Qu’advient-il de mon profil si je quitte l’entreprise ?"
        a: "Votre profil est rattaché au compte de votre employeur. À votre départ, il est supprimé, et la suppression est effective dans un délai de 30 jours. Si vous avez consenti à un usage en recherche, ce consentement est distinct, et vous pouvez le retirer à tout moment, avant comme après votre départ. Toute question relative à vos données est à adresser à dpo@entrelacs.ai."
      - q: "Qui contacter au sujet de mes données ?"
        a: "Notre DPO, la personne déléguée à la protection des données, traite tout ce qui concerne vos données : accès, rectification, suppression et consentement, y compris son retrait. Écrivez à dpo@entrelacs.ai. Votre employeur n’intervient pas dans ces demandes et ne peut pas en avoir connaissance."

care_settings:
  meta:
    title: "Entrelacs pour les structures de soins"
    description: "Découvrez comment Entrelacs apporte une mesure de santé mentale propre à chaque personne aux cliniques, systèmes de santé et partenaires de recherche."
  hero:
    eyebrow: "ENTRELACS EN STRUCTURES DE SOINS"
    title: "Votre patientèle vit entre vos consultations, et la mesure devrait y être elle aussi."
    description: "Entrelacs construit l’instrument de mesure propre à chaque personne pour les soins en santé mentale : conversationnel, adossé à la clinique et conçu en vue d’une autorisation réglementaire. Nous ouvrons un programme de partenariat clinique en nombre limité, destiné aux cliniques, aux systèmes de santé et aux équipes de recherche qui construiront ce chemin avec nous."
    cta_primary: "Parler à notre équipe clinique"
    cta_secondary: "Explorer un partenariat de recherche"
  the_gap:
    tag: "L’écart"
    title: "Le soin est continu, la mesure reste épisodique."
    text: "La mesure se fait aujourd’hui aux moments que le soin peut observer : admission, consultations, crise. Entre ces moments, là où la dégradation prend forme, les instruments habituels restent muets. Et ces instruments ont été étalonnés sur des populations, non sur des personnes : deux personnes suivies aux scores identiques peuvent aller mal pour des raisons entièrement différentes, et un score rapporté au patient moyen peut orienter vers un parcours inadapté à la personne réellement présente."
    text2: "La science de la mesure permettant de faire mieux existe désormais. La modélisation en réseau propre à chaque personne, qui constitue le cœur d’Entrelacs, lit chaque individu par rapport à la référence de son propre sous-groupe plutôt qu’à une norme de population, et restitue non seulement la sévérité, mais aussi le domaine qui compte le plus pour cette personne."
  brings:
    tag: "Ce qu’Entrelacs apporte"
    title: "Une mesure construite pour chaque personne, conçue selon des standards cliniques dès le premier jour."
    accordion:
      - title: "Une mesure propre à chaque personne, validée étape par étape"
        text: "Lacis construit un modèle du lien social propre à chaque personne, ainsi que de son effet sur le bien-être. Les personnes suivies échangent avec l’interface conversationnelle, tandis que la psychométrie déterministe s’exécute de façon fiable en dessous. L’IA conduit la conversation ; elle ne note pas, elle n’évalue pas et elle ne se prononce en rien sur l’état de santé."
      - title: "Une gouvernance clinique réelle, au-delà des déclarations"
        text: "Notre directrice clinique (Chief Clinical Officer) est psychologue clinicienne et exerce depuis quinze ans dans le soin. Nous constituons un comité consultatif clinique (Clinical Advisory Board) de six membres, ancré aux États-Unis comme en France, dont la moitié des sièges au moins revient à des personnes qui reçoivent actuellement en consultation, afin de gouverner les limites cliniques de la plateforme."
      - title: "Une trajectoire réglementaire énoncée avec précision"
        text: "Entrelacs est aujourd’hui un instrument de mesure et de développement, qui n’est ni un dispositif d’identification d’une maladie ni un dispositif de traitement, déployé dans des limites cliniques que gouvernent notre directrice clinique et notre comité consultatif. Nous avons déposé auprès de la FDA une Pre-Submission (dossier de pré-soumission) et visons une classification De Novo (voie réglementaire des instruments inédits) aux États-Unis, ainsi qu’un marquage CE de classe IIa visé pour 2027 dans l’Union européenne, avec l’appui d’études de validation en cours et d’un volet clinique français."
  partnership:
    tag: "Partenariat"
    title: "La suite se construit avec des partenaires, et pas seulement avec une clientèle."
    text: "L’instrument qui rend mesurable la capacité des effectifs se construit aussi en vue d’une mesure de la santé mentale à l’échelle des populations, c’est-à-dire le socle de repérage précoce dont la cardiologie et l’oncologie disposent depuis des décennies. Y parvenir suppose des données longitudinales produites dans de véritables structures de soins."
    subtitle: "Avec qui nous construisons"
    cards:
      - text: "Des cliniques et des systèmes de santé qui achètent la mesure comme un service, sur une redevance de plateforme par patient, et produisent avec nous des données de vie réelle"
      - text: "Des équipes de recherche de notre réseau de validation multipays, qui constituent les cohortes longitudinales sur lesquelles reposera la prochaine génération du moteur"
      - text: "Des organismes payeurs et des autorités de santé publique qui explorent ce qu’une mesure du lien social propre à chaque personne implique pour le risque en population, un échange qui deviendra commercial après l’autorisation et qui commence dès maintenant."

the_science:
  meta:
    title: "Entrelacs — La science"
    description: "Découvrez la recherche qui fonde Entrelacs, pourquoi les mesures moyennes échouent et comment Lacis modélise chaque personne."
  hero:
    title: "La personne moyenne n’existe pas. Nous avons cessé de la mesurer."
    description: "Entrelacs repose sur un constat que la discipline a mis des décennies à accepter : les instruments psychologiques étalonnés sur des populations mesurent systématiquement mal les personnes prises une à une. Lacis, notre moteur propriétaire, modélise une personne à la fois, ce qui change ce que la mesure rend possible."
    cta_demo: "Demander une démo"
    cta_sample: "Voir un rapport type"
  problem:
    tag: "Le piège de la moyenne"
    title: "Pourquoi tous les questionnaires que vous avez remplis ont été conçus pour quelqu’un qui n’existe pas."
    stat1_value: "4,063"
    stat1_label: "pilotes mesurés sur dix dimensions"
    stat2_value: "0"
    stat2_label: "dans la moyenne sur les dix"
    paragraphs:
      - "En 1952, l’U.S. Air Force a mesuré 4 063 pilotes sur dix dimensions afin de concevoir un cockpit adapté au pilote moyen. Aucun ne se situait dans la moyenne sur les dix. La solution retenue, le siège réglable, a posé la première loi de la personnalisation : on n’ajuste pas l’être humain à la moyenne, on construit l’instrument autour de la personne (Daniels, 1952 ; Rose, 2016)."
      - "La mesure psychologique n’a jamais eu son siège réglable. Les enquêtes d’engagement, les questionnaires de bien-être et la plupart des échelles cliniques posent encore les mêmes questions à tout le monde et situent les réponses par rapport à une moyenne de population, perpétuant une hypothèse que la littérature psychométrique a formellement rejetée : celle selon laquelle les statistiques de groupe décrivent les personnes prises une à une (Molenaar, 2004). Deux personnes aux scores identiques peuvent être en difficulté pour des raisons entièrement différentes, et un instrument fondé sur la moyenne reste incapable de les distinguer. Or, lorsqu’un score commande une décision, attribution d’une prestation ou orientation vers un parcours de soins, l’erreur de mesure se convertit en préjudice réel."
      - "L’équipe fondatrice a passé vingt ans au cœur de ce problème, dans la recherche académique, et a contribué à produire les résultats qui l’ont rendu incontestable, en montrant notamment de façon empirique que les instruments standard ne mesurent pas le même construit d’une personne à l’autre. Entrelacs est l’instrument qu’elle a bâti en réponse."
  engine:
    tag: "Le moteur"
    title: "Lacis : une mesure spécifique à chaque personne, issue d’un véritable travail d’ingénierie."
    description: "Des questions ajustées à votre situation et une cartographie claire de vos liens sociaux, pour voir précisément sur quoi agir."
    ksr_title: "Les quatre étapes de la méthode KSR (Key Signature Reconstruction, reconstruction de la signature clé), brevet en instance"
    accordion:
      - title: "Votre sous-groupe, là où les autres instruments prennent la population"
        text: "Avant toute question déterminante, Lacis vous situe parmi des personnes dont le fonctionnement psychologique évolue dans le temps comme le vôtre : un sous-groupe assez restreint pour qu’une conclusion établie sur le groupe reste formellement valide pour chaque personne qui le compose. Les statistiques de population présupposent cette condition, qu’elles ne remplissent presque jamais."
        image: "/images/theSciencePage/engine-mockup.webp"
      - title: "Les questions les plus informatives pour vous"
        text: "Une fois votre sous-groupe identifié, Lacis sélectionne les questions qui portent le plus d’information pour une personne comme vous : non pas une batterie fixe administrée à tout le monde, mais le plus petit ensemble d’items levant le plus vite l’incertitude sur votre configuration propre."
        image: "/images/theSciencePage/engine-mockup.webp"
      - title: "Modélisation en réseau sur 44 domaines"
        text: "Vos réponses sont projetées dans un réseau de 44 domaines psychologiques, de façon à saisir comment ces domaines se relient et se renforcent mutuellement dans votre cas précis, plutôt que d’attribuer à chacun un score isolé comme le font les instruments traditionnels."
        image: "/images/theSciencePage/engine-mockup.webp"
      - title: "Signature et clé de voûte"
        text: "De ce réseau, Lacis extrait votre signature, les quelques domaines qui entraînent tous les autres, et votre clé de voûte, le levier unique le plus susceptible de déplacer l’ensemble du système si vous décidez d’y agir."
        image: "/images/theSciencePage/engine-mockup.webp"
    why_connection:
      title: "Pourquoi le lien social d’abord"
      text: "Le capital cérébral ne peut pas être testé directement à l’échelle des effectifs : le test lui-même se transformerait en épreuve de performance. Il peut en revanche être mesuré à travers ses déterminants, parmi lesquels le lien social réunit la base de preuves la plus solide pour la charge de mesure la plus faible. Le même moteur est conçu pour s’étendre à d’autres déterminants, dont certaines dimensions de la dépression et de l’anxiété, en suivant la même chaîne de validation."
    why_now:
      title: "Pourquoi maintenant"
      text: "Chacune des briques a déjà ses précédents. Des autorités réglementaires ont déjà certifié en Europe, au titre de dispositif médical, l’évaluation clinique conduite par la conversation, et des organismes payeurs financent déjà le repérage du sentiment de solitude dans les populations couvertes. Ce que personne n’avait assemblé, c’est un instrument spécifique à la personne conçu pour le milieu professionnel. C’est la place qu’Entrelacs occupe."
  trust:
    tag: "Confiance"
    title: "La mesure appartient à la personne qui en fait l’objet."
    paragraphs:
      - "Un instrument auquel on répond de façon stratégique ne mesure pas ce qu’il prétend mesurer. C’est le mode de défaillance que les outils historiques n’ont jamais su corriger : les enquêtes d’engagement acheminent les réponses vers la direction, 42 % des personnes salariées estiment qu’en parler nuirait à leur carrière (NAMI & Ipsos, 2025), et les données ainsi produites sont biaisées dans une direction qu’aucune correction statistique ne rattrape. Entrelacs traite l’architecture de confiance comme une composante à part entière de l’instrument."
      - "La personne salariée utilise une interface privée et obtient ses résultats immédiatement : sa signature, sa clé de voûte et la première action à engager. Ses réponses, ses textes et ses données sont chiffrés et ne sont jamais montrés à la direction ni aux ressources humaines. L’organisation ne voit que des tendances au sein de groupes de dix personnes ou plus, jamais qui a dit quoi."
      - "Il ne s’agit pas d’une fonctionnalité de confidentialité ajoutée après coup à un produit de mesure, mais de la condition même de la validité de cette mesure, puisque l’on confie à un miroir ce que l’on ne confiera pas à un employeur."
  ai_boundary:
    tag: "Les limites de l’IA"
    title: "Ce que fait l’IA et ce qu’il lui est interdit de faire."
    paragraphs:
      - "Les organisations acheteuses ont raison de se méfier de l’IA générative en santé mentale. La littérature est sans détour : les modèles généralistes obtiennent de mauvais résultats sur les tâches cliniques à haut risque, tendent à abonder dans le sens des personnes plutôt qu’à les évaluer, et ne font presque jamais l’objet d’une évaluation longitudinale."
      - "Entrelacs est construit contre ces modes de défaillance. Le grand modèle de langage conduit la conversation : il transforme un dialogue naturel en données structurées et restitue les résultats dans une langue simple et bienveillante. Lorsqu’un item validé est reformulé pour l’échange conversationnel, il passe des contrôles d’équivalence psychométrique avant toute mise en production : distributions des réponses, taux de complétion et fonctionnement de l’item sont comparés à ceux de l’instrument d’origine."
    cards:
      - title: "Elle ne calcule aucun score, ne produit aucune évaluation et ne se prononce jamais sur l’état de la personne."
        text: "L’ensemble de la mesure, de la constitution des sous-groupes, de l’estimation du réseau et de la logique de recommandation s’exécute de façon déterministe dans Lacis, de manière auditable, traçable et adossée à un corpus de recherche validé. La structure des sous-groupes est elle-même apprise hors ligne à partir de notre base de recherche, jamais inventée sur le moment par un modèle génératif."
      - title: "Entrelacs n’est ni un service de thérapie ni un dispositif d’intervention en situation de crise."
        text: "Lorsqu’une conversation fait apparaître une détresse aiguë, un protocole d’indication des ressources, placé sous la responsabilité de notre directrice clinique (Chief Clinical Officer), signale immédiatement à la personne où trouver une aide humaine et des ressources d’urgence, l’instrument se bornant à mesurer tandis que le soin, lui, reste l’affaire des personnes."
  solution:
    tag: "Validation et partenariats"
    title: "Adossé à un actif de recherche qu’aucun concurrent ne peut contourner."
    intro: "Lacis est calibré sur un substrat de recherche constitué en cinq ans par l’Annecy Behavioral Science Lab (ABSL). La science est publiée et ouverte ; ce qu’Entrelacs licencie en exclusivité auprès de l’ABSL, c’est la méthode de mesure personnalisée qui s’y appuie. Ses deux composantes les plus longues à produire sont achevées : d’une part une revue exhaustive du champ, qui a passé au crible 9 032 articles en sept langues et recense tous les instruments validés de mesure du lien social ; d’autre part un corpus interculturel de 354 entretiens approfondis, menés dans huit pays et sur quatre continents, puis codés dans le modèle à 44 domaines. L’un comme l’autre ont demandé des années. Un concurrent partirait de zéro sur les deux, car un tel actif ne se reconstitue ni par extraction automatisée du web ni par la lecture de la même littérature publiée, et il s’enrichit à chaque déploiement."
    foundations:
      columns:
        - title: "Politiques publiques et recherche internationale"
          items:
            - "Les travaux de l’ABSL ancrent le cadre européen de suivi du lien social et alimentent l’élaboration par l’OMS d’un Global Index for Social Connection (indice mondial du lien social)"
            - "EU Horizon Europe - projet de recherche LONELY-EU doté de €3M"
            - "Coopération avec l’OCDE sur la mesure de la santé sociale"
            - "Affiliation de recherche avec Oxford University"
        - title: "Réseau académique"
          items:
            - "Psychological Science Accelerator, réseau de recherche présent dans plus de 80 pays, dont notre directeur scientifique (CSO) est directeur associé (Associate Director)"
            - "Conseil scientifique stratégique à Stanford (Dr Michal Kosinski, prédiction comportementale par l’IA) et à UC Davis (Dr Emorie Beck, mesure psychologique personnalisée)"
        - title: "Publié et vérifiable"
          items:
            - "Paris, B., Ropovik, I., Silan, M., d’Hombres, B., Casabianca, E., & IJzerman, H. (2026). Evaluating loneliness measurements across the European Union. Collabra: Psychology, 12(1)."
            - "Coll-Planas, L., Akhter-Khan, S. C., Longworth, G., Srivastava, P., Mosalakanti, S., Silan, M. A., IJzerman, H., & McHugh Power, J. (2026). Rethinking loneliness interventions. — Why connection must be supported at the level of the individual, not the population."
            - "Silan, M. A. (2024). Rethinking multi-site studies in social and personality psychology. Social and Personality Psychology Compass. — The cross-cultural validity problem the 354-interview corpus was built to solve."
            - "Mosalakanti, S., Paris, B., Brickau, D., Luhmann, M., & Rocha IJzerman, H., (2026, August 25). A systematic review of social connection inventories."
            - "Molenaar, P. C. M. (2004). A manifesto on psychology as idiographic science: Bringing the person back into scientific psychology, this time forever. Measurement: Interdisciplinary Research and Perspectives, 2(4), 201–218."
            - "Borsboom, D. (2017). A network theory of mental disorders. World Psychiatry, 16(1), 5–13."
            - "Holt-Lunstad, J., Smith, T. B., Baker, M., Harris, T., & Stephenson, D. (2015). Loneliness and social isolation as risk factors for mortality: A meta-analytic review. Perspectives on Psychological Science, 10(2), 227–237."
            - "World Health Organization. (2025). From loneliness to social connection: Charting a path to healthier societies. Report of the WHO Commission on Social Connection. WHO."
            - "Office of the U.S. Surgeon General. (2023). Our epidemic of loneliness and isolation: The U.S. Surgeon General’s advisory on the healing effects of social connection and community. U.S. Department of Health and Human Services."
    in_progress_label: "En cours :"
    in_progress_text: "d’autres publications à comité de lecture issues du programme de validation Entrelacs sont en préparation ; les cohortes de validation longitudinale sont en cours de conception ; le suivi des résultats cliniques est prévu avec nos premiers partenaires en structure de soins."
  certifications:
    tag: "Réglementation et sécurité"
    title: "Conçu selon des standards cliniques. La certification, étape par étape."
    status:
      title: "Situation à ce jour"
      text: "Un instrument de mesure et de développement, délibérément conçu pour n’être ni un dispositif d’identification d’une maladie ni un dispositif de traitement ; ses limites cliniques relèvent de notre directrice clinique et de notre comité consultatif clinique (Clinical Advisory Board)."
    items:
      - q: "FDA (États-Unis)"
        a: "Pre-Submission (dossier de pré-soumission) déposée ; classification De Novo visée (aucun dispositif prédicat clair n’existe : c’est la voie prévue pour les instruments inédits)"
      - q: "Marquage CE (UE)"
        a: "Classe IIa, visée pour 2027"
      - q: "Gouvernance clinique"
        a: "Comité consultatif clinique en cours de constitution : six membres aux États-Unis et en France, dont au moins la moitié en exercice clinique auprès de sa patientèle ; développement logiciel conduit sous discipline ISO 13485/14971"
      - q: "Propriété intellectuelle"
        a: "La méthode de mesure KSR fait l’objet d’un brevet en instance (demande provisoire déposée aux États-Unis en juin 2026)"
      - q: "Protection des données"
        a: "Infrastructure chiffrée et conforme au RGPD ; hébergement des données dans l’UE pour les déploiements européens ; programme de conformité multi-juridictionnel (UE, Royaume-Uni, Suisse, États-Unis, lois d’État sur la vie privée comprises)"
      - q: "Structures de soins"
        a: "Hébergement sur une infrastructure certifiée HDS, données au repos dans l’Union européenne"
      - q: "Certification de sécurité"
        a: "Préparation de l’audit SOC 2 de type II en cours ; ISO 27001 inscrite à la feuille de route ; documentation de sécurité disponible sur demande pour les équipes achats"
      - q: "Seuil de restitution"
        a: "Seuil d’agrégation fixé à dix personnes ou plus pour toute restitution à l’organisation ; participation volontaire, avec consentement transparent et révocable, y compris pour l’usage en recherche"

team:
  leadership:
    title: "Équipe dirigeante"
    subtitle: "Des compétences réunies à dessein, entre science, technologie et santé."
    list:
      - name: "Dr Hans Rocha IJzerman"
        role: "Directeur général et cofondateur"
        bio: "A travaillé avec l’OMS et la Commission européenne sur la mesure du lien social. Chercheur affilié à l’University of Oxford. Investigateur principal du projet européen LONELY-EU (Horizon Europe), doté de €3M. Ses travaux publiés totalisent plus de 10 000 citations académiques et il compte parmi les grands spécialistes mondiaux du lien social et de la santé mentale."
        image: "/images/teamMembers/DrHansIjzerman.png"
      - name: "Miguel Silan"
        role: "Directeur scientifique"
        bio: "Directeur associé du Psychological Science Accelerator, réseau de recherche mondial présent dans plus de 80 pays. Docteur en psychologie, spécialiste des études à grande échelle sur les systèmes psychologiques complexes. Ses travaux totalisent plus de 1 200 citations académiques. Il a dirigé des études comportementales de référence dans plus de 20 pays afin d’établir des cadres de mesure multidomaines robustes d’une culture à l’autre. C’est sur lui que reposent la validation interculturelle et la méthodologie psychométrique d’Entrelacs."
        image: "/images/teamMembers/DrMiguelSilan.png"
      - name: "Dr Andrews Sobral"
        role: "Directeur technique"
        bio: "Docteur en vision par ordinateur et ancien responsable IA chez ActiveEon, avec plus de 2 800 citations académiques. Il construit le moteur Lacis et l’infrastructure de production qui le soutient, fort d’une expérience des plateformes d’apprentissage automatique et de leur orchestration à grande échelle."
        image: "/images/teamMembers/DrAndrewsSobral.webp"
  extendedLeadership:
    title: "Équipe de direction élargie"
    list:
      - name: "Daniela Rocha Lopes"
        role: "Directrice clinique"
        bio: "Psychologue clinicienne, plus de 15 ans d’expérience de la pratique et de l’organisation des soins en santé mentale. Directrice générale de Solstice Psychologues. Elle garantit l’intégrité clinique de chaque élément de la plateforme Entrelacs."
        image: "/images/teamMembers/DanielaRocha.webp"
      - name: "Alexandra Lung"
        role: "Directrice produit (arrivée prochaine)"
        bio: "A dirigé le produit chez Aircall, de la série B au statut de licorne. Chez Entrelacs, elle pilote le produit sur toute l’expérience des personnes salariées et des équipes RH."
        image: "/images/teamMembers/AlexandraLung.webp"
      - name: "Matthew Reed"
        role: "Directeur financier"
        bio: "Dirigeant financier, 15 ans dans les énergies propres et les industries régulées. Ancien cadre dirigeant du groupe EDF. Il a supervisé au cours de sa carrière $26 milliards levés en capitaux ESG. Il pilote la stratégie financière et les relations investisseurs d’Entrelacs."
        image: "/images/teamMembers/MatthewReed.webp"
      - name: "Cristina Claver Sicilia"
        role: "Directrice des opérations"
        bio: "PharmD, MBA. Spécialiste des opérations dans la santé, forte d’une longue expérience du déploiement de stratégies pharmaceutiques à l’échelle européenne. Elle porte l’excellence opérationnelle et l’accès au marché européen pour Entrelacs."
        image: "/images/teamMembers/DrCristinaClaver.webp"
      # - name: "Katie Cobb"
      #   role: "Directrice marketing (à venir)"
      #   bio: "Fondatrice d'Oxford Comma Strategy et architecte de la stratégie de catégorie d'Entrelacs ainsi que du discours de mise sur le marché aux États-Unis."
        # image: "/images/teamMembers/katieCobb.png"
      - name: "Cyril Marie"
        role: "Responsable de la marque et de la création, France (à venir)"
        bio: "Directeur créatif et entrepreneur depuis vingt-cinq ans ; président d'Inspire Studio, Annecy. Dirige l'identité de marque française, la direction créative et la stratégie presse."
        image: "/images/teamMembers/CyrilMarie.webp"
  advisors:
    title: "Conseil stratégique"
    subtitle: "Nous avançons avec les personnes qui façonnent l’avenir de l’IA, des sciences du comportement et de la santé mondiale."
    list:
      - name: "Dr Michal Kosinski"
        role: "Stanford University"
        bio: "Spécialiste de renommée mondiale de la prédiction comportementale par l’IA et de la psychométrie. Ses recherches sur les empreintes numériques et le profilage psychologique ont été citées plus de 25 000 fois. Il conseille Entrelacs sur sa méthodologie d’IA et ses modèles de prédiction comportementale."
