about:
  hero:
    tag: "À PROPOS DE NOUS"
    heading: "La première plateforme conçue pour prédire les crises de santé mentale — avant qu'elles ne surviennent"
    p1: "Entrelacs est une plateforme de santé mentale préventive alimentée par l'IA qui dépiste, oriente et surveille les individus avec une précision clinique — détectant la détérioration des semaines avant la crise, afin que le bon soutien arrive avant qu'il ne soit urgent."
    p2: "S'appuyant sur trois ans de R&D, plus de 80 000 articles de recherche et une validation clinique dans 8 pays et 37 marchés mondiaux, Entrelacs réunit la modélisation psychométrique dynamique, l'IA conversationnelle et la surveillance continue en une seule plateforme — conçue pour les employeurs, les cliniciens et les systèmes de santé."
    p3: "Nous existons parce que la santé mentale est le seul domaine médical sans système d'alerte précoce fiable. Nous sommes là pour changer cela."
  vision_mission:
    heading: "Vision et mission"
    description: "Un monde où les crises de santé mentale sont prédites, prévenues et ne sont plus inévitables."
    cards:
      - title: "Vision"
        desc: "Un avenir où les soins de santé mentale fonctionnent comme tout autre domaine médical — avec un dépistage de routine, une détection précoce et une intervention proactive comme norme, et non comme exception."
      - title: "Mission"
        desc: "Rendre les soins de santé mentale préventifs universellement accessibles grâce à une psychométrie avancée et à une IA de qualité clinique — en donnant aux individus, aux cliniciens, aux employeurs et aux systèmes de santé les outils pour agir avant que la crise ne frappe."
  pillars:
    heading: "Nos trois piliers"
    t1: "Précision"          
    t2: "Personnalisation"
    t3: "Prévention"
    d1: "Dépister avec une précision clinique, pas au hasard. Une évaluation conversationnelle de 15 minutes remplace les questionnaires fragmentés par une stratification des risques objective et multidimensionnelle."
    d2: "Orienter vers le bon parcours de soins dès la première fois. L’IA connecte chaque individu à l’intervention la plus efficace dès le premier jour — réduisant les échecs de traitement et accélérant l’amélioration par 2 à 3 fois."
    d3: "Détecter la détérioration avant qu’elle ne devienne une crise. Une surveillance continue suit les signaux passifs entre les séances et alerte les équipes de soins des semaines avant une crise — transformant des soins réactifs en soins proactifs."
  origin_story:
    tag: "Notre histoire"
    title: "Née d'une vérité inconfortable. Conçue pour la corriger."
    card:
      heading_lead: "Entrelacs est né d'une question simple et radicale : "
      heading_bold: "et si le patient moyen n'existait pas ?"
      paragraphs:
        - "Pendant des décennies, la mesure psychologique a reposé sur une hypothèse partagée : trouver le schéma qui convient à la plupart des gens, construire autour de ce centre, l'appliquer largement. Mais pour une large part des personnes que ces outils sont censés aider, ce centre produit la mauvaise réponse. La dépression ne se manifeste pas de la même manière chez tout le monde. Ni l'anxiété, ni la solitude, ni l'épuisement professionnel. Un score qui signifie une chose chez une personne signifie autre chose chez une autre — non pas parce que l'instrument est défaillant, mais parce que les individus diffèrent réellement. Les décisions prises sur la base de ces scores s'accumulent : mauvaise lecture, mauvais parcours, des mois perdus."
        - "Nous disposons enfin de la science pour modéliser les individus, et non plus seulement les groupes. Nous disposons de l'architecture de confiance nécessaire pour recueillir des données honnêtes. Il ne manquait qu'une équipe pour construire l'instrument."
        - "Aujourd'hui, Entrelacs mesure le lien social — le déterminant du bien-être mental le mieux étayé scientifiquement et le moins contraignant à mesurer — d'abord pour les entreprises, avec une trajectoire réglementaire vers le soin clinique déjà engagée, et une conviction sous-jacente : mesurer l'individu, pas la moyenne."
  story:
    heading: "Notre histoire"
    subheading: "Née d'une vérité dérangeante. Conçue pour y remédier."
    intro: "Entrelacs a commencé par une question qui semble simple mais qui s'avère radicale :"
    question: "Et si le patient<br>moyen n'existait pas ?"
    main_text: "Pendant des décennies, la science de la santé mentale a fonctionné sur une hypothèse commune : trouver le modèle qui correspond à la majorité, construire autour de ce centre et l'appliquer largement. C'est une approche raisonnable. Mais pour une part importante des personnes que ces outils sont censés aider, elle produit la mauvaise réponse. La dépression ne se manifeste pas de la même manière chez tout le monde. Il en va de même pour l'anxiété, la solitude ou l'épuisement professionnel. Un score sur une échelle qui signifie une chose chez un individu peut signifier tout autre chose chez un autre — non pas parce que l'instrument est défectueux, mais parce que les êtres humains diffèrent véritablement dans leur façon de vivre les états psychologiques. Recommander des soins sur la base de ce score, sans comprendre ces différences, cause de réels préjudices. Et parce que chaque erreur de diagnostic s'aggrave — mauvaise voie, mauvais traitement, mois ou années perdus — le coût de cette erreur est une détérioration évitable."
    hidden_text_1: "Ce n’est pas une hypothèse marginale. C’est ce que la recherche montre de plus en plus clairement. Et c’est ce que de nombreux cliniciens — et de nombreux patients — savent déjà par expérience : trouver les bons soins en santé mentale, adaptés à qui vous êtes réellement, est extrêmement difficile. Quand une évaluation ne reflète pas vraiment qui vous êtes, le parcours de soins qu’elle indique peut être entièrement inadapté. Et trouver les bons soins — adaptés à qui vous êtes réellement — est déjà difficile, même pour des personnes ayant une formation clinique et une bonne connaissance du système. La technologie pour faire mieux existe aujourd’hui. Ce qui manquait, c’était la volonté — et l’équipe — pour la construire correctement."
    hidden_text_2: "Entrelacs a été créé pour combler cet écart. Fondé sur une base de science ouverte — éclairée par plus de 80 000 articles de recherche et développée grâce à des années d’entretiens avec des personnes dans 8 pays — Entrelacs réunit l’IA, la modélisation psychométrique dynamique et la surveillance continue pour faire ce qu’aucun outil de santé mentale n’avait fait auparavant : évaluer, orienter et suivre l’individu, et non la moyenne. Et parce que la plateforme comprend qui est chaque personne — pas seulement son score — elle peut faire ce qu’aucun système réactif ne peut faire : identifier la détérioration avant qu’elle ne devienne une crise, et connecter les personnes au bon soutien avant que cela ne devienne urgent."
    hidden_text_3: "Aujourd’hui, Entrelacs avance vers la certification CE Mark en 2027, avec des partenariats stratégiques incluant Stanford, UC Davis, Oxford et le Psychological Science Accelerator — ainsi qu’une voie commerciale claire vers les employeurs, les systèmes de santé et les réseaux cliniques qui en ont le plus besoin."
