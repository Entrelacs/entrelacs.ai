privacy_policy:
  meta:
    title: "Politique de confidentialité du site Entrelacs"
    description: "Consultez la manière dont Entrelacs collecte, utilise, conserve et protège les données personnelles transmises via le site."
  title: "Politique de confidentialité du site Entrelacs"
  scope_notice: "Cette politique s’applique uniquement aux visiteurs et contacts professionnels interagissant avec le site Entrelacs."
  last_updated_label: "Dernière mise à jour :"
  last_updated_value: "6 janvier 2026"
  introduction:
    title: "1. Introduction"
    p1: "La présente politique de confidentialité explique comment Entrelacs (\"nous\", \"notre\", \"nos\") collecte et traite les données personnelles lorsque vous visitez le site Entrelacs ou interagissez avec lui (le \"Site\")."
    p2: "Cette politique s’applique uniquement aux activités réalisées sur le Site, comme la navigation, l’envoi de demandes de contact ou de démonstration, et les échanges avec nous."
    p3: "L’utilisation de la plateforme Entrelacs, d’une preuve de concept (PoC) ou de tout bilan alimenté par l’IA est régie par des politiques de confidentialité distinctes, applicables lorsque vous accédez à ces services."
    list_intro: "Entrelacs traite les données personnelles conformément :"
    list_items:
      - "au Règlement (UE) 2016/679 (Règlement général sur la protection des données - RGPD)"
      - "à la loi française n° 78-17 relative à l’informatique, aux fichiers et aux libertés"
      - "aux recommandations de l’autorité française de contrôle (CNIL)"
  controller:
    title: "2. Responsable du traitement et contact"
    controller_label: "Responsable du traitement :"
    controller_value: "Entrelacs"
    email_label: "E-mail de contact :"
    email_value: "dpo@entrelacs.ai"
  data_collected:
    title: "3. Données personnelles que nous collectons"
    intro: "Nous collectons uniquement les données nécessaires au fonctionnement du Site et au traitement de vos demandes."
    voluntary:
      title: "a. Informations fournies volontairement"
      intro: "Lorsque vous utilisez les formulaires \"Nous contacter\" ou \"Demander une démo\", nous pouvons collecter :"
      items:
        - "Prénom et nom"
        - "Adresse e-mail"
        - "Nom de l’organisation"
        - "Contenu du message"
      purpose_label: "Finalité :"
      purpose_body: "Répondre à votre demande, vous fournir les informations sollicitées et communiquer avec vous au sujet de votre requête."
    technical:
      title: "b. Données techniques et d’usage"
      intro: "Lorsque vous visitez le Site, nous pouvons collecter :"
      items:
        - "Adresse IP"
        - "Type de navigateur et informations sur l’appareil"
        - "Pages visitées et horodatages"
      purpose_label: "Finalité :"
      purpose_body: "Assurer la sécurité, le bon fonctionnement et la performance du Site."
    health_notice: "Le Site ne collecte pas de données de santé, de données cliniques, de réponses à des bilans ni d’informations de santé protégées (PHI)."
  legal_basis:
    title: "4. Base juridique du traitement (RGPD)"
    headers:
      activity: "Activité de traitement"
      basis: "Base juridique"
      article: "Article du RGPD"
    rows:
      - activity: "Réponse aux demandes de contact ou de démonstration"
        basis: "Consentement"
        article: "Art. 6(1)(a)"
      - activity: "Sécurité du site et journaux techniques"
        basis: "Intérêt légitime"
        article: "Art. 6(1)(f)"
      - activity: "Communications professionnelles"
        basis: "Intérêt légitime"
        article: "Art. 6(1)(f)"
    note: "Lorsque cela est requis, le consentement est recueilli au moyen d’une case à cocher explicite au moment de la soumission des données."
  cookies:
    title: "5. Cookies"
    intro: "Le Site utilise uniquement des cookies essentiels, strictement nécessaires pour :"
    items:
      - "la sécurité"
      - "la gestion de session"
      - "le fonctionnement essentiel du site"
    note: "Nous n’utilisons pas de cookies publicitaires, de traceurs marketing ni de cookies de profilage comportemental."
  retention:
    title: "6. Conservation des données"
    items:
      - "Données de contact et de demande de démonstration : jusqu’à 12 mois, sauf demande de poursuite des échanges"
      - "Journaux techniques : jusqu’à 30 jours"
      - "Les données peuvent être supprimées plus tôt sur demande"
  sharing:
    title: "7. Partage des données et sous-traitants"
    p1: "Nous ne vendons ni ne louons de données personnelles."
    p2: "Les données personnelles peuvent être partagées uniquement avec :"
    items:
      - "le personnel autorisé d’Entrelacs"
      - "des prestataires techniques (par exemple l’hébergement du site), agissant comme sous-traitants dans le cadre d’accords conformes au RGPD"
    p3: "Aucune donnée n’est partagée avec des annonceurs ni avec des plateformes marketing tierces."
  security:
    title: "8. Sécurité des données"
    intro: "Entrelacs met en œuvre des mesures techniques et organisationnelles appropriées pour protéger les données personnelles, notamment :"
    items:
      - "des connexions chiffrées (HTTPS/TLS)"
      - "un accès restreint aux données de contact"
      - "un hébergement sécurisé dans l’Espace économique européen (EEE)"
