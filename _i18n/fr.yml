    less: "Réduire"
  founder:
    tag: "L'histoire du fondateur"
    title: "Le scientifique qui a cessé de croire en la personne moyenne."
    name: "Dr Hans Rocha IJzerman"
    role: "PDG et co-fondateur"
    paragraphs:
      - "Hans Rocha IJzerman a quitté les Pays-Bas à 18 ans pour jouer au basket-ball aux États-Unis, et s'est retrouvé dans un petit collège bénédictin de Pennsylvanie dont les moines suivaient la même règle depuis quinze siècles : prêter attention à chaque individu ; ne traiter personne comme interchangeable. Cette conviction s'est profondément ancrée en lui — et a cohabité difficilement, pendant deux décennies, avec la logique de son propre domaine, qui mesurait de grands groupes, trouvait la tendance centrale et construisait ses outils autour de ce centre."
      - "Ce qui a changé, ce sont les preuves. Lorsque Hans et ses collaborateurs ont testé si les instruments standard de qualité relationnelle mesuraient la même chose chez des personnes différentes, la réponse a été non — clairement, empiriquement, de manière reproductible. Si cela était vrai pour l'amour, c'était vrai pour la dépression, l'anxiété et la solitude — et chaque outil clinique construit sur la moyenne omettait systématiquement quelque chose."
      - "Le coût de cet écart avait un visage : sa partenaire Daniela, psychologue avec quinze ans de pratique, y était confrontée chaque jour — des scores qui ne signifiaient pas ce qu'ils semblaient signifier, des patients orientés vers la mauvaise voie parce que l'instrument n'avait pas été conçu pour les comprendre. Un scientifique convaincu que son domaine posait la mauvaise question. Une clinicienne qui voyait ce que cette question coûtait."
      - "Cette combinaison, c'est Entrelacs."
