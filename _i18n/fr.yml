    p2: "Merci de ne pas soumettre d’informations de santé, médicales ou diagnostiques via les formulaires du Site."
    p3: "Tout traitement de données liées aux soins de santé a lieu uniquement dans les environnements sécurisés de la plateforme Entrelacs et relève de notices de confidentialité distinctes."
  rights:
    title: "10. Vos droits (RGPD)"
    intro: "En vertu du RGPD, vous disposez des droits suivants :"
    items:
      - "accéder à vos données personnelles"
      - "demander leur rectification ou leur suppression"
      - "retirer votre consentement à tout moment"
      - "vous opposer au traitement ou en demander la limitation"
      - "demander la portabilité de vos données"
    contact_intro: "Pour exercer vos droits, contactez :"
    email_value: "dpo@entrelacs.ai"
    subject_label: "Objet :"
    subject_value: "Demande relative à la confidentialité du site"
    response_time: "Nous répondons dans un délai de 30 jours."
  international_visitors:
    title: "11. Visiteurs internationaux"
    p1: "Le Site est exploité depuis l’Union européenne."
    p2: "Le cas échéant, les transferts internationaux de données sont encadrés par des garanties approuvées au titre du RGPD."
  external_links:
    title: "12. Liens externes"
    body: "Le Site peut contenir des liens vers des sites tiers. Entrelacs n’est pas responsable des pratiques de confidentialité de ces sites."
  updates:
    title: "13. Mises à jour de cette politique"
    body: "Nous pouvons mettre à jour cette politique de confidentialité de temps à autre. Toute modification sera reflétée par une mise à jour de la date de dernière mise à jour."
  complaints:
