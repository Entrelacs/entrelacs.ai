      - label: "Ailleurs"
        text: "répertorie les services par pays"
        link_text: "findahelpline.com"
        link: "https://findahelpline.com"
      - label: "Danger immédiat"
        text: "services d'urgence"
    outro: "Si quelque chose dans votre rapport vous a inquiété, parlez-en à un professionnel plutôt que de rester seul avec cela."
    image: "/images/helpNow.jpg"
  who_we_serve:
