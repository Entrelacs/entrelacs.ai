<style>

/* ==========================================================================
   CREDIBILITY BAR
   ========================================================================== */

.credibilityBar {
    background: #E62154;
    padding-top: 56px;
    padding-bottom: 56px;
    box-shadow: 0px 15px 15px 0px rgba(199, 210, 228, 0.15);
    overflow: hidden;
}

.credibilityMarquee {
    width: 100%;
    overflow: hidden;
}

.credibilityTrack {
    display: flex;
    width: max-content;
    animation: credibilityScroll 30s linear infinite;
}

.credibilityTrack:hover {
    animation-play-state: paused;
}

.credibilityTrackItems {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: 56px;
    padding-right: 56px;
    flex-shrink: 0;
}

.credibilityBar p {
    color: var(--text-white, #F4F5F7);
    font-size: 20px;
    font-weight: 500;
    line-height: 1.45;
    margin: 0;
    white-space: nowrap;
}

@keyframes credibilityScroll {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }
}

@media (max-width: 650px) {
    .credibilityBar {
        padding-top: 24px;
        padding-bottom: 24px;
    }

    .credibilityTrackItems {
        gap: 32px;
        padding-right: 32px;
    }

    .credibilityBar p {
        font-size: 16px;
    }
}


</style>

<div class="pageItem credibilityBar">
	<div class="credibilityMarquee">
		<div class="credibilityTrack">
			<div class="credibilityTrackItems">
				{% if include.items %}
				{% for item in include.items %}
				<p>{{ item }}</p>
				{% endfor %}
				{% else %}
				<p>{{ include.item_1 }}</p>
				<p>{{ include.item_2 }}</p>
				{% endif %}
			</div>
			<div class="credibilityTrackItems" aria-hidden="true">
				{% if include.items %}
				{% for item in include.items %}
				<p>{{ item }}</p>
				{% endfor %}
				{% else %}
				<p>{{ include.item_1 }}</p>
				<p>{{ include.item_2 }}</p>
				{% endif %}
			</div>
		</div>
	</div>
</div>
