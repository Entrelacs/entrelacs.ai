<style>
    .ctaBanner {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 100px;
        padding-bottom: 100px;
        background: radial-gradient(120% 150% at 50% 0%, #2E4064 0%, #16223B 60%, var(--surface-teal) 100%);
        background-size: cover;
    }

    .cctas {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 24px;
    }


    .tags {
        display: flex;
        justify-content: center;
        gap: 24px;
    }

    .tags p {
        background: rgba(244, 245, 247, 0.1);
        padding: 7px 18px;
        color: var(--text-white);
        text-align: center;
        font-family: "DM Sans";
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        border-radius: 16px;
    }

    .ctaBanner h2 {
        color: var(--text-white);
        text-align: center;
        font-family: "DM Sans";
        font-size: 50px;
        font-style: normal;
        font-weight: 800;
        line-height: 1.24;
        letter-spacing: -1px;
        margin: 24px 0 16px;
    }

    .ctaBanner p {
        color: #C7D2E4;
        text-align: center;
        font-family: "DM Sans";
        font-size: 18px;
        font-style: normal;
        font-weight: 500;
        line-height: 145%;
        max-width: 1000px;
    }

    .ctaBanner .cta1 {
        color: var(--text-white);
        gap: 8px;
    }

    @media (max-width: 750px) {
        .tags p {
            font-size: 14px;
        }

        .cctas {
            flex-direction: column;
            width: 100%;

        }
        .cctas .cta {
            width: 100%;
            justify-content: center;
        }

        .ctaBanner h2 {
            font-size: 30px;
            margin-top: 24px;
        }
    }
</style>


<div class="pageItem ctaBanner">
    <div class="pageItemContainer">
        <div class="tags">
            {% for tag in site.translations[site.lang].cta_banner.tags %}
            <p>{{ tag }}</p>
            {% endfor %}
        </div>
        <h2>{% t cta_banner.title %}</h2>
        <p>{% t cta_banner.description %}</p>
        <div class="cctas" style="margin-top: 40px;">
            <a href="{{ site.baseurl }}/contact-us/" class="cta">{% t cta_banner.cta_primary %}</a>
            <a href="{{ site.baseurl }}/contact-us/" class="cta cta1">
                {% t cta_banner.cta_secondary %}
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                    <path d="M14.4297 5.92969L20.4997 11.9997L14.4297 18.0697" stroke="#F4F5F7" stroke-width="1.5"
                        stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M3.5 12H20.33" stroke="#F4F5F7" stroke-width="1.5" stroke-miterlimit="10"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </a>
        </div>
    </div>
</div>
