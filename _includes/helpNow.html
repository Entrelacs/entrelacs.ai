<style>
    /* ==========================================================================
   HELP NOW SECTION
   ========================================================================== */

    .helpNowCard {
        display: flex;
        align-items: stretch;
        gap: 64px;
        background: #FEF0F3;
        border-radius: 24px;
        padding: 56px;
    }

    .helpNowText {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .helpNowText h3 {
        font-family: "DM Sans";
        font-weight: 800;
        font-size: 32px;
        line-height: 1.3;
        color: var(--text-dark-teal);
        margin: 0 0 20px 0;
    }

    .helpNowText p {
        font-size: 16px;
        line-height: 1.6;
        color: var(--text-gray);
        margin: 0 0 16px 0;
    }

    .helpNowText ul {
        list-style: none;
        margin: 8px 0 20px 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .helpNowText ul li {
        font-size: 16px;
        line-height: 1.6;
        color: var(--text-gray);
    }

    .helpNowText ul li strong {
        color: var(--text-dark-teal);
        font-weight: 700;
    }

    .helpNowText ul li a {
        color: var(--text-navy-blue);
        text-decoration: underline;
    }

    .helpNowImage {
        flex: 1;
    }

    .helpNowImage img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 16px;
        display: block;
    }

    @media (max-width: 850px) {
        .helpNowCard {
            flex-direction: column;
            gap: 32px;
            padding: 32px 24px;
        }

        .helpNowText h3 {
            font-size: 26px;
        }

        .helpNowImage img {
            max-height: 320px;
        }
    }
</style>
<div class="pageItem lsection" style="background: #F4F5F7;">
    <div class="pageItemContainer">
        <div class="helpNowCard">
            <div class="helpNowText">
                <h3>{% t home.help_now.heading %}</h3>
                <p>{% t home.help_now.intro1 %}</p>
                <p>{% t home.help_now.intro2 %}</p>
                <ul>
                    {% for item in site.translations[site.lang].home.help_now.items %}
                    <li>
                        <strong>{{ item.label }}</strong> — {% if item.link %}<a href="{{ item.link }}" target="_blank"
                            rel="noopener">{{ item.link_text }}</a> {% endif %}{{ item.text }}
                    </li>
                    {% endfor %}
                </ul>
                <p>{% t home.help_now.outro %}</p>
            </div>
            <div class="helpNowImage">
                <img src="{% t home.help_now.image %}" alt="">
            </div>
        </div>
    </div>
</div>
